<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Hire Training — Elite Global Sourcing</title>
<style>
  :root { --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350; --accent:#4f7cff; --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b; }
  html[data-theme="light"] { --bg:#f4f5f9; --surface:#ffffff; --surface2:#f1f3f9; --border:#e1e4ec; --green:#16a34a; --yellow:#d97706; --red:#dc2626; --text:#1e2433; --text2:#475569; --text3:#7b8499; }
  * { box-sizing:border-box; }
  a { color:var(--accent); }
  a.btn { color:var(--text); } a.btn.primary { color:#fff; } a.tab { color:var(--text2); } a.tab.active { color:var(--accent); } .toc a { color:var(--text2); } .toc a.active { color:var(--accent); }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:18px; padding:10px 20px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:800; } header h1 small { font-weight:500; color:var(--text3); font-size:12px; margin-left:6px; }
  nav { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  .tab { padding:7px 14px; border-radius:8px; cursor:pointer; color:var(--text2); font-weight:600; border:1px solid transparent; text-decoration:none; }
  .tab:hover { background:var(--surface2); } .tab.active { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
  .btn { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 14px; cursor:pointer; font:inherit; font-weight:600; text-decoration:none; display:inline-block; }
  .btn:hover { border-color:var(--accent); } .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.sm { padding:4px 10px; font-size:12px; } .btn:disabled { opacity:.45; cursor:not-allowed; } .btn.danger { color:var(--red); }
  main { max-width:1240px; margin:0 auto; padding:20px; }
  .layout { display:grid; grid-template-columns:270px 1fr; gap:20px; align-items:start; }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } .toc { position:static !important; } }
  .toc { position:sticky; top:70px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; max-height:calc(100vh - 90px); overflow:auto; }
  .toc h4 { margin:10px 8px 4px; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); } .toc h4:first-child { margin-top:2px; }
  .toc a { display:flex; justify-content:space-between; gap:6px; padding:6px 10px; border-radius:8px; color:var(--text2); text-decoration:none; font-weight:600; font-size:13px; }
  .toc a:hover { background:var(--surface2); } .toc a.active { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); } .toc .ok { color:var(--green); font-weight:800; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  h2 { margin:0 0 4px; font-size:22px; } h3 { margin:0 0 8px; font-size:16px; } .sub { color:var(--text2); margin-bottom:12px; } .muted { color:var(--text3); }
  .chip { display:inline-block; padding:2px 9px; border-radius:12px; font-size:11.5px; font-weight:700; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); margin:2px 4px 2px 0; }
  .chip.g { background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green); } .chip.y { background:color-mix(in srgb,var(--yellow) 18%,transparent); color:var(--yellow); } .chip.r { background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red); } .chip.n { background:var(--surface2); color:var(--text3); }
  table { width:100%; border-collapse:collapse; margin:8px 0 12px; font-size:13px; } th, td { text-align:left; padding:7px 10px; border:1px solid var(--border); vertical-align:top; } th { background:var(--surface2); }
  .slide { border-top:1px solid var(--border); padding-top:14px; margin-top:14px; } .slide:first-of-type { border-top:none; margin-top:0; padding-top:0; }
  .slide h3 { font-size:17px; } .lead { color:var(--text2); font-style:italic; margin:0 0 10px; } .slide p { margin:0 0 8px; } .slide ul { margin:4px 0 10px; padding-left:20px; } .slide li { margin:2px 0; }
  .slide h5 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); } .src { font-size:12px; color:var(--text3); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; margin:8px 0 12px; }
  .tile { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; } .tile b { display:block; margin-bottom:4px; color:var(--accent); } .tile ul { margin:2px 0; padding-left:18px; } .tile p { margin:0; font-size:13px; }
  .dd { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0 12px; } @media (max-width:640px) { .dd { grid-template-columns:1fr; } }
  .dd > div { border-radius:10px; padding:10px 14px; } .dd .do { background:color-mix(in srgb,var(--green) 10%,transparent); border:1px solid color-mix(in srgb,var(--green) 40%,transparent); } .dd .dont { background:color-mix(in srgb,var(--red) 9%,transparent); border:1px solid color-mix(in srgb,var(--red) 40%,transparent); } .dd b { display:block; margin-bottom:4px; } .dd ul { margin:0; padding-left:18px; }
  .note { background:color-mix(in srgb,var(--yellow) 10%,transparent); border-left:3px solid var(--yellow); padding:8px 14px; border-radius:6px; margin:8px 0; } .note b { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; } .tiles4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; } .stat .v { font-size:26px; font-weight:800; } .stat .l { color:var(--text2); font-size:12px; }
  .bar { height:9px; border-radius:6px; background:var(--surface2); overflow:hidden; min-width:90px; } .bar > i { display:block; height:100%; background:var(--green); } .bar.y > i { background:var(--yellow); } .bar.r > i { background:var(--red); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .spacer { flex:1; }
  .q { font-size:16px; font-weight:600; margin:6px 0 14px; } .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; background:var(--surface2); }
  .opt:hover { border-color:var(--accent); } .opt.sel { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 16%,transparent); } .opt .k { font-weight:800; color:var(--text3); min-width:18px; }
  .opt.right { border-color:var(--green); background:color-mix(in srgb,var(--green) 14%,transparent); cursor:default; } .opt.wrong { border-color:var(--red); background:color-mix(in srgb,var(--red) 12%,transparent); cursor:default; }
  .nav { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; } .nav span { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); cursor:pointer; font-size:12px; font-weight:700; background:var(--surface2); }
  .nav span.done { background:color-mix(in srgb,var(--accent) 22%,transparent); border-color:var(--accent); } .nav span.cur { outline:2px solid var(--accent); }
  .score { font-size:54px; font-weight:900; line-height:1; } .pass { color:var(--green); } .fail { color:var(--red); }
  .expl { background:color-mix(in srgb,var(--accent) 9%,transparent); border-left:3px solid var(--accent); padding:7px 12px; border-radius:6px; margin:6px 0 4px; font-size:13px; }
  details.sec { border:1px solid var(--border); border-radius:10px; padding:4px 14px; margin:8px 0; background:var(--surface); } details > summary { cursor:pointer; font-weight:700; padding:7px 0; }
  textarea { width:100%; min-height:120px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; } input[type=text] { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font:inherit; }
  label.chk { display:flex; gap:8px; align-items:flex-start; margin:4px 0; cursor:pointer; }
  #printHead { display:none; }
  @media print { header, .toc, .noprint, .btn { display:none !important; } body { background:#fff; color:#000; } .card, .stat { border-color:#bbb; background:#fff; color:#000; } main { padding:0; } #printHead { display:block; margin-bottom:12px; } details.sec { display:block; } :root { --text:#000; --text2:#333; --text3:#555; --surface:#fff; --surface2:#f3f3f3; --border:#bbb; } }
</style>

<script>
const LESSONS = [{"id":"d1","name":"Day 1","title":"Orientation & Compliance","desc":"Company overview, general house rules and data security & compliance.","exam":{"pass_pct":80,"minutes":25,"src":"Questions written from the Day 1 slides (no exam was supplied)."},"sections":[{"id":"co_who","title":"Who We Are","slides":[{"title":"Who Are We?","blocks":[{"k":"lead","t":"Introduction to who we are as a company: our story, what we do, and the values that guide how we work."},{"k":"h","t":"Your Global Game Management Partner"},{"k":"p","t":"Headquartered in the United States with core operations in the Philippines, ELITE GLOBAL SOURCING (ELITE) provides end-to-end game management solutions to global clients."},{"k":"h","t":"Specialized BPO & KPO Services"},{"k":"p","t":"Tailored Business and Knowledge Process Outsourcing designed specifically for PC and mobile game developers and publishers worldwide."},{"k":"h","t":"The Elite Advantage"},{"k":"p","t":"Built on our background as an award-winning Western game publisher, ensuring player-first, quality-driven community solutions."},{"k":"h","t":"Team Expertise"},{"k":"p","t":"Our teams are comprised of seasoned game industry and BPO service professionals with years of experience and armed with best practices from different disciplines"},{"k":"h","t":"Proven Track Record"},{"k":"p","t":"Over a decade of industry-leading operational strength, delivering high-quality, long-term partnership solutions across diverse gaming verticals."}]},{"title":"Corporate Overview","blocks":[{"k":"lead","t":"Get to know our structure, services, leadership, partners, and growth plans, and how your work contributes to our mission."},{"k":"cards","nodes":[{"t":"Company Name:","c":[{"t":"ELITE GLOBAL SOURCING LLC","c":[]}]},{"t":"Company Introduction:","c":[{"t":"ELITE is a Philippines-based outsourcing and offshoring provider with U.S. corporate headquarters. We deliver BPO and KPO solutions to PC and mobile publishers worldwide, combining deep industry knowledge, continuous improvement, high-quality standards, and a long-term partnership approach.","c":[]}]},{"t":"Service Disciplines:","c":[{"t":"Publishing Partnership, Customer Support, Community Moderation, Quality Assurance, Localization, Game Management, Marketing and Public Relations, Sales and Distribution, Business Development, Market Research and Business Consulting, Esports Tournaments and Shout-casting, 3D Game Design, and more.","c":[]}]},{"t":"Partners & Clients:","c":[{"t":"PC, Console, and Mobile Game publishers and game developers worldwide.","c":[]}]}]}]},{"title":"Corporate Overview","blocks":[{"k":"lead","t":"Get to know our structure, services, leadership, partners, and growth plans, and how your work contributes to our mission."},{"k":"h","t":"Future Expansions:"},{"k":"p","t":"A second Southeast Asia subsidiary and expansion into South America."},{"k":"cards","nodes":[{"t":"Number of Employee","c":[{"t":"150 + Employees","c":[]}]},{"t":"Date Founded","c":[{"t":"December 2010","c":[]}]},{"t":"CEO / President","c":[{"t":"Johnny H. Paek","c":[]}]},{"t":"Ownership Status","c":[{"t":"Privately Held","c":[]}]}]},{"k":"cards","nodes":[{"t":"Global Headquarters","c":[{"t":"CALIFORNIA, USA","c":[]}]},{"t":"Operational Subsidiary","c":[{"t":"ELITE Global Sourcing Phil Inc. (wholly owned), Philippines","c":[]}]},{"t":"Subsidiary Address:","c":[{"t":"6F Units 607-610, Raffles Corporate Center, F. Ortigas Jr. Road, Ortigas Center, Pasig City.","c":[]}]},{"t":"Korean Subsidiary:","c":[{"t":"ELITE Games Inc. (wholly owned), Seoul, South Korea","c":[]}]}]}]}]},{"id":"co_values","title":"Mission, Vision & Core Values","slides":[{"title":"Mission and Vision","blocks":[{"k":"lead","t":"Understanding our existence and the future we are building."},{"k":"p","t":"Our Corporate MISSION is to satisfy and exceed the expectations of our customers and business partners by delivering innovative and superior game products and services through profound industry knowledge, continuous improvement and utmost quality standard."},{"k":"p","t":"Our VISION is to be the number one global game outsourcing and offshoring solutions provider by constantly achieving operational excellence, industry-leading customer satisfaction and sustainable growth."}]},{"title":"Core Values","blocks":[{"k":"lead","t":"Understanding the shared values that shape our culture and daily decisions."},{"k":"cards","nodes":[{"t":"ENDLESS PASSION","c":[{"t":"Show enthusiasm and keep improving.","c":[]},{"t":"Bring energy and a positive attitude.","c":[]},{"t":"Stay self-driven and motivated.","c":[]},{"t":"Pursue excellence with passion.","c":[]}]},{"t":"LOYALTY","c":[{"t":"Displays genuine commitment to the company.","c":[]},{"t":"Protect confidential information.","c":[]},{"t":"Take an initiative in contributing to growth of the company.","c":[]},{"t":"Take pride in the company and its products.","c":[]}]},{"t":"INTEGRITY","c":[{"t":"Exhibit righteousness and reliability.","c":[]},{"t":"Communicate honesty and openly.","c":[]},{"t":"Adhere to company policies and procedure.","c":[]},{"t":"Demonstrate responsible behavior.","c":[]}]},{"t":"TEAMWORK","c":[{"t":"Work together towards the team’s goal and company’s vision & mission.","c":[]},{"t":"Promotes workplace synergy.","c":[]},{"t":"Provides great learning opportunities","c":[]},{"t":"Provide efficiency and productivity.","c":[]}]},{"t":"EXCELLENCE","c":[{"t":"Demonstrate creativity and innovation.","c":[]},{"t":"Execute and contribute the best efforts toward tasks given.","c":[]},{"t":"Bring about eagerness to achieve outstanding performance toward work.","c":[]}]}]}]}]},{"id":"hr_conduct","title":"Attitude, Professionalism & Dress Code","slides":[{"title":"Attitude & Professionalism","blocks":[{"k":"lead","t":"Build trust through respect, teamwork, and professional communication."},{"k":"h","t":"Respect & Inclusion"},{"k":"ul","items":["Treat colleagues across all shifts, teams, and departments with dignity and fairness.","Value different backgrounds, gaming experience levels, and perspectives."]},{"k":"h","t":"Professional Communication"},{"k":"ul","items":["Keep chats, emails, and verbal interactions constructive and professional.","Avoid offensive language, inappropriate banter, and personal attacks."]},{"k":"h","t":"Handle Conflict Properly"},{"k":"ul","items":["Address disagreements calmly and privately.","Escalate unresolved concerns to your Team Lead or HR—not through floor drama or public arguments."]},{"k":"h","t":"Zero Tolerance for Toxicity"},{"k":"ul","items":["No malicious rumors, exclusion, passive-aggressive behavior, or harassment—verbal, written, or digital."]},{"k":"h","t":"Support the Team"},{"k":"ul","items":["Share non-confidential game knowledge and workflow tips; help during high ticket volume or escalations.","Cooperate respectfully with Team Leads, QA, Trainers, and Operations Managers during coaching and briefings."]}]},{"title":"Dress Code Policy","blocks":[{"k":"lead","t":"Smart casual, safe footwear, and a professional appearance."},{"k":"h","t":"Approved Attire"},{"k":"ul","items":["Company/client-branded apparel, collared shirts, neat plain or graphic T-shirts, jeans, khakis, trousers, blouses, and casual dresses."]},{"k":"h","t":"Not Allowed"},{"k":"ul","items":["Tank tops, singlets, crop tops, excessively ripped jeans showing skin, gym shorts, tracksuits, or beachwear.","No profanity, explicit/violent imagery, political propaganda, illegal-substance references, or direct competitor logos."]},{"k":"h","t":"Footwear"},{"k":"ul","items":["Closed-toe shoes are required on the production floor: sneakers, flats, loafers, boat shoes, or casual boots.","No flip-flops, slides, sandals, open-toe heels, slippers, or Crocs without backstraps."]},{"k":"h","t":"Rainy Season Exception"},{"k":"ul","items":["During heavy rain/typhoons, commute attire such as shorts and slippers may be allowed if building security permits.","Bring standard office clothes and closed-toe shoes; change before logging in.","Store slippers neatly in your locker, bag, or under your desks."]}]}]},{"id":"hr_time","title":"Attendance, Breaks & Timekeeping","slides":[{"title":"Attendance & Break Policy","blocks":[{"k":"lead","t":"Be on time, record time accurately, and follow your scheduled breaks."},{"k":"h","t":"Clock in / Out"},{"k":"ul","items":["Use the official MS Shift Application every workday.","If system/connectivity issues prevent logging, email your Team Lead and IT immediately; unreported issues may be marked tardy or absent."]},{"k":"h","t":"Honest Timekeeping"},{"k":"ul","items":["Never log in/out for a coworker, falsify technical issues, or manipulate logs. This is gross misconduct and may result in termination for both parties."]},{"k":"h","t":"Absences & Medical Documents"},{"k":"ul","items":["Notify your Team Lead (or HR if unreachable) by call, SMS, or chat at least 2 hours before shift start.","For ongoing absences, notify your lead every day.","2+ days absent: submit a valid Medical Certificate upon return. Fit-to-work is required for medical absences exceeding 2 days.","NCNS/AWOL triggers immediate discontinuation of the training period."]},{"k":"h","t":"Punctuality & Disasters"},{"k":"ul","items":["No grace period: be logged in at the exact shift start. Pay is docked for time missed.","Traffic/routine transit delays are not excused.","Penalties may be waived during government-declared disasters; still notify your supervisor 2 hours before shift start."]},{"k":"h","t":"Break Schedule"},{"k":"ul","items":["1st break: 15 minutes after 2 hours","Lunch: 1 hour after 4 hours","2nd break: 15 minutes after 6 hours.","Log every break accurately in the MS Shift Application."]}]}]},{"id":"hr_office","title":"Workplace Hygiene & Working Area","slides":[{"title":"Workplace Hygiene","blocks":[{"k":"lead","t":"Keep yourself, shared equipment, and common areas clean and safe."},{"k":"h","t":"Personal Hygiene"},{"k":"ul","items":["Maintain clean attire, fresh breath, and good personal hygiene.","Avoid heavy perfumes, colognes, and body sprays in the enclosed production floor.","If you have symptoms of a contagious illness, notify your Team Lead and follow company health protocol."]},{"k":"h","t":"Office Cleanliness"},{"k":"ul","items":["Wipe keyboards, mice, headsets, and desk surfaces with approved wipes at the start and end of each shift.","Keep bays free of trash and clutter; use designated bins.","Use sealed drink containers. For spills near electronics, notify IT/Facilities and step back safely."]},{"k":"h","t":"Pantry: Claygo"},{"k":"ul","items":["Eat meals, hot food, and messy snacks in the pantry/breakroom only—not at production desks.","Wash your utensils, wipe tables, and dispose of leftovers/wrappers in the correct wet/dry bins.","Label fridge items with your name and date. Unlabeled/expired items may be removed during weekly cleanouts."]},{"k":"h","t":"Restroom Courtesy"},{"k":"ul","items":["Leave facilities clean and dry; flush, wash hands with soap, and dispose of paper towels properly.","Report leaks, plumbing issues, or missing supplies to Facilities/Floor Ops.","Use restroom breaks efficiently; keep belongings out of shared sink areas."]}]},{"title":"Working Area Policy","blocks":[{"k":"lead","t":"A tidy, secure workstation supports a productive team."},{"k":"h","t":"Clean Desk Standard"},{"k":"ul","items":["Keep the work area free of clutter, loose papers, notebooks, and pens to support client data security requirements.","Please be considerate of the next user by regularly sanitizing your PCs and other devices to prevent cross-contamination and the spread of sickness."]},{"k":"h","t":"Covered Drinks Only"},{"k":"ul","items":["It is highly recommended that you only bring spill-proof, covered tumblers or water bottles at your workstation."]},{"k":"h","t":"No Full Meal  at Stations"},{"k":"ul","items":["No full meal allowed at your station. This protects equipment and helps prevent pests.","Snacks are allowed only if you share."]},{"k":"h","t":"Lock Your Workstation"},{"k":"ul","items":["Press Win + L whenever you step away—even for a brief moment.","Always log out/lock before leaving your station unattended."]}]}]},{"id":"hr_it","title":"Internet, Company Property & Devices","slides":[{"title":"Internet & Company Property","blocks":[{"k":"lead","t":"Protect confidential information and use company resources responsibly."},{"k":"h","t":"Strict Confidentiality"},{"k":"ul","items":["Never post, stream, screenshot, or share unreleased game content, player personal data, developer notes, or internal tools outside authorized channels."]},{"k":"h","t":"Work-only Browsing"},{"k":"ul","items":["Use internet access only for work tools, knowledge bases, and authorized game portals.","Personal streaming (Netflix, Twitch, personal YouTube) and personal social media are monitored and restricted."]},{"k":"h","t":"Equipment & Software"},{"k":"ul","items":["Handle PCs, monitors, and peripherals with care.","Do not install unauthorized third-party software, mods, or cheats on company machines."]}]},{"title":"Device Policy","blocks":[{"k":"lead","t":"Keep personal electronics and unauthorized storage devices off the production floor."},{"k":"h","t":"Secure Personal Devices"},{"k":"ul","items":["Personal phones, smartwatches, cameras, and recording devices must be secured in assigned lockers before entering the production bay."]},{"k":"h","t":"No Personal Storage"},{"k":"ul","items":["USB drives, external hard drives, and personal media storage devices are prohibited on production workstations."]},{"k":"h","t":"Urgent Family Contact"},{"k":"ul","items":["Share the designated Operations Desk/Floor Manager emergency contact details with family members so urgent messages can reach you."]}]}]},{"id":"dpa","title":"Data Privacy Act of 2012 (RA 10173)","slides":[{"title":"Comprehensive Compliance and Data Security","blocks":[{"k":"cards","nodes":[{"t":"INTRODUCTION","c":[{"t":"As a premier turnkey game service and non-voice business process solutions provider, our daily operations involve handling millions of player interactions, support tickets, account verifications, and digital assets for global gaming publishers.","c":[]},{"t":"Protecting player data and following privacy laws isn't just a boring rule we have to check off. It is what keeps our players safe, keeps our business partners happy, and protects our company's good reputation.","c":[]},{"t":"This training teaches every new employee the basic laws, computer safety rules, and daily habits needed to keep our workplace completely safe and secure.","c":[]}]}]}]},{"title":"Republic Act No. 10173","blocks":[{"k":"h","t":"Data Privacy Act of 2012"},{"k":"p","t":"Republic Act No. 10173, officially the “Data Privacy Act of 2012,” is the primary Philippine law protecting an individual's personal information in both government and private sectors."},{"k":"h","t":"Government Policy (section 2)"},{"k":"p","t":"“It is the policy of the State to protect the fundamental human right of privacy, of communication while ensuring free flow of information to promote innovation and growth.”"},{"k":"src","t":"Source:  Data Privacy Act of 2012 (full text), National Privacy Commission"}]},{"title":"Types of Information","blocks":[{"k":"p","t":"Understanding Personal, Sensitive, and Privileged Data Classifications"},{"k":"p","t":"Before we can protect data, we must first recognize what kind of information we are looking at."},{"k":"src","t":"Source:  Data Privacy Act of 2012, Sec. 3 (definitions)"},{"k":"cards","nodes":[{"t":"Real name• Email address• Gamer tag","c":[]},{"t":"Attorney-client interactions• Legal counsel correspondence• Protected legal communications","c":[]},{"t":"Government ID• Payment card details• Health record• Tax return","c":[]}]},{"k":"cards","nodes":[{"t":"Personal Information","c":[{"t":"Data that can immediately identify an individual, such as a written name in a database or specific physical features of a person (See Sec. 3(g) of R.A. 10173).","c":[]}]},{"t":"Privileged Information","c":[{"t":"Data where the law allows sharing or protects confidentiality (See Sec. 3(k) of R.A. 10173).","c":[]}]},{"t":"Sensitive Personal Information","c":[{"t":"Data that if disclosed, lost, or compromised could result in harm, embarrassment, or unfairness to an individual (See Sec. 3(l) of R.A. 10173).","c":[]}]}]}]},{"title":"Data Preservation & Safe Harbor","blocks":[{"k":"lead","t":"Data preservation & ISP liability exemptions: how long logs must be kept and when providers are not liable."},{"k":"p","t":"Because our work involves handling client and player data daily, privacy laws apply directly to our industry."},{"k":"src","t":"Source:  IT & Business Process Association of the Philippines (IBPAP)"},{"k":"cards","nodes":[{"t":"INDUSTRY GROWTH & ROLE","c":[{"t":"The Information Technology and Business Process Management (IT-BPM) sector is one of the best-performing and employment-generating industries in the Philippines. While voice-based services historically comprised a large portion of employment and revenues, non-voice and complex BPO services (such as knowledge process outsourcing, animation, software development, and non-voice gaming support) are highly prominent in the sector.","c":[]}]},{"t":"RELEVANCE TO BPO OPERATIONS","c":[{"t":"Business Process Outsourcing involves a third party assisting with a company's business operations, including customer care and verification processes where sensitive personal information is processed. If data is left unsecured, companies run the risk of data breaches and \"data brokers\" gathering sensitive information to sell quietly to others.","c":[]}]}]}]},{"title":"Why Is IT Important?","blocks":[{"k":"p","t":"Protecting Individual Rights and Safeguarding Institutional Trust"},{"k":"p","t":"Privacy laws exist for a powerful reason—to keep people safe and maintain trust in digital systems."},{"k":"src","t":"Source:  1987 Philippine Constitution, Article III (Bill of Rights)"},{"k":"cards","nodes":[{"t":"Statutory Compliance vs. General Prohibition","c":[{"t":"Statutory Compliance: The obligation of individuals and organizations to follow the rules, requirements, and responsibilities established by data privacy laws.","c":[]},{"t":"General Prohibition: The restriction against unauthorized or unlawful collection, processing, access, use, or disclosure of personal information.","c":[]}]},{"t":"Constitutional Protection:","c":[{"t":"Refers to the FUNDAMENTAL RIGHT of every individual to privacy, particularly the protection of private communications and correspondence against unreasonable or unauthorized interference, as guaranteed by the Philippine Constitution.","c":[]}]}]}]},{"title":"Criteria for Lawful Processing","blocks":[{"k":"p","t":"Legal Grounds and Requirements for Handling Personal Information"},{"k":"p","t":"We cannot just collect or view player data freely; the law sets specific conditions for when it is legally allowed.  As stated in Section 12 of the Data Privacy Act of 2012, personal information may only be processed under specific criteria:"},{"k":"p","t":"Consent of the data subject"},{"k":"p","t":"The player or employee explicitly agrees (checkbox, form, or direct action) to collection and use for a specific purpose."},{"k":"p","t":"Pursuant to law"},{"k":"p","t":"No consent required"},{"k":"p","t":"A law or regulation requires processing without asking first, e.g., reporting financial fraud or complying with tax laws."},{"k":"p","t":"Allowed immediately in a life-or-death emergency; rare in non-voice gaming support."},{"k":"p","t":"Protect life and health"},{"k":"p","t":"Health data may be processed when strictly required to provide proper care or treatment."},{"k":"p","t":"Medical treatment"},{"k":"p","t":"Protect lawful rights"},{"k":"p","t":"Court, legal, regulatory"},{"k":"p","t":"Information may be shared or reviewed to defend rights or handle a legal case, dispute, or official investigation."},{"k":"src","t":"Source:  Data Privacy Act of 2012, Sec. 12"}]},{"title":"Outsourcing and Subcontracting Agreements","blocks":[{"k":"p","t":"Managing Data Protection Obligations and Third-Party Risk"},{"k":"p","t":"When companies share work with a BPO, strict rules and contracts must be followed to keep data secure."},{"k":"src","t":"Source:  Implementing Rules and Regulations of the DPA"},{"k":"cards","nodes":[{"t":"PIC Accountability & Contractual Controls","c":[{"t":"Personal Information Controller (PIC) may outsource processing if it uses contracts or other reasonable means to prevent unauthorized use. The PIC stays fully accountable, and a binding contract must meet National Privacy Commission (NPC) requirements.","c":[]}]},{"t":"BPO Employer Mandates","c":[{"t":"Companies in IT-BPM must obtain individual consent, ensure fair and lawful processing, clearly define the extent of data use, and retain information only as long as necessary.","c":[]}]}]}]},{"title":"Guidelines for Handling Personal Data","blocks":[{"k":"p","t":"Best Practices for Collection, Storage, Usage, and Disposal"},{"k":"p","t":"Daily operational habits dictate how securely we manage data while assisting players on the floor."},{"k":"src","t":"Source:  National Privacy Commission"},{"k":"cards","nodes":[{"t":"DATA MINIMIZATION &PURPOSE LIMITATIONS","c":[{"t":"Agents must only view or process information required for the active support ticket or chat verification.","c":[]}]},{"t":"NO UNAPPROVED TOOLS","c":[{"t":"Never copy-paste player chat logs, real names, or billing details into unapproved public AI tools, external translation software, or personal messaging apps.","c":[]}]},{"t":"PHYSICAL & DIGITAL CLEAN DESK","c":[{"t":"Lock workstations immediately (Windows + L) when stepping away and ensure zero physical notes containing personal data are kept on the production floor.","c":[]}]}]}]},{"title":"Rights of Data Subjects","blocks":[{"k":"p","t":"Empowering Individuals Under the Data Privacy Framework"},{"k":"p","t":"Any individual retain legal ownership and control over their own personal information at all times."},{"k":"p","t":"Companies must tell you what data they collect, why, how long they keep it, and who handles it."},{"k":"p","t":"Right to be Informed"},{"k":"p","t":"Right to be Informed"},{"k":"p","t":"Right to Object"},{"k":"p","t":"The right to say “No”"},{"k":"p","t":"Stop use of your data for marketing, ads, or automated profiles, unless law or contract requires it."},{"k":"p","t":"Ask for exact copies of the data held about you, where it came from, and who it was shared with."},{"k":"p","t":"Right to Access"},{"k":"p","t":"The right to see"},{"k":"p","t":"Wrong, outdated, or incomplete data must be corrected right away, and recipients notified."},{"k":"p","t":"Right to Rectification"},{"k":"p","t":"The right to fix errors"},{"k":"p","t":"Right to Erasure or Blocking"},{"k":"p","t":"The right to be forgotten"},{"k":"p","t":"Ask to delete, block, or destroy data that is incorrect, no longer needed, or used illegally."},{"k":"src","t":"Source:  NPC: Know Your Rights"}]},{"title":"Security and Data Breaches and Notifications","blocks":[{"k":"p","t":"Incident Management, Prevention Strategies, and Reporting Protocols"},{"k":"p","t":"Protecting data isn't just about computer security; it also includes securing our physical workspace and hardware."},{"k":"p","t":"Three Pillars of Security: Security measures must be classified into organizational, physical, and technical safeguards as outlined in Section 25 of the DPA IRR."},{"k":"src","t":"Source:  Implementing Rules and Regulations of the DPA"},{"k":"cards","nodes":[{"t":"Organizational Safeguards: Policies, people, and governance.","c":[{"t":"Data Protection Officer (DPO): Designated compliance lead.","c":[]},{"t":"Privacy Training: Mandatory employee onboarding and annual refreshers.","c":[]},{"t":"Privacy Policies: NDAs, clean-desk rules, and data handling protocols.","c":[]},{"t":"Vendor Governance: Mandatory third-party vetting and Data Transfer Agreements.","c":[]}]},{"t":"Physical Safeguards: Protection of facilities, hardware, and paper records.","c":[{"t":"Access Control: Keycards or biometrics for server rooms and file archives.","c":[]},{"t":"Workstation Security: Privacy screens and lockable storage drawers.","c":[]},{"t":"Facility Security: CCTV coverage and badge-only facility entry.","c":[]},{"t":"Secure Disposal: Locked paper recycling bins and cross-cut document shredding.","c":[]}]},{"t":"Technical Safeguards: Protection of software, networks, and digital systems.","c":[{"t":"Encryption: AES-256 for data stored at rest and TLS for data in transit.","c":[]},{"t":"Access Management: Multi-Factor Authentication (MFA) and Role-Based Access Control (RBAC).","c":[]},{"t":"Network Defense: Firewalls, Endpoint Detection & Response (EDR), and intrusion protection.","c":[]},{"t":"Data Protection: System audit logging and automated off-site backups.","c":[]}]}]}]},{"title":"Security and Data Breaches and Notifications","blocks":[{"k":"p","t":"Incident Management, Prevention Strategies, and Reporting Protocols"},{"k":"h","t":"Year-end Reporting"},{"k":"p","t":"Contents of the notification"},{"k":"p","t":"The notification must describe the breach nature, personal data involved, measures taken by the entity to reduce harm, representative contact details, and any assistance provided to affected data subjects."},{"k":"p","t":"Nature of the breach"},{"k":"p","t":"Personal data involved"},{"k":"p","t":"Measures taken to reduce harm"},{"k":"p","t":"Representative contact details"},{"k":"p","t":"Assistance provided to affected data subjects"},{"k":"h","t":"Hour Notice"},{"k":"p","t":"Entities must submit year-end security incident summary reports to the NPC. In the event of a data breach, affected data subjects and the NPC must be notified within 72 hours to mitigate potential fraud."},{"k":"src","t":"Source:  Implementing Rules and Regulations of the DPA"}]}]},{"id":"cyber","title":"Cybercrime Prevention Act (RA 10175)","slides":[{"title":"Republic Act No. 10175","blocks":[{"k":"h","t":"Cybercrime Prevention"},{"k":"h","t":"Act of 2012"},{"k":"p","t":"Republic Act No. 10175, officially known as the \"Cybercrime Prevention Act of 2012,\" is the primary Philippine law designed to penalize illegal online acts, protect computer systems, and secure digital information and networks."},{"k":"src","t":"Source:  Republic Act No. 10175, Official Gazette"}]},{"title":"What Is Cybercrime?","blocks":[{"k":"p","t":"Understanding Illegal Online Acts and Digital Offenses"},{"k":"p","t":"Before we can prevent digital crimes, we must first understand what constitutes illegal behavior in computer environments."},{"k":"p","t":"Government Definition & Scope"},{"k":"p","t":"Physical & Digital Forms"},{"k":"p","t":"Cybercrime is criminal activity committed using a computer, especially to illegally access, transmit, or manipulate data. As discussed in R.A. 10175, cybercrime is not limited to online or software-based activities, as it encompasses various mediums."},{"k":"p","t":"The scope of the act includes actions such as modifications of physical systems intended for use to aid other cybercrime acts. It can range from claiming a domain name to create negative reception or sending unsolicited messages to targeted groups, all the way to severe violations of basic human rights."},{"k":"src","t":"Source:  Republic Act No. 10175, Official Gazette"}]},{"title":"Why Is IT Important?","blocks":[{"k":"p","t":"Balancing Digital Freedom and System Security"},{"k":"p","t":"Cybercrime laws exist to protect our right to access information while stopping malicious actors from exploiting digital networks."},{"k":"src","t":"Source:  1987 Philippine Constitution, Article III (Bill of Rights)"},{"k":"cards","nodes":[{"t":"Balancing Freedom and Security","c":[{"t":"The freedom of information is beneficial to the accountability of governing bodies, corporate institutions, and individuals exercising their right to freedom of speech. In facilitating open access to data, there must be safeguards to avoid misuse, abuse, and illegal access.","c":[]}]},{"t":"Protecting Natural and Juridical Persons","c":[{"t":"The Cybercrime Prevention Act allows free access to information while safeguarding confidential information from unsolicited access. Defining the boundaries of proper internet use is crucial in mitigating misuse and protecting the rights of natural persons (individuals) and juridical persons (such as corporations like BPOs), as specified in Article III of the 1987 Philippine Constitution.","c":[]}]}]}]},{"title":"Kinds of Cybercrime Offenses","blocks":[{"k":"p","t":"Offenses under the law are categorized into four major groups that affect digital operations:"},{"k":"p","t":"Offenses I: Data & Systems"},{"k":"p","t":"Illegal Access"},{"k":"p","t":"Illegal Interception"},{"k":"p","t":"Data Interference"},{"k":"p","t":"Accessing any part of a computer system without right."},{"k":"p","t":"Technical interference with data without right (normal job functions and lawful quality checks excepted)."},{"k":"p","t":"Intentionally changing, damaging, deleting, or degrading data without right, including spreading viruses."},{"k":"p","t":"System Interference"},{"k":"p","t":"Misuse of Devices"},{"k":"p","t":"Cyber-squatting"},{"k":"p","t":"Intentionally altering, delaying, or disrupting network functions without authority."},{"k":"p","t":"Creating, using, acquiring, or distributing devices, passwords, or codes meant for cybercrime."},{"k":"p","t":"Acquiring a domain name in bad faith to harm or profit from another's trademark or name."},{"k":"src","t":"Source:  Republic Act No. 10175, Sec. 4(a)"}]},{"title":"Kinds of Cybercrime Offenses","blocks":[{"k":"p","t":"Offenses under the law are categorized into four major groups that affect digital operations:"},{"k":"p","t":"Offenses II: Computer-related"},{"k":"p","t":"Computer-related Forgery"},{"k":"p","t":"Computer-related Fraud"},{"k":"p","t":"Computer-related Identity Theft"},{"k":"p","t":"Entering, changing, or deleting computer data without right, producing false data meant to pass as real."},{"k":"p","t":"Causing damage through unauthorized input, alteration, or deletion of data, or interference with a program."},{"k":"p","t":"Deliberate use, possession, or misuse of identifying information of a person or corporation without right."},{"k":"p","t":"Gaming: account takeovers"},{"k":"src","t":"Source:  Republic Act No. 10175, Sec. 4(b)"}]},{"title":"Kinds of Cybercrime Offenses","blocks":[{"k":"p","t":"Offenses under the law are categorized into four major groups that affect digital operations:"},{"k":"p","t":"Offenses III: Content-related"},{"k":"p","t":"Cybersex"},{"k":"p","t":"Child Pornography"},{"k":"p","t":"Engaging in, maintaining, or operating lascivious displays of sexual activity through a computer system for consideration."},{"k":"p","t":"Prohibited acts under R.A. No. 9775 committed through computer systems."},{"k":"p","t":"Cyberlibel"},{"k":"p","t":"Unsolicited Commercial Communications"},{"k":"p","t":"Defamatory statements under Art. 355 of the Revised Penal Code committed through a computer system."},{"k":"p","t":"Commercial spam is allowed only with recipient consent or to existing users, with a reliable opt-out, no disguised source, and no misleading subject lines."},{"k":"src","t":"Source:  Republic Act No. 10175, Sec. 4(c)"}]},{"title":"Kinds of Cybercrime Offenses","blocks":[{"k":"p","t":"Offenses under the law are categorized into four major groups that affect digital operations:"},{"k":"p","t":"Offenses IV: Other Offenses"},{"k":"p","t":"Aiding or Abetting in the Commission of Cybercrime"},{"k":"p","t":"Attempt in the Commission of Cybercrime"},{"k":"p","t":"Intentional support or assistance in the execution of any cybercrime."},{"k":"p","t":"A premeditated and conscious attempt to perform a cybercrime."},{"k":"p","t":"Training reminder"},{"k":"p","t":"Helping anyone access a system or account without right can expose you to liability, even if you did not do it alone."},{"k":"src","t":"Source:  Republic Act No. 10175, Sec. 5"}]},{"title":"SERVICE PROVIDERS’ DUTIES and  EXTENT OF LIABILITY","blocks":[{"k":"p","t":"Legal Obligations and Safe Harbor Protections for BPOs"},{"k":"p","t":"Organizations and tech facilities must properly preserve digital data and follow strict rules to maintain legal protection."},{"k":"h","t":"Service Providers’ Duties"},{"k":"h","t":"Extent of Liability"},{"k":"p","t":"Data Preservation & Destruction: It is the duty of a service provider (such as a BPO or tech facility) to preserve the integrity of computer data for the appropriate statutory duration unless law requires otherwise. Upon the expiration of the preservation period, the computer data in question must be immediately and completely destroyed."},{"k":"ul","items":["Safe Harbor Protections: No person or party of a service provider shall be subject to civil or criminal liability if they merely provide access and liability is claimed based on data creation or distribution, provided that the service provider:","Does not have actual knowledge or is not aware of the facts or circumstances of the unlawful act.","Does not directly commit, induce, or cause any infringement or unlawful act.","Does not knowingly receive a financial benefit directly resulting from the illegal activity."]},{"k":"src","t":"Source:  Republic Act No. 10175, Secs. 13 and 30"}]}]},{"id":"gdpr","title":"GDPR & Daily Data Hygiene","slides":[{"title":"GDPR - Eu 2016/679","blocks":[{"k":"h","t":"General Data Protection Regulation"},{"k":"p","t":"The General Data Protection Regulation (Regulation EU 2016/679) is the comprehensive European Union privacy law governing how organizations collect, handle, and secure personal data."},{"k":"h","t":"Extraterritorial Reach:"},{"k":"p","t":"GDPR applies to any organization globally—including Philippine BPOs—that processes the personal data of individuals located in the European Union (e.g., European gamers submitting support tickets, account recovery forms, or in-game purchases)"},{"k":"src","t":"Source:  GDPR full text, gdpr-info.eu"}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"h","t":"GDPR Foundations and Core Concepts"},{"k":"p","t":"Understanding European Privacy Standards and Global Reach"},{"k":"p","t":"GDPR protects the fundamental rights and freedoms of EU residents' personal data, ensuring confidentiality and lawful handling wherever the BPO or publisher is located."},{"k":"h","t":"Core Terminology"},{"k":"src","t":"Source:  GDPR Art. 4: Definitions"},{"k":"cards","nodes":[{"t":"Data Subject• The player or gamer whose personal data is collected and processed.","c":[]},{"t":"Data Controller• The gaming publisher or client who decides why and how player data is processed.","c":[]},{"t":"Data Processor• The BPO agency and its non-voice agents, who process player data strictly on behalf of the Controller.","c":[]}]}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"h","t":"The 7 Key Principles"},{"k":"p","t":"Understanding European Privacy Standards and Global Reach"},{"k":"p","t":"The 7 Key Principles form the foundational framework for responsible data privacy, security, and governance in customer support. These focus heavily on:"},{"k":"p","t":"OTHER KEY PRINCIPLES: Lawfulness, Fairness & Transparency | Accuracy | Storage Limitation | Accountability"},{"k":"src","t":"Source:  GDPR Art. 5: Principles relating to processing"},{"k":"cards","nodes":[{"t":"Data Minimization• Only collecting and viewing information strictly necessary for the active support ticket.","c":[]},{"t":"Purpose Limitation• Using player data only for authorized support purposes (never using player emails or contact info for unauthorized outreach)..","c":[]},{"t":"Integrity & Confidentiality• Ensuring robust technical and organizational security measures are enforced at all times.","c":[]}]}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"p","t":"GAMING-SPECIFIC PII (Personally Identifiable Information)"},{"k":"p","t":"Recognizing Direct and Indirect Player Data"},{"k":"p","t":"Verifying a player's identity must always be done carefully so we never ask for or expose unnecessary sensitive details. We must learn how to identify what constitutes personal data within gaming ecosystems"},{"k":"h","t":"Direct PII"},{"k":"h","t":"Indirect / Gaming PII"},{"k":"ul","items":["Real names","Email addresses","Physical addresses","Government IDs (age or identity verification during account recovery)","Payment and billing details","IP addresses","Device identifiers (MAC addresses, hardware IDs)","Linked social media accounts","Transaction histories","Support chat logs","In-Game Names (IGNs) when tied to an individual account holder"]},{"k":"src","t":"Source:  GDPR Art. 4: Definitions (personal data)"}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"h","t":"Account Verification and Authentication"},{"k":"p","t":"Safeguarding Player Ownership & Preventing Data Over-Collection"},{"k":"p","t":"Establishes mandatory procedures for validating player identity prior to account access or status changes, safeguarding user accounts against unauthorized access while minimizing data exposure."},{"k":"src","t":"Source:  GDPR Art. 32: Security of processing"},{"k":"cards","nodes":[{"t":"Strict Verification Flows","c":[{"t":"Rigorous training on how to properly verify account ownership before disclosing any account details or modifying account status (especially critical when handling hacked or lost accounts).","c":[]}]},{"t":"Avoiding Over-Collection","c":[{"t":"Agents must never ask players for excessive PII (e.g., asking for a full credit card number instead of just the last 4 digits, or requesting unnecessary government documents).","c":[]}]},{"t":"Handling Passwords","c":[{"t":"Agents must never ask players for plaintext passwords, nor should they store sensitive authentication tokens in unsecure personal files.","c":[]}]}]}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"p","t":"HANDLING DATA SUBJECT ACCESS REQUEST (DSARs)"},{"k":"p","t":"Managing Player Rights to Data and Erasure"},{"k":"p","t":"Players have strict legal rights to access or delete their data, and knowing how to spot these requests is critical for compliance."},{"k":"src","t":"Source:  GDPR Art. 15: Right of access"},{"k":"cards","nodes":[{"t":"I. Right to Access & Portability (Art. 15 & 20)","c":[{"t":"Definition: Players can ask what personal information the company holds and request a downloadable, machine-readable copy.","c":[]},{"t":"In simple terms:  Gamers own their data. Asking to see account history, chat logs, or purchase records is a formal legal right, not a routine support question.","c":[]}]}]},{"k":"cards","nodes":[{"t":"Ticket Samples","c":[{"t":"“Send me a copy of all my support tickets and live chat logs from the last six months.”","c":[]},{"t":"“I want an export of my purchase history, linked payment methods, and IP login logs.”","c":[]},{"t":"“What personal details do you have linked to my account ID?”","c":[]}]},{"t":"Agent action","c":[{"t":"Do not compile logs or copy-paste raw database lines into the reply. Identify the ticket as a DSAR and escalate immediately per company workflow.","c":[]}]}]}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"h","t":"Security and Operational Hygiene"},{"k":"p","t":"Maintaining Daily Disciplines on the Production Floor"},{"k":"p","t":"Keeping player data safe requires consistent daily habits, from locking our screens to avoiding unapproved external tools."},{"k":"src","t":"Source:  GDPR Art. 32: Security of processing"},{"k":"cards","nodes":[{"t":"Clean desk & clean screen","c":[{"t":"No personal phones, writing materials, or unapproved recording devices on the operational floor. Lock workstations instantly (Windows + L) when stepping away.","c":[]}]},{"t":"Data Leak Prevention","c":[{"t":"Strictly prohibiting the copying of player details to personal notes, external translation tools, or unauthorized chat apps (e.g., Discord or personal messaging).","c":[]}]},{"t":"Phishing & Social Engineering","c":[{"t":"Training agents to spot trickery, such as malicious actors attempting to use fake documentation or high-pressure tactics to hijack high-value player accounts (whaling/account theft).","c":[]}]}]}]},{"title":"GDPR - Eu 2016/679 : General Data Protection Regulation","blocks":[{"k":"h","t":"Incident Management and Data Breach Reporting"},{"k":"p","t":"Zero-Delay Escalation for Security Events"},{"k":"p","t":"If a mistake or security slip happens, reporting it instantly ensures our team and clients can respond before deadlines pass."},{"k":"p","t":"Zero-delay internal reporting"},{"k":"p","t":"What constitutes a breach?"},{"k":"p","t":"Misdirected support emails"},{"k":"p","t":"Sending player logs or chat histories to the wrong ticket submitter"},{"k":"p","t":"Compromised agent login credentials"},{"k":"p","t":"Unauthorized system access"},{"k":"h","t":"Hours"},{"k":"p","t":"GDPR requires Controllers to report breaches to supervisory authorities within 72 hours."},{"k":"p","t":"Internal policy: report any suspected breach to your Team Leader or Quality Analyst immediately so the client can act fast."},{"k":"src","t":"Source:  GDPR Art. 33: Notification of a personal data breach"}]}]},{"id":"penal","title":"Violations, Penalties & Glossary","slides":[{"title":"Enforcement","blocks":[{"k":"h","t":"Non-compliance, Violations"},{"k":"h","t":"& Penalties"},{"k":"p","t":"Failing to follow data privacy, cybercrime, and GDPR frameworks carries severe legal, financial, and professional consequences, punished under Philippine criminal law, EU regulation, and internal BPO guidelines."},{"k":"src","t":"Source:  Republic Act No. 10175, Official Gazette"}]},{"title":"Internal BPO Disciplinary Actions","blocks":[{"k":"p","t":"Violations and employment consequences"},{"k":"src","t":"Source:  Data Privacy Act of 2012, Sec. 34 (extent of liability)"},{"k":"cards","nodes":[{"t":"TYPES OF VIOLATIONS","c":[{"t":"Minor infractionse.g., leaving a terminal unlocked briefly","c":[]},{"t":"Major infractions","c":[{"t":"Intentional data leakage, credential sharing, phishing participation, or rude/defamatory chat behavior","c":[]}]}]}]},{"k":"cards","nodes":[{"t":"FINES AND CONSEQUENCES","c":[{"t":"Summary Termination","c":[{"t":"Immediate dismissal for cause due to gross negligence, data security breaches, or fraud.","c":[]}]},{"t":"Civil Litigation","c":[{"t":"The company or client may sue employees to recover financial losses or statutory penalties.","c":[]}]},{"t":"Industry Blacklisting","c":[{"t":"Offenses logged in BPO compliance registries, blocking future IT-BPM employment.","c":[]}]}]}]}]},{"title":"R.A. 10173 Violations and Penalties","blocks":[{"k":"p","t":"Data Privacy Act of 2012: Type of Violations"},{"k":"p","t":"Types of Violations & Degrees:"},{"k":"p","t":"Processing personal or sensitive personal information without valid consent or legal authorization."},{"k":"p","t":"Unauthorized Processing:"},{"k":"p","t":"Processing Due to Negligence:"},{"k":"p","t":"Failing to secure data or providing unauthorized access as a result of negligence."},{"k":"p","t":"Discarding or abandoning personal data in public areas or standard trash containers."},{"k":"p","t":"Improper Disposal:"},{"k":"p","t":"Unauthorized Access:"},{"k":"p","t":"Intentional Breach"},{"k":"p","t":"Intentionally breaking into a system where personal data is stored."},{"k":"p","t":"Security Breaches Concealment:"},{"k":"p","t":"Failing to report a known data breach or hiding security incidents from authorities or data subjects."},{"k":"src","t":"Source:  Data Privacy Act of 2012, Chapter VIII (Secs. 25-36)"}]},{"title":"R.A. 10173 Violations and Penalties","blocks":[{"k":"p","t":"Data Privacy Act of 2012: Imprisonment and Fines"},{"k":"p","t":"Also punishable:  unauthorized access or intentional breach into a system storing personal data."},{"k":"src","t":"Source:  Data Privacy Act of 2012, Chapter VIII (Secs. 25-36)"},{"k":"table","rows":[["VIOLATION","IMPRISONMENT","FINE"],["Unauthorized processing of personal information","1 to 3 years","₱500,000 to ₱2,000,000"],["Unauthorized processing of sensitive personal information","3 to 6 years","₱500,000 to ₱4,000,000"],["Negligence / improper disposal","6 months to 6 years","₱100,000 to ₱4,000,000\nDepends on data sensitivity"],["Concealment of security breach","1.5 to 5 years","₱500,000 to ₱1,000,000"]]}]},{"title":"R.A. 10175 Violations and Penalties","blocks":[{"k":"p","t":"Cybercrime Prevention Act of 2012: Type of Violations"},{"k":"p","t":"Types of Violations & Degrees:"},{"k":"p","t":"Illegal access, illegal interception, data interference, and system interference."},{"k":"p","t":"System & Data Offenses:"},{"k":"p","t":"Computer-Related Fraud & Theft:"},{"k":"p","t":"Computer-related forgery, fraud, and identity theft (such as unauthorized transfer of in-game items or account takeovers)."},{"k":"p","t":"Content-Related Offenses:"},{"k":"p","t":"Cyber libel, unsolicited commercial communications, and aiding/abetting cybercrimes."},{"k":"src","t":"Source:  Republic Act No. 10175, Secs. 4 and 8"}]},{"title":"R.A. 10175 Violations and Penalties","blocks":[{"k":"p","t":"Cybercrime Prevention Act of 2012: Imprisonment and Fines"},{"k":"p","t":"One-degree-higher rule"},{"k":"p","t":"Penalties for crimes like libel or fraud committed through ICT are set one degree higher than their offline equivalents under the Revised Penal Code."},{"k":"src","t":"Source:  Republic Act No. 10175, Secs. 4 and 8"},{"k":"table","rows":[["VIOLATION","IMPRISONMENT","FINE"],["General cybercrime offenses","Prision Mayor (6 to 12 years)\nAfflictive penalty, Art. 27, Revised Penal Code","At least ₱200,000 up to maximum actual damages, or both"],["Offenses against critical infrastructure","Reclusion Temporal (heavier terms)","At least ₱500,000"]]}]},{"title":"GDPR Non-compliance Fines","blocks":[{"k":"p","t":"Two tiers of administrative fines"},{"k":"p","t":"Technical non-compliance"},{"k":"p","t":"Core rights violations"},{"k":"p","t":"Failure to maintain proper records"},{"k":"p","t":"Inadequate security controls"},{"k":"p","t":"Failing to notify a breach within 72 hours"},{"k":"p","t":"Ignoring DSAR requests"},{"k":"p","t":"Refusing the Right to Erasure"},{"k":"p","t":"Unlawful cross-border data transfers"},{"k":"p","t":"€10M  or  2%"},{"k":"p","t":"€20M  or  4%"},{"k":"p","t":"One-degree-higher rule"},{"k":"p","t":"Penalties for crimes like libel or fraud committed through ICT are set one degree higher than their offline equivalents under the Revised Penal Code."},{"k":"p","t":"of total worldwide annual turnover of the preceding financial year, whichever is higher."},{"k":"p","t":"of total worldwide annual turnover of the preceding financial year, whichever is higher."},{"k":"src","t":"Source:  GDPR Art. 83: Administrative fines"}]},{"title":"Glosarry","blocks":[{"k":"p","t":"1. Data Privacy Act of 2012 (RA 10173) & Local Frameworks"},{"k":"p","t":"* DPA: Data Privacy Act of 2012 (Republic Act No. 10173) — The primary Philippine law protecting personal information and individual privacy rights."},{"k":"p","t":"* NPC: National Privacy Commission — The government body tasked with administering and implementing the Data Privacy Act and monitoring data breach reports in the Philippines."},{"k":"p","t":"* PIC: Personal Information Controller — A person or organization (such as our gaming client/publisher) that controls the collection, holding, processing, or use of personal information."},{"k":"p","t":"* PIP: Personal Information Processor — A natural or juridical person or organization (such as our BPO agency and its agents) that processes personal data on behalf of a PIC."},{"k":"p","t":"* PII: Personally Identifiable Information — Any data that can be used to identify a specific individual (e.g., name, email address, phone number)."},{"k":"p","t":"* SPI: Sensitive Personal Information — High-risk personal data (e.g., government IDs, health records, tax returns, financial/payment details) that requires strict handling under Philippine law."},{"k":"p","t":"* IRR: Implementing Rules and Regulations — The detailed official guidelines set by the government to carry out the provisions of a law."},{"k":"p","t":"3. General Data Protection Regulation (GDPR)"},{"k":"p","t":"* GDPR: General Data Protection Regulation (EU Regulation 2016/679) — The European Union’s stringent privacy and data protection framework governing the personal data of EU residents."},{"k":"p","t":"* DSAR: Data Subject Access Request — A formal request made by a player or user to exercise their GDPR rights, such as requesting a copy of their data or demanding account erasure."},{"k":"p","t":"* DPO: Data Protection Officer — The designated corporate official responsible for overseeing data privacy compliance, managing security audits, and handling data breaches."},{"k":"p","t":"* EU / EEA: European Union / European Economic Area — The geographic region whose citizens’ data is heavily protected under GDPR regulations, regardless of where the processing BPO is located globally."},{"k":"p","t":"4. General BPO & Operational Acronyms"},{"k":"p","t":"* BPO: Business Process Outsourcing — The business method of contracting third-party service providers (like Elite Global Sourcing) to handle customer support, non-voice moderation, and technical operations."},{"k":"p","t":"* IT-BPM: Information Technology and Business Process Management — The overarching industry sector encompassing tech, BPO, animation, and non-voice support operations in the Philippines."},{"k":"p","t":"* SLA: Service Level Agreement — The strict contractual or legal deadline within which tasks (such as resolving support tickets or escalating DSARs) must be completed."},{"k":"p","t":"* DLP: Data Loss Prevention — Company software and policies designed to detect and prevent unauthorized sharing or leakage of sensitive data."},{"k":"p","t":"* IGN: In-Game Name — A player’s unique digital handle or character name inside a gaming ecosystem, which can constitute indirect PII when linked to an account."},{"k":"p","t":"2. Cybercrime Prevention Act of 2012 (RA 10175)"},{"k":"p","t":"* RA 10175: Republic Act No. 10175 (Cybercrime Prevention Act of 2012) — The Philippine law penalizing computer-related offenses, illegal access, data/system interference, and digital fraud."},{"k":"p","t":"* ISP: Internet Service Provider — A company that provides access to the internet, which shares certain legal “safe harbor” duties regarding data preservation under the law."},{"k":"p","t":"* OTP: One-Time Password — A secure authentication code used as part of multi-factor authentication (MFA) to verify user or agent log-ins."}]}]}]},{"id":"d3","name":"Day 3","title":"Customer Support","desc":"Tickets, live chat, market reviews, escalation, emergency reports and CXQA.","exam":{"pass_pct":80,"minutes":30,"src":"20 multiple-choice questions from the supplied Day 3 exam. The pass mark was not stated, so 80% is assumed."},"sections":[{"id":"roles","title":"Roles & Responsibilities","slides":[{"title":"Customer Support","blocks":[{"k":"lead","t":"Opens the training, sets expectations and shows the learning path from basics to final assessment."},{"k":"cards","nodes":[{"t":"What is Customer Support?","c":[{"t":"Customer Support refers to the range of services and assistance provided by a company to its customers—helping them solve problems, answer questions, and ensure they get maximum value from the products or services they purchase. It encompasses various communication channels such as email tickets, live chats, and public market reviews.","c":[]}]},{"t":"Why Customer Support Matters","c":[{"t":"Direct Human Connection: Customer support is often the primary or only direct human contact point a customer has with the company.","c":[]},{"t":"Drives Retention and Revenue: High service quality builds long-term customer trust and loyalty while reducing customer churn.","c":[]},{"t":"Acts as a Vital Feedback Loop: Support interactions provide insights that inform product and engineering teams about bugs, usability issues, and feature needs.","c":[]},{"t":"Protects Brand Reputation: Every ticket resolution, live chat conversation, and public review reply represents the brand image and influences public trust.","c":[]}]}]}]},{"title":"Roles and Responsibilities","blocks":[{"k":"lead","t":"Defines the daily duties, standards and conduct of a CS representative."},{"k":"dd","do":["Own the customer's issue until it is resolved or properly handed off","Stay calm and professional with upset customers","Document every action","Admit when you don't know, then find out"],"dont":["Say \"that's not my job\" or pass the customer around","Argue, blame the customer or reply emotionally","Rely on memory or leave notes empty","Guess or promise things you can't confirm"]},{"k":"p","t":"Good conduct builds: Customer Trust → Efficient Workflows → High CSAT Scores → Brand Growth."}]}]},{"id":"csat","title":"CSAT & Related Metrics","slides":[{"title":"Customer Satisfaction","blocks":[{"k":"p","t":"Introduces customer satisfaction as the gap between what a customer expected and what they received"},{"k":"p","t":"Do's and Don'ts"},{"k":"ul","items":["Do: resolve the issue fully, confirm the customer is satisfied, be warm in the closing","Don't: ask customers for a high rating, argue with a low score, or ignore negative comments"]},{"k":"cards","nodes":[{"t":"What is CSAT and why is it important?CSAT is a short Customer Satisfaction survey sent after a support interaction, such as a closed ticket or completed live chat, to measure the customer's experience using a rating scale (e.g., 1–5 or thumbs up/down), with the CSAT percentage calculated by dividing the number of satisfied responses by the total number of responses and multiplying by 100, based on the company's defined satisfaction criteria.CSAT serves as a direct indicator of customer-perceived service quality and is used to evaluate individual and team performance, identify opportunities for process improvement, and assess employee effectiveness, while low scores may reveal training gaps, unclear policies, or product-related issues; therefore, customer comments should be carefully reviewed, as they often provide more meaningful insights than the scores alone.","c":[]}]}]},{"title":"CSAT Types and Related Metrics","blocks":[{"k":"p","t":"Different ways to measure satisfaction"},{"k":"p","t":"Customer Satisfaction can be measured in several ways, depending on the type of feedback being collected and the aspect of the customer experience being evaluated. These metrics help organizations assess service quality, customer loyalty, resolution efficiency, and overall customer experience. Understanding each metric allows CS representatives to recognize how their performance and customer interactions contribute to the company's service standards and goals."},{"k":"table","rows":[["Metric","What it measures","Typical question"],["CSAT (ticket or chat level)","Satisfaction with one interaction","\"How satisfied were you with this support?\""],["Overall or relationship CSAT","Satisfaction with the company or product over time","\"How satisfied are you with our service?\""],["NPS (Net Promoter Score)","Loyalty and likelihood to recommend","\"How likely are you to recommend us (0–10)?\""],["CES (Customer Effort Score)","How easy it was to get help","\"How easy was it to resolve your issue?\""],["FCR (First Contact Resolution)","Share of issues solved in the first contact","Measured from CXQA"],["Average handling time","Time spent per ticket or chat","Measured from CXQA"],["Review rating","Public star rating in app market","Customer-initiated"]]}]}]},{"id":"cxqa","title":"CXQA Scoring","slides":[{"title":"CXQA Scoring Range","blocks":[{"k":"p","t":"How a CXQA evaluation is rated, and what a critical error does to the score"},{"k":"h","t":"Great"},{"k":"p","t":"90-99"},{"k":"h","t":"Good"},{"k":"p","t":"70-89"},{"k":"h","t":"Average"},{"k":"p","t":"50-69"},{"k":"h","t":"Needs Improvement"},{"k":"p","t":"0-49"},{"k":"h","t":"Unacceptable"},{"k":"h","t":"Critical Error"},{"k":"p","t":"If an agent makes a critical error, they receive 0 points for the entire Customer Service QA Evaluation."},{"k":"p","t":"Critical items: 1.2 professional and courteous response  |  3.A.1 account access verified  |  3.A.2 data protection and compliance  |  3.B.2 correct fees charged"},{"k":"h","t":"Where the 100 Points Come From"},{"k":"p","t":"40 pts"},{"k":"p","t":"Customer Experience and Resolution"},{"k":"p","t":"Section 1: accurate, complete resolution, plus a critical professionalism check"},{"k":"p","t":"58 pts"},{"k":"p","t":"Agent Ownership of Customer Issues"},{"k":"p","t":"Section 2: information sharing, interaction handling, service quality and writing quality"},{"k":"p","t":"2 pts"},{"k":"p","t":"Security and Business Policies"},{"k":"p","t":"Section 3: promotions (2 points), plus critical checks on security and billing"}]},{"title":"CXQA Scorecard (1 of 3)","blocks":[{"k":"p","t":"Section 1: Customer Experience. Section 2: Information Sharing,  Ticket and Live Chat handling"},{"k":"p","t":"What the reviewer scores on every ticket and chentireat. Each evaluation is scored out of 100 points. Items marked CRITICAL carry no points, but a miss on any of them results in 0 for the evaluation."},{"k":"p","t":"NOTE: CXQA Scorecard criteria may vary per team/client requirement."},{"k":"table","rows":[["CRITERIA","POINTS"],["CUSTOMER EXPERIENCE AND RESOLUTION (Customer Experience)",""],["1.1  Customer's concern was completely addressed in an accurate manner","40"],["1.2  Response was professional and courteous, ensuring a positive experience regardless of customer feedback","CRITICAL"],["AGENT OWNERSHIP OF CUSTOMER ISSUES (A. Information Sharing)",""],["2.A.1  Asked relevant clarifying/probing questions to fully understand the issue","5"],["2.A.2  Utilized the knowledge base and GM tools effectively to ensure accurate resolution","5"],["2.A.3  Showed sound judgment in choosing the correct course of action","10"],["AGENT OWNERSHIP OF CUSTOMER ISSUES (B. Customer Interaction Handling (Ticket & Chat))",""],["2.B.1  Followed escalation and transfer guidelines","3"]]}]},{"title":"CXQA Scorecard (2 of 3)","blocks":[{"k":"p","t":"Section 2 (continued): Ticket and Live Chat handling, service quality and writing"},{"k":"p","t":"NOTE: CXQA Scorecard criteria may vary per team/client requirement."},{"k":"table","rows":[["CRITERIA","POINTS"],["AGENT OWNERSHIP OF CUSTOMER ISSUES (B. Customer Interaction Handling (Ticket & Chat))",""],["2.B.1  Followed escalation and transfer guidelines","3"],["AGENT OWNERSHIP OF CUSTOMER ISSUES (C. Customer Service Quality)",""],["2.C.1  Used appropriate greetings and closing statements","3"],["2.C.2  Expressed empathy where necessary, demonstrating understanding of the customer's inconvenience","10"],["2.C.3  Maintained adherence to the brand's communication style and tone, ensuring consistency","3"],["2.C.4  Demonstrated ownership by following up when necessary and communicating next steps","10"],["AGENT OWNERSHIP OF CUSTOMER ISSUES (D. Writing Quality)",""],["2.D.1  Used appropriate punctuation marks","3"],["2.D.2  The response is grammatically correct","3"],["2.D.3  No jargon was used in the response","3"]]}]},{"title":"CXQA Scorecard (3 of 3)","blocks":[{"k":"p","t":"Section 3: service quality, writing, security and billing"},{"k":"p","t":"NOTE: CXQA Scorecard criteria may vary per team/client requirement."},{"k":"table","rows":[["CRITERIA","POINTS"],["AGENT COMPLIANCE WITH SECURITY & BUSINESS POLICIES (A. Security)",""],["3.A.1  Verified account access before sharing any sensitive information","CRITICAL"],["3.A.2  Adhered to relevant data protection and compliance laws","CRITICAL"],["AGENT COMPLIANCE WITH SECURITY & BUSINESS POLICIES (B. Billing Services)",""],["3.B.1  Informed customers about relevant promotions, events or services when applicable","2"],["3.B.2  Charged correct fees and followed billing policies","CRITICAL"]]}]},{"title":"CXQA Process and Metrics","blocks":[{"k":"p","t":"How a CXQA review works, from sampling to improvement"},{"k":"p","t":"CXQA results feed the metrics on the CSAT slide: First Contact Resolution (FCR) and Average Handling Time are measured from CXQA, alongside the overall QA score (out of 100)."},{"k":"h","t":"CXQA Process Step"},{"k":"table","rows":[["Step","What happens","Your role as a CS representative"],["1. Sampling","Reviewers pick tickets, chats and reviews from your recent work","Handle every interaction as if it will be reviewed"],["2. Evaluation","Each sample is scored against the scorecard with comments","Document your actions so the reviewer can follow them"],["3. Feedback","Scores and coaching notes are shared with you by your lead","Read it, ask questions and acknowledge the feedback"],["4. Calibration","Reviewers and leads align on how the standards are scored","Raise any score you disagree with, with specific examples"],["5. Improvement","Recurring gaps become coaching, refreshers or template updates","Apply the feedback and watch your next review scores"]]},{"k":"cards","nodes":[{"t":"1","c":[{"t":"SAMPLING","c":[]}]},{"t":"2","c":[{"t":"EVALUATION","c":[]}]},{"t":"3","c":[{"t":"FEEDBACK","c":[]}]},{"t":"4","c":[{"t":"CALIBRATION","c":[]}]},{"t":"5","c":[{"t":"IMPROVEMENT","c":[]}]}]}]}]},{"id":"ticket","title":"Tickets, SLA & Email Format","slides":[{"title":"Support Ticket &","blocks":[{"k":"h","t":"Management"},{"k":"p","t":"Defines a ticket, its lifecycle and why every concern must be logged"}]},{"title":"Ticket Management","blocks":[{"k":"p","t":"The record of every customer concern"},{"k":"h","t":"Types of Ticket Status"},{"k":"cards","nodes":[{"t":"NEWA newly submitted ticket that has not yet been reviewed, assigned, or handled by a CS representative.","c":[]},{"t":"OPENA ticket that is currently being handled by a CS representative or replied to by the user and requires further action, or resolution.","c":[]},{"t":"PENDING/ON-HOLDA ticket on hold pending further details, customer response, or internal department updates.","c":[]},{"t":"CLOSED/RESOLVEDA ticket where the customer's concern has been successfully addressed and no further action is required.","c":[]},{"t":"DUPLICATE / MERGEDMultiple tickets from the same user about the same issue. Merged to prevent redundant work and streamline handling under a single ticket.","c":[]},{"t":"ESCALATEDA ticket transferred to specialized teams for complex investigation, authorization, or advanced technical resolution.","c":[]}]},{"k":"cards","nodes":[{"t":"What is a TICKET and why it matters","c":[{"t":"A ticket is a logged customer request or concern, typically submitted through email or a support form (e.g., Salesforce or Zendesk), that contains relevant customer details, issue descriptions, communication history, internal notes, status, and priority. It serves as a centralized record to ensure accountability, traceability, SLA monitoring, and accurate reporting.\n\nTo keep every ticket moving, each one carries a ticket status: a label showing where it stands in its lifecycle, who owns the next step, and whether further action is needed. As a ticket progresses from New → Open → Pending → Resolved → Closed, its status updates, helping the team track progress, prioritize work, set customer expectations, and measure performance.","c":[]}]}]}]},{"title":"Main Types of Tickets","blocks":[{"k":"p","t":"Introduces the usual ticket categories with a realistic scenario for each, so trainees can classify quickly"},{"k":"p","t":"Tickets are categorized based on the nature, complexity, and urgency of the customer's concern to ensure that each issue is handled by the appropriate support level and follows the correct procedures."},{"k":"table","rows":[["Ticket type","What it is","Sample scenario"],["Account / access","Login, password, verification","\"I can't log in. The reset email never arrives.\""],["Billing / payment","Charges, refunds, failed payments","\"I was charged twice for the same order.\""],["Technical / bug","Errors, crashes, features not working","\"The app freezes every time I open my profile.\""],["General Inquiry","General questions about the game, features or policies, etc.","\"How do I change my registered email?\""],["Complaint","Dissatisfaction with product or service","\"This is the third time I'm reporting this and nobody fixed it.\""],["Feedback / Suggestions","Suggestions","\"Please add a dark mode.\""],["Report","Misbehavior, policy breaker, player reports.","“I would like to report player ABC for saying racist remarks on the world chat”"],["Other (e.g., partnership, spam)","Non-standard","“I’m an influencer with 1 million followers and I’m interested in a partnership in exchange to game items”"]]}]},{"title":"24-hour Service Level Agreement (SLA)","blocks":[{"k":"p","t":"Every ticket gets a response within 24 hours"},{"k":"p","t":"A ticket arrives at 9:00 AM Monday. The 24-hour target falls at 9:00 AM Tuesday. If the issue needs Tier 2 and cannot be resolved by then, the customer still receives an update before the deadline."},{"k":"cards","nodes":[{"t":"Operational Introduction:","c":[{"t":"The Service Level Agreement (SLA) is our operational commitment to deliver timely, reliable customer support across all ticket types.\"","c":[]}]},{"t":"12h + 12h SLA Standard Specified:","c":[{"t":"Explicitly broken down into 12 Hours for First Response and 12 Hours for Final Resolution within the 24-Hour overall SLA target.","c":[]},{"t":"SLA Exemptions & Exclusions Added: Outlined SLA pause rules when tickets are set to Pending (awaiting customer reply), Escalated, or during tool maintenance windows.","c":[]}]},{"t":"Queue Prioritization & Timing Rules:","c":[{"t":"The SLA timer begins immediately upon ticket creation and establishes priority for oldest/near-breach tickets.","c":[]}]},{"t":"SLA Risk Escalation & Impact","c":[{"t":"Breaching SLAs damages customer trust, brand loyalty, and team metrics; agents must monitor ticket ages and immediately alert leads to any high-risk cases.","c":[]}]}]}]},{"title":"Ticket Handling Time","blocks":[{"k":"lead","t":"Sets the handling-time standards and explains how to work within them without sacrificing quality."},{"k":"table","rows":[["","Tier 1 tickets","Tier 2 tickets"],["Complexity","Simple, common, repeatable","Complex, unusual or needs investigation or tools"],["Who handles it","Frontline beginner-level CS representatives","Seasoned / tenured / senior agents and leads"],["Resolved with","Templates, knowledge base, standard steps, websites and FAQs","Checks across tools, account or system review, coordination with other teams"],["Sample concerns","Password reset, how-to question, order status, basic app guidance","Payment discrepancy, repeated or unresolved bug, account issue needing investigation"],["Handling time","5 minutes (per ticket)","15 minutes (per ticket)"]]},{"k":"h","t":"Important Notes"},{"k":"ul","items":["A ticket moves up a tier when it cannot be resolved with knowledge or general info.","Tier 1: A customer asks how to change their registered email.","Tier 2: A customer asks to change their registered email.","Tiers are not about the customer's importance: every customer gets the same respect and the same 24-hour SLA."]},{"k":"h","t":"Tips for Staying on Time"},{"k":"ul","items":["Read the whole ticket once, check history first, use approved templates, personalize the opening and closing, avoid re-reading.","If a ticket will clearly exceed its standard, follow the escalation or pending procedure instead of letting it sit."]}]},{"title":"Proper Email Format","blocks":[{"k":"lead","t":"Mastering a consistent email format ensures every customer interaction is clear, empathetic, and aligned with our brand standards."},{"k":"h","t":"Email Parts"},{"k":"p","t":"Greetings"},{"k":"p","t":"Address the customer by name using a warm and professional greeting."},{"k":"h","t":"Description / Purpose"},{"k":"p","t":"Branding"},{"k":"p","t":"Incorporate the company's approved branding elements immediately after the greeting, such as the company introduction, brand identity, or standard branded opening statement."},{"k":"p","t":"Acknowledgment and Empathy"},{"k":"p","t":"Show that you understand the customer's concern by expressing empathy and acknowledging their experience."},{"k":"p","t":"Resolution or Action Items"},{"k":"p","t":"Provide accurate, clear, and easy-to-understand information. Use numbered steps or bullet points when explaining procedures or troubleshooting instructions."},{"k":"p","t":"Next Steps or Expectations"},{"k":"p","t":"Clearly explain what information or action is needed from the customer, or what they can expect from the support team, including any applicable timeframe."},{"k":"p","t":"Closing"},{"k":"p","t":"End with a friendly and reassuring statement, offer further assistance, and sign off using your name, department, and the company's approved email signature."},{"k":"h","t":"Reminder:"},{"k":"p","t":"Maintain consistent company branding throughout every customer interaction while ensuring that responses remain personalized, professional, empathetic, and customer focused."}]},{"title":"Sample Response Email","blocks":[{"k":"p","t":"Structured email response, the professional way"},{"k":"cards","nodes":[{"t":"Greetings","c":[{"t":"Hello, Player!","c":[]}]},{"t":"Branding","c":[{"t"
