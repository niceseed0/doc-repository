rformance, quality, and overall player experience."},{"k":"p","t":"Goal: To understand the purpose of each type of game testing and learn how they help identify issues, improve gameplay, and ensure a smooth and enjoyable gaming experience."}]},{"title":"Overview and Functionality Testing","blocks":[{"k":"p","t":"Why There Are Different Types of Testing"},{"k":"p","t":"Each type of testing finds a different kind of problem, and a normal test cycle combines several types. Functionality testing is the most common and checks every feature against the design."},{"k":"h","t":"How Testing Types Are Used"},{"k":"table","rows":[["FUNCTIONALITY TESTING COVERED AREAS",""],["Testing Area","Description"],["Controls and Input","Ensures buttons, touch, keyboard, and controller responses work correctly."],["Menus and Navigation","Verifies that every screen opens, closes, and links correctly."],["Progression and Rewards","Checks that levels unlock, objectives are completed, and rewards are properly granted."],["Purchases and Accounts","Ensures in-game purchases, login, and account features function correctly."]]},{"k":"cards","nodes":[{"t":"SCRIPTED VS UNSCRPITED","c":[{"t":"Testing may follow predefined test cases or use exploratory approaches to identify unexpected issues and uncover potential defects.","c":[]}]},{"t":"CHOOSING A TYPE","c":[{"t":"The appropriate testing method depends on the game's development stage, potential risks, testing priorities, and available schedule.","c":[]}]},{"t":"COMBINING TYPES","c":[{"t":"A single testing cycle often combines functionality, compatibility, and regression checks to ensure overall game quality and stability.","c":[]}]}]}]},{"title":"Compatibility, Performance, Localization, Usability and Balance Testing","blocks":[{"k":"p","t":"Running Well Everywhere and Feeling Right to Every Player"},{"k":"p","t":"These tests check that the game works across devices and regions and that it feels good to players with different skill levels."},{"k":"table","rows":[["TECHNICAL TESTING",""],["Testing Type","Description"],["COMPATIBILITY","Checks whether the game works properly across different devices, operating system versions, screen sizes, browsers, and controllers to ensure a consistent experience."],["PERFORMANCE","Evaluates frame rates, loading times, memory usage, battery consumption, and overall stability, including performance during extended playing sessions."]]},{"k":"table","rows":[["PLAYER EXPERIENCE TESTING",""],["Testing Type","Description"],["LOCALIZATION","Ensures accurate translations, proper text display, cultural appropriateness, and correct formatting of dates, currencies, and other region-specific content."],["USABILITY","Assesses how easy the game is to understand, navigate, and play, particularly for first-time players unfamiliar with its controls and mechanics."],["BALANCE AND PLAYTESTING","Evaluates game difficulty, pacing, fairness, and overall enjoyment to ensure challenges are appropriate, rewards are \u000bsatisfying, and gameplay remains engaging."]]}]},{"title":"Smoke, Sanity, and Regression Testing","blocks":[{"k":"p","t":"Quick Checks and Protecting Existing Features"},{"k":"p","t":"These tests are run repeatedly during development to confirm that builds are usable and that changes have not broken anything."},{"k":"p","t":"Tip: Retesting focuses on the specific bug that was fixed, while regression testing checks whether the changes affected other existing features."},{"k":"table","rows":[["TESTING DIFFERENCES","","",""],["Testing Type","Description","Sample Scenario","Key Difference"],["Smoke Testing","Checks if a new build is stable \u000benough for testing.","Launching the game and checking \u000blogin and main menu access.","Checks overall build stability."],["Sanity Testing","Verifies a specific change or fix.","Checking if a character's jumping \u000bability works after a fix.","Focuses on a specific change."],["Regression Testing","Ensures existing features still work after updates.","Checking inventory, movement, and purchases after an inventory update.","Checks for unintended side effects."],["Retesting","Rechecks a reported bug after it \u000bhas been fixed.","Repeating a purchase to confirm item delivery works.","Confirms a specific bug is resolved."]]}]},{"title":"Other Testing Types","blocks":[{"k":"p","t":"Additional Approaches Used in Game QA"},{"k":"p","t":"Depending on the game and platform, other testing types may be needed to cover specific risks."},{"k":"table","rows":[["ADDITIONAL TESTING TYPES","",""],["Testing Type","Description","Sample Scenario"],["Network and Multiplayer Testing","Checks connection stability, player synchronization, and \u000bserver performance.","Testing whether players can join matches, play without \u000blag, and see each other's actions correctly."],["Compliance Testing","Ensures the game meets platform, console, and app store requirements.","Checking whether the game follows Google Play or Apple App Store submission guidelines."],["Exploratory and Ad Hoc Testing","Uses unscripted testing based on the tester's judgment to discover unexpected issues.","Randomly combining actions, navigating menus, or testing unusual gameplay scenarios to find bugs."],["Security and Cheat Testing","Identifies exploits, unauthorized modifications, cheating \u000bmethods, and data vulnerabilities.","Attempting to manipulate in-game currency, modify game files, or access another player's account."],["Black Box vs. White Box Testing","Black box tests functionality without viewing the code, while white box examines internal code and logic.","Black box: Testing if a purchase works. White box: \u000bChecking the code responsible for processing the purchase"]]}]}]},{"id":"proc","title":"QA Procedures & Monitoring","slides":[{"title":"QA Procedures","blocks":[{"k":"lead","t":"A structured set of steps and guidelines followed by QA testers to identify, document, track, and verify issues throughout the game testing process."},{"k":"p","t":"Goal: To help new hires understand and apply proper QA procedures, perform systematic testing, document findings accurately, and ensure game quality before release."}]},{"title":"QA Procedure Overview and Planning","blocks":[{"k":"p","t":"A Repeatable Workflow and Getting Ready to Test"},{"k":"p","t":"A defined QA procedure keeps testing consistent, traceable, and easy to hand over between testers. Good preparation prevents wasted time once testing starts."},{"k":"h","t":"Workflow Summary"},{"k":"h","t":"Preparation Steps"},{"k":"p","t":"Consistency:"},{"k":"p","t":"Every tester follows the same steps, so results"},{"k":"p","t":"can be compared."},{"k":"cards","nodes":[{"t":"Receive Build","c":[{"t":"Plan","c":[]},{"t":"Design Test","c":[]},{"t":"Execute","c":[]},{"t":"Report","c":[]},{"t":"Verify","c":[]},{"t":"Close","c":[]}]}]},{"k":"cards","nodes":[{"t":"Review requirements","c":[{"t":"Read the game design documents and release notes.","c":[]}]},{"t":"Define scope and setup","c":[{"t":"Decide on features, test environments, devices, and schedule.","c":[]}]},{"t":"Prepare materials","c":[{"t":"Write or update test cases, checklists, and test data.","c":[]}]}]}]},{"title":"Execution, Verification, and Closure","blocks":[{"k":"p","t":"Running Tests, Confirming Fixes, and Closing the Cycle"},{"k":"p","t":"Execution is where testers play and check the build. After developers fix bugs, QA confirms the fixes work and that nothing else was affected before the cycle closes."},{"k":"h","t":"Execution Steps"},{"k":"h","t":"Closure Steps"},{"k":"cards","nodes":[{"t":"VERIFY THE BUILD","c":[{"t":"Confirm the correct version is installed before testing.","c":[]}]},{"t":"RUN IN ORDER","c":[{"t":"Start with smoke tests, then detailed and regression tests.","c":[]}]},{"t":"RECORD RESULTS","c":[{"t":"Mark each case as pass, fail, or blocked, and capture evidence for failures.","c":[]}]}]},{"k":"cards","nodes":[{"t":"RESTES FIXES","c":[{"t":"Check each fixed bug on the new build.","c":[]}]},{"t":"REGRESSION CHECK","c":[{"t":"Test the affected areas to make sure nothing else broke.","c":[]}]},{"t":"RECORD RESULTS","c":[{"t":"Close verified bugs, reopen failed ones, and prepare the final report.","c":[]}]}]}]},{"title":"QA Monitoring","blocks":[{"k":"lead","t":"An overview of how QA teams monitor game quality, identify issues, and evaluate testing results."},{"k":"p","t":"Goal: To help new hires understand QA monitoring processes, recognize potential issues, and maintain game quality through consistent testing and reporting."}]},{"title":"QA Monitoring and Key Metrics","blocks":[{"k":"p","t":"Tracking Progress and Quality During Testing"},{"k":"p","t":"QA monitoring means regularly checking how testing is going and what the results say about quality. Metrics turn testing activity into facts the team can discuss."},{"k":"table","rows":[["COMMON QA MONITORING METRICS","",""],["Metric","Description","Explanation / Purpose"],["Execution Progress","Tracks test cases executed versus planned, including pass and fail rates.","Measures testing progress and determines whether the team is meeting its testing targets."],["Bug Status Counts","Tracks bugs found, open, fixed, and reopened.","Provides an overview of unresolved issues and the team’s \u000bprogress in fixing reported bugs."],["Bug Distribution","Groups bugs by severity and feature area.","Identifies critical issues and highlights game features that require more attention."],["Coverage and Blockers","Tracks blocked test cases and the percentage of game features \u000btested.","Measures testing completeness and identifies issues preventing \u000bfurther testing."]]},{"k":"cards","nodes":[{"t":"PURPOSE OF MONITORING","c":[{"t":"Identify Risks Early: Monitor testing trends, such as increasing crash rates, recurring bugs, or performance issues, to detect potential risks and address them before release.\nKeep Testing on Schedule: Track testing progress, completed tasks, and unresolved issues to determine whether the team is on track to meet deadlines and release targets.","c":[]}]}]}]},{"title":"Tools, Release Readiness, and Escalation","blocks":[{"k":"p","t":"Where QA Information Is Kept and When to Raise Concerns"},{"k":"p","t":"Tools keep bug and test information in one place so everyone sees the same status. QA supplies the facts about quality, and the team uses them to decide on release."},{"k":"h","t":"Tool Used"},{"k":"table","rows":[["RELEASE READINESS: The process of determining whether a game is ready for public release.","",""],["Components","Description","Example"],["EXIT CRITERIA","Defines the minimum requirements that must be met before a game can be released.","No open critical bugs and at least 95% of test cases passed."],["GO / NO-GO INPUT","QA provides testing results, identifies remaining risks, and recommends whether the game is ready for release.","QA recommends delaying release due to unresolved critical bugs. Stakeholders make the final decision."]]},{"k":"cards","nodes":[{"t":"ISSUE TRACKER","c":[{"t":"A tool such as Jira holds bug records and statuses.","c":[]}]},{"t":"TEST MANAGEMENT","c":[{"t":"A tool or spreadsheet tracks which tests were run and their results.","c":[]}]},{"t":"REGULAR UPDATES","c":[{"t":"Daily or weekly progress updates and dashboards keep the team informed.","c":[]}]}]},{"k":"cards","nodes":[{"t":"WHEN TO ESCALATE","c":[{"t":"Report critical blockers, recurring crashes, major bugs, and potential release risks to the QA Lead as soon as they are identified. Do not wait until the end of the testing cycle, as early escalation allows the team to investigate, prioritize, and resolve issues before they affect testing progress, game stability, or release schedules.","c":[]}]}]}]}]},{"id":"report","title":"Bug Reporting, Life Cycle, Severity & Priority","slides":[{"title":"Bug Report Procedures","blocks":[{"k":"lead","t":"An overview of the general process for identifying, documenting, and reporting game bugs."},{"k":"p","t":"Goal: To help new hires create clear, accurate, and complete bug reports that support efficient investigation and resolution."}]},{"title":"Bug Life Cycle","blocks":[{"k":"p","t":"The Stages a Bug Passes Through"},{"k":"p","t":"The bug processing procedure defines the path of a bug from discovery to closure, so no bug is lost or left without an owner. The life cycle shows a bug's status and who acts next."},{"k":"h","t":"Other Bug Statuses"},{"k":"h","t":"Key Principles"},{"k":"h","t":"Duplicate"},{"k":"h","t":"QA Team"},{"k":"h","t":"Ownership"},{"k":"h","t":"Team Responsibilites"},{"k":"p","t":"Already reported in another ticket."},{"k":"p","t":"Reports bugs, retests fixes, verifies results, and closes confirmed fixes."},{"k":"p","t":"Every bug must have an owner and status."},{"k":"h","t":"Traceability"},{"k":"h","t":"Cannot Reproduce"},{"k":"h","t":"Development Team"},{"k":"p","t":"The reported issue cannot be replicated."},{"k":"p","t":"Handles assigned bugs, investigates issues, and implements fixes."},{"k":"p","t":"All updates, and  changes must be documented."},{"k":"h","t":"Won’t Fix"},{"k":"p","t":"The issue has been reviewed and will not be fixed."},{"k":"h","t":"Deferred"},{"k":"h","t":"Bug Life Cycle Process"},{"k":"p","t":"The fix is postponed to a future build."},{"k":"cards","nodes":[{"t":"NewQA identifies and reports a bug.","c":[]},{"t":"Assigned","c":[{"t":"The bug is assigned to a developer for investigation.","c":[]}]},{"t":"In Progress","c":[{"t":"The developer investigates and works on the fix.","c":[]}]},{"t":"FixedThe developer implements a fix.","c":[]},{"t":"Ready for Retest","c":[{"t":"The fixed bug is returned to QA for verification.","c":[]}]},{"t":"Verified / ClosedQA confirms the fix works and closes the bug.","c":[]}]}]},{"title":"Severity and Priority","blocks":[{"k":"p","t":"Measuring Impact and Urgency"},{"k":"p","t":"Severity describes how badly a bug affects the game. Priority describes how soon it should be fixed. The two are related but not the same."},{"k":"p","t":"Severity: How badly does the bug affect the game?"},{"k":"p","t":"Priority: How urgently should the bug be fixed?"},{"k":"p","t":"Remember: A bug can have low severity but high priority, or high severity but low priority. Severity measures impact; priority determines urgency."},{"k":"table","rows":[["BUG SEVERITY (IMPACT)","",""],["Level","Description","Sample Scenario"],["CRITICAL","Causes major game failure or makes the game unplayable.","Game crashes immediately upon launch."],["MAJOR","Significantly affects gameplay or important features.","Players cannot complete a required mission."],["MINOR","Causes limited issues with little impact on gameplay.","A character animation displays incorrectly."],["TRIVIAL","Involves minor visual or cosmetic issues.","Slight misalignment of a non-essential icon."]]},{"k":"table","rows":[["BUG PRIORITY (URGENCY)","",""],["Level","Description","Sample Scenario"],["HIGH","Needs immediate attention or urgent fixing.","A title-screen typo visible to every player before launch."],["MEDIUM","Should be fixed soon but does not require immediate action.","A menu button occasionally responds slowly."],["LOW","Can be addressed in a future update or build.","A rare crash in an unused game mode."]]}]},{"title":"","blocks":[{"k":"note","title":"Writing a good bug report (supplement from the Day 5-A exam key)","items":["Title: say what happens and where — e.g. \"Game crashes when tapping Claim on Daily Reward popup\" (not \"Bug in game\" or \"Please fix urgently\").","Include: steps to reproduce, build version and device, actual result vs expected result, and evidence (screenshot / video / logs).","Facts only — never include personal opinions about the developer.","Before submitting: check for duplicates and try to reproduce the bug once more.","One bug per report — do not combine unrelated bugs."]}]}]}]},{"id":"d5b","name":"Day 5-B","title":"Specialized Gaming Operations","desc":"Event const QS = [{"d":"d1","s":"co_who","q":"What does ELITE Global Sourcing provide to its global clients?","o":["Retail hardware and console distribution only","End-to-end game management solutions (BPO & KPO) for PC and mobile game developers and publishers","Voice-only call center services for telecom companies","Consumer game subscriptions sold directly to players"],"a":1,"e":"ELITE is a game management partner offering specialized BPO & KPO services to PC and mobile game developers and publishers worldwide.","src":"new"},{"d":"d1","s":"co_who","q":"Where is ELITE headquartered, and where are its core operations?","o":["Headquartered in Korea, operations in the United States","Headquartered in the United States, core operations in the Philippines","Headquartered and operating only in Pasig City","Headquartered in Europe, operations in South America"],"a":1,"e":"The slides state ELITE is headquartered in the United States with core operations in the Philippines (Pasig City office). Founded December 2010.","src":"new"},{"d":"d1","s":"co_values","q":"Which of the following is NOT one of ELITE's five core values?","o":["Integrity","Teamwork","Competition","Excellence"],"a":2,"e":"The five core values are Endless Passion, Loyalty, Excellence, Teamwork and Integrity.","src":"new"},{"d":"d1","s":"co_values","q":"Which statement matches ELITE's corporate VISION?","o":["To satisfy customers through innovative game products and superior service","To be the number one global game outsourcing and offshoring solutions provider","To open offices in every country in Southeast Asia","To become a Western game publisher only"],"a":1,"e":"Vision: to be the number one global game outsourcing and offshoring solutions provider through operational excellence, customer satisfaction and sustainable growth. (The first option is the Mission.)","src":"new"},{"d":"d1","s":"hr_conduct","q":"You have an unresolved disagreement with a coworker. What does the house rule say to do?","o":["Post about it in the team chat so others can weigh in","Address it calmly and privately, then escalate unresolved concerns to your Team Lead or HR","Ignore the coworker until they apologize","Discuss it loudly on the floor so it gets resolved quickly"],"a":1,"e":"Handle conflict properly: calm and private first; escalate to the Team Lead or HR — not through floor drama or public arguments.","src":"new"},{"d":"d1","s":"hr_conduct","q":"Which footwear is allowed on the production floor?","o":["Flip-flops","Open-toe heels","Sandals","Closed-toe shoes such as sneakers, flats or loafers"],"a":3,"e":"Closed-toe shoes are required on the production floor. Flip-flops, slides, sandals, open-toe heels, slippers and Crocs without backstraps are not allowed.","src":"new"},{"d":"d1","s":"hr_time","q":"How early must you notify your Team Lead (or HR if unreachable) of an absence?","o":["At least 2 hours before shift start","Right after your shift would have ended","At least 30 minutes after shift start","Only on the day you return"],"a":0,"e":"Notify by call, SMS or chat at least 2 hours before shift start. For ongoing absences, notify your lead every day.","src":"new"},{"d":"d1","s":"hr_time","q":"What happens if a trainee has a No Call, No Show (NCNS) / AWOL?","o":["A verbal reminder only","A one-day pay deduction","Immediate discontinuation of the training period","Nothing, if a medical certificate is submitted later"],"a":2,"e":"NCNS/AWOL triggers immediate discontinuation of the training period.","src":"new"},{"d":"d1","s":"hr_time","q":"A coworker asks you to log them in on the MS Shift Application because they are stuck in traffic. What should you do?","o":["Log them in once as a favor","Refuse — logging in/out for a coworker is gross misconduct that can lead to termination for both parties","Log them in and tell your Team Lead afterwards","Log them in only if they are less than 10 minutes late"],"a":1,"e":"Never log in/out for a coworker, falsify technical issues or manipulate logs. This is gross misconduct and may result in termination for both parties. There is also no grace period for tardiness.","src":"new"},{"d":"d1","s":"hr_time","q":"Which break schedule matches the policy?","o":["30 min after 1 hour, lunch after 3 hours","1st break 15 min after 2 hours; lunch 1 hour after 4 hours; 2nd break 15 min after 6 hours","Breaks are taken whenever the queue is empty","Lunch 30 min after 5 hours; no other breaks"],"a":1,"e":"1st break: 15 minutes after 2 hours • Lunch: 1 hour after 4 hours • 2nd break: 15 minutes after 6 hours. Log every break in the MS Shift Application.","src":"new"},{"d":"d1","s":"hr_office","q":"Where are you allowed to eat full meals?","o":["At your production desk, if you clean up afterwards","In the pantry/breakroom only","Anywhere on the floor if your drink is covered","At the desk of a coworker who agrees"],"a":1,"e":"Eat meals, hot food and messy snacks in the pantry/breakroom only. No full meals at stations; this protects equipment and prevents pests.","src":"new"},{"d":"d1","s":"hr_office","q":"What must you do whenever you step away from your workstation, even briefly?","o":["Turn off the monitor","Press Win + L to lock your workstation","Leave a note with your name on the screen","Nothing, as long as you are close by"],"a":1,"e":"Lock your workstation (Win + L) every time you step away — even for a brief moment — to protect client data.","src":"new"},{"d":"d1","s":"hr_it","q":"What must you do with your personal phone before entering the production bay?","o":["Keep it on silent in your pocket","Secure it in your assigned locker","Place it face-down on your desk","Hand it to the nearest coworker"],"a":1,"e":"Personal phones, smartwatches, cameras and recording devices must be secured in assigned lockers. USB drives and external hard drives are prohibited on production workstations.","src":"new"},{"d":"d1","s":"hr_it","q":"Which of these is allowed on a company workstation?","o":["Streaming a personal Netflix or Twitch session on a break","Installing a free game mod from a friend","Using the internet for work tools, knowledge bases and authorized game portals","Plugging in a personal USB drive to move files"],"a":2,"e":"Internet access is for work tools, knowledge bases and authorized game portals. Personal streaming and social media are monitored and restricted; unauthorized software, mods and USB storage are not allowed.","src":"new"},{"d":"d1","s":"dpa","q":"Which of the following is Sensitive Personal Information (SPI) under the Data Privacy Act?","o":["Real name","Email address","Gamer tag","Government ID or payment card details"],"a":3,"e":"Name, email and gamer tag are personal information. Government IDs, payment card details, health records and tax returns are sensitive personal information that needs strict handling.","src":"new"},{"d":"d1","s":"dpa","q":"Within how many hours must affected data subjects and the NPC be notified of a data breach?","o":["12 hours","24 hours","72 hours","7 days"],"a":2,"e":"Both the Data Privacy Act and GDPR use a 72-hour notification window. Internally, report any suspected breach to your Team Leader or QA immediately.","src":"new"},{"d":"d1","s":"cyber","q":"Under the Cybercrime Prevention Act, what is your risk if you help someone access a player account without right?","o":["None, as long as you did not do the hacking yourself","You can be liable for aiding or abetting, even if you did not act alone","Only the person who accessed the account can be liable","Only the company is liable"],"a":1,"e":"Aiding or abetting (and attempting) a cybercrime is itself an offense. Helping anyone access a system or account without right can expose you to liability.","src":"new"},{"d":"d1","s":"gdpr","q":"Under GDPR terminology, what is the role of the BPO agency and its agents?","o":["Data Subject","Data Controller","Data Processor","Data Protection Officer"],"a":2,"e":"The player is the Data Subject, the publisher/client is the Data Controller, and the BPO agency and its agents are Data Processors acting on the Controller's behalf.","src":"new"},{"d":"d1","s":"gdpr","q":"A player writes: \"Send me a copy of all my support tickets and live chat logs from the last six months.\" What do you do?","o":["Copy and paste the raw logs into your reply","Identify it as a DSAR and escalate it immediately per company workflow","Ask for the player's full credit card number first","Ignore it — it is not a support request"],"a":1,"e":"This is a Data Subject Access Request (right of access). Do not compile logs or paste raw database lines — identify the ticket as a DSAR and escalate immediately.","src":"new"},{"d":"d1","s":"penal","q":"Which of the following is a MAJOR infraction under internal BPO disciplinary rules?","o":["Leaving a terminal unlocked briefly","Intentional data leakage or credential sharing","Arriving to a briefing a few minutes early","Asking a trainer to repeat an instruction"],"a":1,"e":"Major infractions include intentional data leakage, credential sharing, phishing participation or rude/defamatory chat behavior. Leaving a terminal unlocked briefly is a minor infraction. Consequences can include termination, civil litigation and industry blacklisting.","src":"new"},{"d":"d3","s":"csat","q":"What does CSAT primarily measure?","o":["The total number of tickets resolved per day","Customer satisfaction as the gap between what a customer expected and what they received","How easy it was to get help on a platform","The net likelihood that a customer will recommend the company"],"a":1,"e":"CSAT measures customer satisfaction — the gap between expectation and what the customer received — after a ticket or chat.","src":"exam"},{"d":"d3","s":"csat","q":"Which metric evaluates customer loyalty and the likelihood to recommend on a scale of 0 to 10?","o":["CSAT","FCR","CES","NPS"],"a":3,"e":"NPS (Net Promoter Score) asks \"How likely are you to recommend us (0–10)?\".","src":"exam"},{"d":"d3","s":"livechat","q":"What is the mandatory acceptance time standard for an incoming live chat?","o":["Within 5 seconds","Within 10 seconds","Within 30 seconds","Within 1 minute"],"a":1,"e":"A chat MUST be accepted within 10 seconds to prevent long waits, abandoned chats and dissatisfaction.","src":"exam"},{"d":"d3","s":"roles","q":"According to the roles and responsibilities (Do's and Don'ts), which of the following actions is encouraged?","o":["Saying \"that's not my job\" when handed a difficult request","Relying entirely on memory to save time","Owning the customer's issue until it is resolved or properly handed off","Promising things you cannot confirm to pacify the customer"],"a":2,"e":"DO own the customer's issue until it is resolved or properly handed off. The other options are listed under DON'T.","src":"exam"},{"d":"d3","s":"ticket","q":"What is the standard Service Level Agreement (SLA) response window for a support ticket?","o":["2 hours","12 hours","24 hours","48 hours"],"a":2,"e":"Every ticket gets a response within 24 hours (12h first response + 12h final resolution).","src":"exam"},{"d":"d3","s":"reviews","q":"How should an agent handle a public market review that involves a specific account billing error?","o":["Request the customer's sensitive credit card details publicly so everyone can see","Ignore the review entirely because it is public","Invite the customer to contact support privately through an approved channel or email, and never ask for sensitive data publicly","Argue back to defend the company's billing system"],"a":2,"e":"Keep public replies brief and professional, point to the support channel, and never ask for or reveal sensitive/account details publicly.","src":"exam"},{"d":"d3","s":"ticket","q":"Which ticket type best fits: \"The app freezes every time I open my profile.\"","o":["Billing / payment","Account / access","Technical / bug","Report"],"a":2,"e":"Errors, crashes and features not working are Technical / bug tickets.","src":"exam"},{"d":"d3","s":"tools","q":"What tool category is used to look up customer accounts, orders, or transactions?","o":["Ticketing / Helpdesk","App Store Consoles","Admin / Back-Office","Knowledge Base / Macros"],"a":2,"e":"Admin / Back-Office tools (internal admin dashboards, Stripe/Shopify Admin) look up accounts, orders and transactions.","src":"exam"},{"d":"d3","s":"livechat","q":"When investigating an issue during a live chat that takes some time, what is the recommended protocol?","o":["Go completely silent until the answer is found","Tell the customer and provide regular updates at an interval (e.g., every 3 minutes)","Close the chat immediately and tell them to open a ticket","Copy-paste a long wall of text to distract them"],"a":1,"e":"Never leave the customer in silence — send a holding message and update at regular intervals.","src":"exam"},{"d":"d3","s":"csat","q":"What does CES stand for in customer support metrics?","o":["Customer Escalation Score","Customer Effort Score","Core Evaluation Standard","Customer Efficiency System"],"a":1,"e":"CES = Customer Effort Score: how easy it was to get help/resolve the issue.","src":"exam"},{"d":"d3","s":"esc","q":"Which of the following details should NOT be included in an escalation note posted on a public or shared channel?","o":["Ticket or chat ID","Sensitive personal data (such as passwords or full payment info)","Steps already taken and results","Device and app version"],"a":1,"e":"Include IDs, summary, steps taken, evidence and urgency — but no sensitive data in public/shared channels.","src":"exam"},{"d":"d3","s":"emergency","q":"According to the Emergency Report guidelines, how should an issue where customers are charged without receiving confirmation be handled?","o":["Treat it as a normal low-priority ticket and respond within 24 hours","Escalate to Severity 1 immediately and prioritize payment gateway logs alongside rapid customer communication","Wait for more proof from multiple additional users before acting","Speculate about server causes publicly in customer replies"],"a":1,"e":"Financial transactions with charges but no confirmation: escalate to Severity 1 immediately; don't wait for more proof.","src":"exam"},{"d":"d3","s":"sandwich","q":"What is the primary purpose of the \"Sandwich Method\" in customer support?","o":["To speed up typing speeds on live chats","To format internal notes within Zendesk","To deliver difficult messages without losing the customer","To close tickets automatically without customer confirmation"],"a":2,"e":"Positive opening → main information/resolution → positive closing, so difficult news is delivered with empathy and clarity.","src":"exam"},{"d":"d3","s":"csat","q":"Which metric measures the share of issues solved during the initial contact?","o":["AHT (Average Handling Time)","FCR (First Contact Resolution)","NPS","CSAT"],"a":1,"e":"FCR = First Contact Resolution, measured from CXQA.","src":"exam"},{"d":"d3","s":"emergency","q":"Which of the following is a valid \"Emergency Type\" requiring immediate escalation?","o":["A player asking a general inquiry question about game features","A global server crash disconnecting 100% of active players during a major live event","A user leaving a 3-star review with a suggestion for dark mode","An influencer with 1 million followers requesting a partnership"],"a":1,"e":"Severe outages are an emergency type. Inquiries, suggestions and partnership requests are normal tickets/other.","src":"exam"},{"d":"d3","s":"ticket","q":"What is the definition of a \"Support Ticket\"?","o":["A public review left on the App Store or Google Play Store","The record of every customer concern used to receive, track, and reply to issues","A real-time conversational messaging channel with short replies","An internal emergency notification sent directly to software developers"],"a":1,"e":"A ticket is the logged record of a customer concern — accountability, traceability, SLA monitoring and reporting.","src":"exam"},{"d":"d3","s":"ticket","q":"Which of the following is categorized as a \"Report\" ticket type?","o":["\"I can't log in. The reset email never arrives.\"","\"I was charged twice for the same order.\"","\"I would like to report player ABC for saying racist remarks on the world chat\"","\"Please add a dark mode.\""],"a":2,"e":"Report = misbehavior, policy breakers and player reports. The others are Account, Billing and Feedback tickets.","src":"exam"},{"d":"d3","s":"emergency","q":"Which is a company-related scenario for a Data Breach & Security Compromise under the Emergency Report guidelines?","o":["A global server crash disconnecting 100% of active players","A malware attack compromising internal staff workstations, exposing confidential company IP or source code","An item-duplication glitch causing hyperinflation in the game market","A billing bug charging players real money multiple times"],"a":1,"e":"Malware exposing internal IP, source code or payroll documents is the company-related data breach example.","src":"exam"},{"d":"d3","s":"tools","q":"Which tool category would an agent use to look up approved answers, macros, and templates?","o":["Ticketing / Helpdesk","Live Chat Platform","App Store Consoles","Knowledge Base / Macros"],"a":3,"e":"Knowledge Base / Macros (Notion, Confluence, Guru) hold approved answers and templates.","src":"exam"},{"d":"d3","s":"livechat","q":"Which of the following behaviors is strictly a DON'T when handling live chats?","o":["Greet by name and confirm understanding","Update the customer while checking account details","Go silent or ghost the chat","Offer further help before closing"],"a":2,"e":"Never go silent or ghost the chat; the other three are DOs.","src":"exam"},{"d":"d4","s":"comm","q":"What is the primary objective of Community Management?","o":["To modify game settings.","To build and maintain positive relationships with players.","To investigate all account transactions.","To manage server configurations."],"a":1,"e":"Community Management builds, manages and maintains positive relationships between the gaming company and its players.","src":"exam"},{"d":"d4","s":"gm","q":"Which of the following best describes Game Management?","o":["Managing social media advertisements.","Creating gaming content.","Overseeing gameplay integrity and enforcing game policies.","Managing influencer partnerships"],"a":2,"e":"Game Management focuses on gameplay integrity, player activities and game-related operations.","src":"exam"},{"d":"d4","s":"comm","q":"Which platform is primarily used for public announcements and player engagement?","o":["SNS","Internal GM database","Private investigation logs","Administrative dashboard"],"a":0,"e":"Social networking sites are used for announcements, promotions, audience engagement and public feedback.","src":"exam"},{"d":"d4","s":"comm","q":"What is the primary purpose of a gaming forum?","o":["Processing player payments","Managing server maintenance","Providing administrative access.","Facilitating discussions, suggestions, and player reports."],"a":3,"e":"Forums are for in-depth discussions, player suggestions, bug reports and concerns.","src":"exam"},{"d":"d4","s":"comm","q":"Which of the following is a Community Manager responsibility?","o":["Changing player account passwords without authorization.","Monitoring discussions and encouraging positive engagement.","Modifying game source code.","Issuing unauthorized account suspensions."],"a":1,"e":"Community Managers manage discussions, publish approved announcements, respond to inquiries and encourage positive engagement.","src":"exam"},{"d":"d4","s":"mod","q":"What should a moderator do when encountering offensive content on SNS?","o":["Respond with equally offensive language.","Ignore all reported content.","Review the content and apply the appropriate moderation policy.","Share the content on a personal account."],"a":2,"e":"Review content before acting, apply policy consistently, and use polite, professional language.","src":"exam"},{"d":"d4","s":"mod","q":"Which is the most appropriate approach when responding to a forum complaint?","o":["Remain professional and provide a relevant, factual response.","Argue with the player.","Delete all negative feedback.","Blame another department."],"a":0,"e":"Stay professional and factual; avoid arguments and never delete feedback just because it is negative.","src":"exam"},{"d":"d4","s":"mod","q":"What is the proper approach when moderating in-game disputes?","o":["Automatically punish both players.","Take the side of the more experienced player.","Ignore all reports.","Remain neutral and investigate the available evidence."],"a":3,"e":"Be impartial, treat all players fairly and decide based on evidence.","src":"exam"},{"d":"d4","s":"rules","q":"Which of the following is a violation of general Rules of Conduct?","o":["Providing constructive feedback.","Harassing or threatening another player.","Participating in official events.","Reporting a suspected bug."],"a":1,"e":"Harassment, bullying and discrimination violate the rules of conduct.","src":"exam"},{"d":"d4","s":"mod","q":"What should personnel do when they encounter a serious or unclear violation?","o":["Make an immediate personal judgment.","Discuss the case publicly.","Escalate it through the designated process.","Ignore the incident."],"a":2,"e":"Escalate serious or unclear cases to the appropriate team.","src":"exam"},{"d":"d4","s":"gm","q":"What is the primary responsibility of a Game Master?","o":["Monitoring gameplay and enforcing game policies within authorized limits.","Creating personal social media content.","Promoting unofficial gaming services.","Selling in-game items"],"a":0,"e":"A GM monitors the game environment and enforces policies within the limits of assigned authority.","src":"exam"},{"d":"d4","s":"gm","q":"Which of the following may indicate suspicious gameplay activity?","o":["Joining a guild.","Participating in a tournament.","Changing a character's appearance.","Repeated automated actions suggesting possible botting."],"a":3,"e":"Possible botting/automation is a suspicious pattern — but a pattern alone does not establish a violation.","src":"exam"},{"d":"d4","s":"gm","q":"What should a GM do after identifying suspicious player activity?","o":["Immediately announce the player's identity.","Verify available evidence and follow investigation procedures.","Permanently ban the player without review.","Share the suspected account details with other players."],"a":1,"e":"Use approved evidence and procedures; protect player information; bans need approval.","src":"exam"},{"d":"d4","s":"gm","q":"Why should Game Masters use administrative privileges responsibly?","o":["To gain advantages over players.","To test personal game strategies.","To protect player information and maintain operational accountability.","To avoid completing reports."],"a":2,"e":"All GM actions are logged and monitored; privileges are for authorized tasks only.","src":"exam"},{"d":"d4","s":"gm","q":"Which of the following is an example of an unauthorized gameplay activity?","o":["Using prohibited third-party software to gain an advantage.","Completing an official quest.","Participating in an authorized event.","Trading according to game rules"],"a":0,"e":"Cheating and unauthorized third-party software are prohibited gameplay activities.","src":"exam"},{"d":"d4","s":"gm","q":"Which is an appropriate documentation practice?","o":["Recording subjective opinions as facts","Leaving out important incident details.","Sharing reports in public channels","Recording the incident, evidence, actions taken, and status."],"a":3,"e":"Document the incident, evidence, actions taken and status accurately — an audit trail for accountability and appeals.","src":"exam"},{"d":"d4","s":"gm","q":"What should a GM do when multiple players report a critical game bug?","o":["Wait until the end of the shift.","Verify available information and promptly report it through the designated escalation channel.","Encourage players to exploit the bug.","Delete all related reports."],"a":1,"e":"Escalate exploits, bugs and server issues promptly to the technical teams.","src":"exam"},{"d":"d4","s":"mod","q":"A player posts strong criticism about a game update without violating community rules. What should the moderator do?","o":["Immediately ban the player.","Delete the comment because it is negative.","Allow constructive criticism and respond professionally if needed.","Argue with the player."],"a":2,"e":"Remove or restrict content only when it violates guidelines; negative feedback alone is not a violation.","src":"exam"},{"d":"d4","s":"gm","q":"A player reports another player for scamming. What is the appropriate first step?","o":["Review the report and verify available evidence.","Immediately suspend the accused player.","Publicly identify the accused player.","Ignore the report."],"a":0,"e":"Verify evidence first; enforcement must be evidence-based and follow approval/escalation procedures.","src":"exam"},{"d":"d4","s":"found","q":"What is the most important principle shared by Community Management and Game Management?","o":["Prioritizing subjective opinions","Avoiding all player interactions.","Taking action without documentation.","Maintaining professionalism, fairness, and compliance with established policies."],"a":3,"e":"Both functions protect the gaming experience through professionalism, fair/objective decisions and policy compliance.","src":"exam"},{"d":"d5a","s":"bugs","q":"A character walks through a solid wall in the game. This is best classified as a:","o":["Localization bug","Visual/collision bug","Network bug","Compliance issue"],"a":1,"e":"Clipping and collision issues (objects passing through walls) are Visual & audio bugs.","src":"exam"},{"d":"d5a","s":"types","q":"Which test is performed first to check whether a new build is stable enough for further testing?","o":["Regression testing","Balance testing","Smoke testing","Localization testing"],"a":2,"e":"Smoke testing checks overall build stability (e.g., launch, login, main menu).","src":"exam"},{"d":"d5a","s":"report","q":"A bug that crashes the game but happens only in a rarely used mode is most likely:","o":["High severity, low priority","Low severity, high priority","Low severity, low priority","Not a bug"],"a":0,"e":"A crash has high severity (impact); a rarely used mode means low priority (urgency).","src":"exam"},{"d":"d5a","s":"report","q":"Which of the following is part of the bug life cycle?","o":["New, Assigned, Fixed, Verified","Draft, Approved, Published","Plan, Design, Build","Open, Delete, Archive"],"a":0,"e":"New → Assigned → In Progress → Fixed → Ready for Retest → Verified/Closed.","src":"exam"},{"d":"d5a","s":"proc","q":"The main purpose of QA monitoring is to:","o":["Replace the development team","Track test progress and quality to spot risks early","Write game code","Create game art"],"a":1,"e":"Monitoring tracks progress and quality so risks are identified early and testing stays on schedule.","src":"exam"},{"d":"d5a","s":"types","q":"Which statement describes regression testing?","o":["Testing the game for the first time","Checking that previously working features still work after changes","Testing only the game's audio","Testing the game with no instructions"],"a":1,"e":"Regression testing ensures existing features still work after updates (unintended side effects).","src":"exam"},{"d":"d5a","s":"report","q":"Which is the best bug report title?","o":["\"Bug in game\"","\"Doesn't work\"","\"Game crashes when tapping Claim on Daily Reward popup\"","\"Please fix urgently\""],"a":2,"e":"A good title says what happens and where — specific and reproducible.","src":"exam"},{"d":"d5a","s":"report","q":"Which item is NOT normally included in a bug report?","o":["Steps to reproduce","Build version and device","Actual and expected results","The tester's personal opinion of the developer"],"a":3,"e":"Reports contain facts: steps, build/device, actual vs expected, evidence — never personal opinions.","src":"exam"},{"d":"d5a","s":"bugs","q":"Text that is cut off in a translated menu is an example of a:","o":["Localization bug","Performance bug","Save data bug","Network bug"],"a":0,"e":"Text layout problems (cut-off or overflowing translations) are UI/UX, text and localization bugs.","src":"exam"},{"d":"d5a","s":"report","q":"Before submitting a new bug, a tester should:","o":["Wait for the developer to find it","Report it only verbally","Check for duplicates and try to reproduce it again","Combine it with several unrelated bugs in one report"],"a":2,"e":"Check for duplicates and re-verify reproduction — one bug per report.","src":"exam"},{"d":"d5b","s":"event","q":"Which of the following is an On-Ground event?","o":["An online livestream competition","A gaming convention or mall tour","A virtual Discord meetup","A web-based anniversary stream"],"a":1,"e":"On-ground events are physical events at venues: gaming conventions, mall tours and fan gatherings.","src":"new"},{"d":"d5b","s":"event","q":"Which is an expected output of event management?","o":["Source code for the game","Post-event reports and documentation","Character textures","Marketing metrics only"],"a":1,"e":"Expected outputs include plans, confirmed arrangements, executed activities, attendance records and post-event reports.","src":"new"},{"d":"d5b","s":"mkt","q":"What does Click-Through Rate (CTR) measure?","o":["The number of times content is displayed","The percentage of users who click an advertisement or link","The number of unique users reached","The revenue earned per player"],"a":1,"e":"CTR = percentage of users who click an ad or link. Impressions = times displayed; Reach = unique users exposed.","src":"new"},{"d":"d5b","s":"mkt","q":"Which marketing service type partners with content creators to promote games?","o":["Email marketing","Influencer marketing","Campaign management","Digital advertising"],"a":1,"e":"Influencer marketing: gaming influencer reviews and sponsored streams.","src":"new"},{"d":"d5b","s":"esports","q":"In an esports tournament, what is \"seeding\"?","o":["A visual structure of match progression","Ranking participants before tournament placement","Real-time narration of gameplay","The final match of the tournament"],"a":1,"e":"Seeding ranks participants before placement; the bracket is the visual structure; grand finals decide the champion.","src":"new"},{"d":"d5b","s":"esports","q":"Which shoutcasting style explains strategies and important match decisions?","o":["Play-by-play","Analytical casting","Bracket management","Player registration"],"a":1,"e":"Play-by-play narrates events in real time; analysis/analytical casting explains strategies and decisions.","src":"new"},{"d":"d5b","s":"pub","q":"What is a PUBLISHER's role compared with a DEVELOPER?","o":["Creates the game's code and art","Publishes, markets, distributes or supports the game","Tests only the game's audio","Translates the game only"],"a":1,"e":"The developer creates the game; the publisher publishes, markets, distributes and supports it.","src":"new"},{"d":"d5b","s":"pub","q":"What does LiveOps refer to?","o":["Pre-release alpha testing","Ongoing activities that keep a released game active and engaging","Console certification","Physical retail distribution"],"a":1,"e":"LiveOps: seasonal events and content updates after release.","src":"new"},{"d":"d5b","s":"pr","q":"A popular online game has unexpected server downtime. What should the PR team do before announcing anything?","o":["Announce the likely cause right away","Verify information with the appropriate internal (technical) teams and use approved messaging","Promise players free items to calm them","Wait until players stop complaining"],"a":1,"e":"Verify with internal departments, follow approved messaging, avoid unconfirmed information and unauthorized promises.","src":"new"},{"d":"d5b","s":"loc","q":"What is Localization Quality Assurance (LQA)?","o":["Translating game dialogue from scratch","Checking localized content for errors and consistency","Recording English voice-over","Designing 3D characters"],"a":1,"e":"LQA checks localized content for language, display and cultural errors (wrong subtitles, cut-off text).","src":"new"},{"d":"d5b","s":"loc","q":"\"Culturalization\" means:","o":["Adapting content to suit the target market's cultural expectations and sensitivities","Translating words literally","Maintaining a glossary","Testing frame rates"],"a":0,"e":"Culturalization adapts content (e.g., adjusting culturally inappropriate symbols) — localization is more than translation.","src":"new"},{"d":"d5b","s":"d3d","q":"In 3D game design, what is \"rigging\"?","o":["Applying surface materials to a model","Creating a skeletal structure for character movement","Creating cinematic lighting","Sculpting a high-detail model"],"a":1,"e":"Rigging sets up a character's bones so it can be animated; texturing applies surface details.","src":"new"},{"d":"d5b","s":"sales","q":"What is a Stock Keeping Unit (SKU)?","o":["An online platform where games are sold","A unique identifier used to track a product","Income generated from product sales","The method used to deliver products"],"a":1,"e":"SKU = unique identifier used to track a product; digital storefront = online platform; revenue = income.","src":"new"},{"d":"d5b","s":"bd","q":"Which activity is \"Lead Generation\" in business development?","o":["Maintaining relationships with existing clients","Identifying potential clients and business opportunities","Monitoring partnership deliverables","Preparing a proposal for an existing client"],"a":1,"e":"Lead generation identifies potential clients and opportunities, e.g., finding international game publishers.","src":"new"},{"d":"d5b","s":"mr","q":"Which market research method uses moderated group sessions to capture collective product feedback?","o":["Surveys","Interviews","Focused group discussions","Competitor benchmarking"],"a":2,"e":"Surveys = standardized data at scale; interviews = one-on-one; focus groups = moderated group sessions.","src":"new"},{"d":"d5b","s":"consult","q":"Writing and maintaining Standard Operating Procedures (SOPs) is which business consulting service type?","o":["Workflow automation consulting","Documentation","Performance analysis","Customized outsourcing"],"a":1,"e":"Documentation = creating and maintaining operational guides and procedures (SOPs).","src":"new"}];
const SCENARIOS = [{"id":"w1","title":"Scenario 1: Billing Discrepancy & Double Charge","situation":"A customer named Maria Santos contacts support (Ticket ID: MS-98214) furious because she was double-charged for her in-game purchase.","task":"Draft a professional email response acknowledging her concern, inviting her to contact support privately to safely investigate her billing, and avoiding any request for sensitive credit card details in the public reply.","rubric":["Uses the email format: greeting by name, branding, acknowledgment & empathy, action, next steps, closing","Acknowledges her concern and apologizes for the inconvenience","Invites her to contact support privately through an approved channel","Does NOT ask for credit card or other sensitive details publicly","Stays professional — no arguing or defending the billing system"]},{"id":"w2","title":"Scenario 2: Technical Lag and Layout Bug","situation":"A user named Kenji Sato leaves a ticket reporting that the recent app update ruined the layout, caused severe lagging, and keeps logging them out.","task":"Draft a response that apologizes for the inconvenience, provides a helpful workaround (such as clearing cache or using an in-app link), and reassures them that the feedback has been shared with the engineering team.","rubric":["Apologizes sincerely for the lag, layout and logout problems","Gives a workaround (e.g. clear the cache or use the in-app contact link)","Reassures him the feedback was shared with the engineering team","Follows the Sandwich Method (positive opening, clear middle, positive closing)","Avoids jargon and false promises about a fix date"]},{"id":"w3","title":"Scenario 3: Product Feature Request (Dark Mode)","situation":"A customer named Jean Dupont writes in praising the app's story arc, but strongly requests the addition of a complete dark mode.","task":"Draft a polite, appreciative response acknowledging their loyalty, validating their suggestion, and confirming that their idea has    <div class="row" style="margin-top:8px"><div class="score ${passed == null ? "" : passed ? "pass" : "fail"}">${at.score}<span class="muted" style="font-size:26px">/${at.total}</span></div><div><div style="font-size:22px;font-weight:800">${pct}%</div>${passed == null ? "" : `<span class="chip ${passed ? "g" : "r"}" style="font-size:13px">${passed ? "PASSED" : "NOT YET"} — pass mark ${pm}/${at.total} (${d.exam.pass_pct}%)</span>`}${official && pct < 95 ? `<div class="muted" style="font-size:12px;margin-top:4px">Program exam-score target is 95%.</div>` : ""}</div><span class="spacer"></span><div class="muted" style="text-align:right">${esc(fmtDate(at.ts))}<br>Time: ${Math.floor(at.secs / 60)}m ${at.secs % 60}s</div></div></div>
  <div class="card"><h3>Diagnosis</h3><p>${diagText}</p><div style="overflow-x:auto"><table><thead><tr><th>Topic</th><th>Correct</th><th>Accuracy</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="row noprint">${dg.weak.length ? `<a class="btn primary" href="#/plan/${at.id}">Open my review plan</a><a class="btn" href="#/test/${at.day}?m=missed" onclick="setTimeout(route,0)">Retry missed questions (${miss.length})</a>` : ""}<a class="btn" href="#/test/${at.day}?m=full" onclick="setTimeout(route,0)">Retake full test</a><button class="btn" onclick="window.print()">Print / save PDF</button><a class="btn" href="#/tests">Back to tests</a></div></div>
  <div class="card"><h3>Question review</h3>${review}</div>`;
}
function pagePlan(id) {
  const at = S.attempts.find(a => a.id === id); if (!at) return `<div class="card"><h2>Not found</h2><a class="btn" href="#/tests">Back</a></div>`;
  const d = dayById[at.day], dg = diagnosis(at);
  if (!dg.weak.length) return `<div class="card"><h2>Review plan</h2><p>No weak topics in this attempt — nothing to review. 🎉</p><a class="btn" href="#/result/${at.id}">Back to result</a></div>`;
  const items = dg.weak.map((t, n) => {
    const k = d.id + "/" + t.sec.id, st = statusOf(t);
    const missed = t.missed.map(q => { const a = at.answers[q.id]; return `<div class="card" style="background:var(--surface2)"><b>${esc(q.q)}</b><div style="margin-top:6px">${a >= 0 ? `<div><span class="chip r">Your answer</span> ${esc(q.o[a])}</div>` : `<div><span class="chip n">Not answered</span></div>`}<div><span class="chip g">Correct</span> ${esc(q.o[q.a])}</div></div><div class="expl">${esc(q.e)}</div></div>`; }).join("");
    return `<div class="card"><div class="row"><h3 style="margin:0">${n + 1}. ${esc(t.sec.title)}</h3><span class="chip ${st[0]}">${t.correct}/${t.tested} · ${st[1]}</span><span class="spacer"></span><label class="chk"><input type="checkbox" ${S.studied[k] ? "checked" : ""} onchange="setStudied('${k}',this.checked)"> Studied</label></div>
      <h5 style="margin:12px 0 6px;color:var(--red)">What you missed</h5>${missed}
      <details class="sec"><summary>Re-read the lesson: ${esc(t.sec.title)}</summary>${sectionHtml(t.sec)}</details>
      <div class="row"><a class="btn primary sm" href="#/test/${d.id}?m=sec:${t.sec.id}" onclick="setTimeout(route,0)">Practise this topic (${QS.filter(q => q.d === d.id && q.s === t.sec.id).length} questions)</a><a class="btn sm" href="#/learn/${d.id}/${t.sec.id}">Open in Learn</a></div></div>`;
  }).join("");
  return `<div class="card"><div class="muted">${esc(d.name)} · ${esc(d.title)} — attempt on ${esc(fmtDate(at.ts))}</div><h2>My review plan</h2><div class="sub">Topics ordered from weakest to strongest. For each: see what you missed, re-read the lesson, then practise. When you are done, retake the full test.</div>
   <div class="row"><a class="btn primary" href="#/test/${d.id}?m=weak" onclick="setTimeout(route,0)">Practise all weak topics</a><a class="btn" href="#/test/${d.id}?m=full" onclick="setTimeout(route,0)">Retake full test</a><a class="btn" href="#/result/${at.id}">Back to result</a></div></div>${items}`;
}
// ── written practice (Day 3) ──────────────────────────────────────────────
function pageWritten() {
  const done = SCENARIOS.filter(s => (S.written[s.id]?.checks || []).length === s.rubric.length).length;
  return `<div class="card"><h2>Day 3 · Written practice</h2><div class="sub">Scenarios from the Day 3 exam. Write your reply, then check it against the checklist. These are <b>not auto-graded</b> — ask your trainer to review your answers.</div><span class="chip">${done}/${SCENARIOS.length} self-checked</span> <a class="btn sm" href="#/tests">Back to tests</a></div>`
   + SCENARIOS.map(s => `<div class="card"><h3>${esc(s.title)}</h3><p><b>Situation:</b> ${esc(s.situation)}</p><p><b>Task:</b> ${esc(s.task)}</p><textarea oninput="setWritten('${s.id}',this.value)" placeholder="Write your response here…">${esc(S.written[s.id]?.text || "")}</textarea><h5 style="margin:10px 0 4px">Self-check — does your answer…</h5>${s.rubric.map((r, i) => `<label class="chk"><input type="checkbox" ${(S.written[s.id]?.checks || []).includes(i) ? "checked" : ""} onchange="setCheck('${s.id}',${i},this.checked)"> ${esc(r)}</label>`).join("")}</div>`).join("");
}
function setWritten(id, v) { (S.written[id] = S.written[id] || { text:"", checks:[] }).text = v; save(); }
function setCheck(id, i, on) { const w = S.written[id] = S.written[id] || { text:"", checks:[] }; w.checks = w.checks.filter(x => x !== i); if (on) w.checks.push(i); save(); }
// ── progress ──────────────────────────────────────────────────────────────
function pageProgress() {
  const la = latestAnswers(); const days = LESSONS;
  const passed = days.filter(d => { const b = bestOf(d.id); return b && b.score >= passMark(d.id); }).length;
  const bests = days.map(d => bestOf(d.id)).filter(Boolean); const avg = bests.length ? Math.round(bests.reduce((s, b) => s + pctOf(b.score, b.total), 0) / bests.length) : null;
  const studied = Object.keys(S.studied).length, totalSecs = days.reduce((n, d) => n + d.sections.length, 0);
  const dayRows = days.map(d => { const b = bestOf(d.id), n = officialAttempts(d.id).length; const st = b ? (b.score >= passMark(d.id) ? ["g", "Passed"] : ["y", "Not yet"]) : ["n", "Not taken"]; return `<tr><td><b>${esc(d.name)}</b> · ${esc(d.title)}</td><td>${b ? `${b.score}/${b.total} (${pctOf(b.score, b.total)}%)` : "—"}</td><td>${passMark(d.id)}/${qsOfDay(d.id).length}</td><td>${n}</td><td><span class="chip ${st[0]}">${st[1]}</span></td></tr>`; }).join("");
  const mastery = days.map(d => `<h5 style="margin:12px 0 4px">${esc(d.name)} · ${esc(d.title)}</h5>` + topicStats(d.id, la).map(t => { const st = statusOf(t), p = pctOf(t.correct, t.tested); return `<div class="row" style="margin:3px 0"><div style="width:260px;max-width:48%">${esc(t.sec.title)}</div><div class="bar ${st[0] === "g" ? "" : st[0] === "y" ? "y" : "r"}" style="flex:1"><i style="width:${t.tested ? p : 0}%"></i></div><span class="chip ${st[0]}" style="min-width:90px;text-align:center">${t.tested ? `${t.correct}/${t.tested} · ` : ""}${st[1]}</span></div>`; }).join("")).join("");
  const att = S.attempts.slice().reverse().map(a => `<tr><td>${esc(fmtDate(a.ts))}</td><td>${esc(dayById[a.day].name)}</td><td>${esc(a.mode === "full" ? "Full test" : a.label)}</td><td>${a.score}/${a.total} (${pctOf(a.score, a.total)}%)</td><td><a href="#/result/${a.id}">Open</a></td></tr>`).join("");
  return `<div id="printHead"><h2>New Hire Training — Progress report</h2></div>
  <div class="card"><div class="row"><h2 style="margin:0">My results</h2><span class="spacer"></span><label class="noprint">Name <input type="text" id="nm" value="${esc(S.name)}" placeholder="Your full name" oninput="S.name=this.value;save()"></label></div><div class="sub">${esc(S.name || "Enter your name so it appears on printed reports")} · ${esc(new Date().toLocaleDateString())}</div></div>
  <div class="tiles4"><div class="stat"><div class="v">${passed}/${days.length}</div><div class="l">Day tests passed</div></div><div class="stat"><div class="v">${avg == null ? "—" : avg + "%"}</div><div class="l">Average of best scores (target 95%)</div></div><div class="stat"><div class="v">${studied}/${totalSecs}</div><div class="l">Sections studied</div></div><div class="stat"><div class="v">${officialAttempts().length}</div><div class="l">Official attempts</div></div></div>
  <div class="card"><h3>Day tests</h3><div style="overflow-x:auto"><table><thead><tr><th>Day</th><th>Best score</th><th>Pass mark</th><th>Attempts</th><th>Status</th></tr></thead><tbody>${dayRows}</tbody></table></div></div>
  <div class="card"><h3>Topic mastery</h3><div class="sub">Based on your most recent answer to each question. Red or amber topics are where to spend your review time.</div>${mastery}</div>
  <div class="card"><h3>Attempt history</h3>${att ? `<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Day</th><th>Type</th><th>Score</th><th></th></tr></thead><tbody>${att}</tbody></table></div>` : `<p class="muted">No attempts yet.</p>`}
   <div class="row noprint"><button class="btn" onclick="window.print()">Print / save PDF</button><button class="btn" onclick="exportCsv()">Export CSV</button><span class="spacer"></span><button class="btn danger" onclick="resetAll()">Reset all progress</button></div>
   <p class="muted noprint" style="font-size:12px">Your progress is stored only in this browser on this computer. Use Print or Export CSV to hand your results to your trainer.</p></div>`;
}
function exportCsv() {
  const rows = [["Name","Date","Day","Type","Score","Total","Percent","Pass mark","Result"]];
  S.attempts.forEach(a => { const pm = a.mode === "full" ? passMark(a.day) : ""; rows.push([S.name, new Date(a.ts).toISOString(), dayById[a.day].name, a.mode === "full" ? "Full test" : a.label, a.score, a.total, pctOf(a.score, a.total), pm, pm === "" ? "practice" : a.score >= pm ? "PASS" : "NOT YET"]); });
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv" })); const a = document.createElement("a"); a.href = url; a.download = "new-hire-training-results.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function resetAll() { if (confirm("Delete ALL saved progress, results and written answers on this browser? This cannot be undone.")) { S = { name:S.name, studied:{}, attempts:[], written:{} }; save(); route(); } }
route();
</script>
</body>
