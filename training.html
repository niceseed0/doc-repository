:"Thank you for contacting the ELITE Customer Support.","c":[]}]},{"t":"Acknowledgement & Empathy","c":[{"t":"We understand how concerning it can be when a purchased item does not appear in your account. We sincerely apologize for the inconvenience, and we'd be happy to assist you in looking into this matter.","c":[]}]},{"t":"Resolution or Action Item","c":[{"t":"After carefully reviewing the information and receipt you provided, we were unable to locate a matching transaction in our system.","c":[]}]},{"t":"Next Steps or Expectations","c":[{"t":"To help us proceed with the verification, may we kindly ask you to provide another purchase receipt associated with the transaction? If no alternative receipt is available, we may request additional information to help us investigate your concern further. Please rest assured that the information you provide will be reviewed accordingly.","c":[]}]},{"t":"Closing","c":[{"t":"We appreciate your patience and cooperation throughout this process. Once we receive the requested information, we'll be glad to continue investigating your concern and assist you further.","c":[]},{"t":"Thank you for your understanding and have a great day","c":[]}]}]}]},{"title":"Ticket Handling Procedure","blocks":[{"k":"lead","t":"Walks through the standard steps for every ticket. From new ticket to closure."},{"k":"p","t":"Do's and Don'ts"},{"k":"p","t":"Do: Read the entire ticket, check history, tag correctly, leave clear internal notes"},{"k":"p","t":"Don’t: Reply from a template without reading, ask for information the customer already gave, close a ticket without resolution or confirmation, or share internal notes with the customer"},{"k":"p","t":"YES"}]}]},{"id":"sandwich","title":"The Sandwich Method","slides":[{"title":"The Sandwich Method","blocks":[{"k":"p","t":"Deliver difficult messages without losing the customer"},{"k":"h","t":"Key Benefits"},{"k":"cards","nodes":[{"t":"Creates a Positive First Impression: Opens the conversation with acknowledgment and empathy, making customers feel heard and valued.","c":[]},{"t":"Softens Negative Information:Helps communicate limitations, declined requests, or unfavorable investigation results without sounding dismissive.","c":[]},{"t":"Builds Customer Trust:Demonstrates that the representative understands the customer's concern and is willing to assist.","c":[]},{"t":"Maintains Professionalism:Encourages representatives to communicate respectfully, even when handling frustrated customers.","c":[]},{"t":"Improves Customer Experience: Ends the interaction on a positive and helpful note, leaving customers with a sense of support.","c":[]}]},{"k":"cards","nodes":[{"t":"What is the Sandwich Method?","c":[{"t":"The Sandwich Method is a customer support communication technique that frames challenging or negative information between two positive, reassuring statements to make resolutions easier to accept while maintaining clarity and empathy.","c":[]},{"t":"This method helps improve customer satisfaction by making customer interactions more considerate, reassuring, and solution oriented.","c":[]}]}]}]},{"title":"The Sandwich Method Structure","blocks":[{"k":"p","t":"The Sandwich Method consists of three main parts:"},{"k":"cards","nodes":[{"t":"First Layer","c":[{"t":"Positive Opening","c":[]}]},{"t":"Middle Layer","c":[{"t":"Main Information / Resolution","c":[]}]},{"t":"Final Layer","c":[{"t":"Positive Closing","c":[]}]}]}]},{"title":"The Sandwich Method Structure","blocks":[{"k":"p","t":"The Sandwich Method consists of three main parts:"},{"k":"cards","nodes":[{"t":"First Layer: Positive OpeningAcknowledge the customer's concern and establish a positive tone. Makes customers feel acknowledged and understood.","c":[{"t":"Greeting and acknowledgment.","c":[]},{"t":"Empathy and understanding.","c":[]},{"t":"Appreciation for contacting support.","c":[]},{"t":"Example: \"Thank you for reaching out. We understand how important this matter is to you, and we're happy to look into it.\"","c":[]}]},{"t":"Middle Layer: Main Information / ResolutionClearly explain the investigation results, issue, limitations, or resolution. Ensures transparency and provides the actual answer or solution.","c":[{"t":"Findings of the investigation.","c":[]},{"t":"Explanation of the concern.","c":[]},{"t":"Relevant policies or guidelines.","c":[]},{"t":"Solution or alternative options.","c":[]},{"t":"Example: \"After reviewing your account, we were unable to verify the transaction using the information provided. To proceed, may we request an alternative purchase receipt?\"","c":[]}]},{"t":"Final Layer: Positive ClosingEnd the conversation with reassurance and a willingness to provide further assistance. Reinforces the support’s willingness to help and leaves a positive impression.","c":[{"t":"Reassurance and willingness to help.","c":[]},{"t":"Additional assistance or next steps.","c":[]},{"t":"Appreciation and professional closing.","c":[]},{"t":"Example: \"Once we receive the requested information, we'll be glad to assist you further. Thank you for your patience and cooperation!\"","c":[]}]}]}]},{"title":"The Sandwich Method Structure","blocks":[{"k":"p","t":"The Sandwich Method consists of three main parts:"},{"k":"cards","nodes":[{"t":"First Layer[Positive Opening]","c":[{"t":"Hello, Player!Thank you for contacting Customer Support. We understand how concerning it can be when a purchased item does not appear in your account. We sincerely apologize for the inconvenience, and we'd be happy to assist you in looking into this matter.","c":[]}]},{"t":"Middle Layer[Main Information / Resolution]","c":[{"t":"After carefully reviewing the information and receipt you provided, we were unable to locate a matching transaction in our system.","c":[]},{"t":"To help us proceed with the verification, may we kindly ask you to provide another purchase receipt associated with the transaction? If no alternative receipt is available, we may request additional information to help us investigate your concern further.","c":[]},{"t":"Please rest assured that the information you provide will be reviewed accordingly.","c":[]}]},{"t":"Final Layer[Positive Closing]","c":[{"t":"We appreciate your patience and cooperation throughout this process. Once we receive the requested information, we'll be glad to continue investigating your concern and assist you further.","c":[]},{"t":"Thank you for your understanding and have a great day!","c":[]}]}]}]},{"title":"The Sandwich Method","blocks":[{"k":"p","t":"Best Practices When Applying the Sandwich Method"},{"k":"p","t":"Be Genuine"},{"k":"p","t":"Avoid using overly scripted or insincere statements."},{"k":"p","t":"Show Empathy"},{"k":"p","t":"Acknowledge the customer's frustration or inconvenience."},{"k":"p","t":"Be Transparent"},{"k":"p","t":"Clearly explain investigation results, even when the outcome is unfavorable."},{"k":"p","t":"Focus on Solutions"},{"k":"p","t":"Whenever possible, provide alternative options or actionable next steps."},{"k":"p","t":"Avoid False Promises"},{"k":"p","t":"Never guarantee a resolution if it is not within your authority."},{"k":"p","t":"Keep It Concise"},{"k":"p","t":"Maintain a Professional Tone"},{"k":"p","t":"Avoid defensive, blaming, or dismissive language. Jargons or Slang is not allowed"},{"k":"p","t":"Make the response informative without unnecessary explanations."},{"k":"h","t":"Key Takeaways:"},{"k":"p","t":"The Sandwich Method is not about hiding bad news between two positive statements. It is about delivering the truth with empathy, professionalism, and a willingness to help."},{"k":"p","t":"A good customer support response should make customers feel heard, informed, and supported—even when the outcome is not what they expected."}]},{"title":"Activity: CS Scenarios","blocks":[{"k":"lead","t":"Read each customer support scenario carefully and write an appropriate, professional response based on the training guidelines. Apply proper email formats, policies, and the sandwich method where applicable."},{"k":"cards","nodes":[{"t":"Scenario 1: Billing Discrepancy & Double Charge","c":[{"t":"Situation: A customer named Maria Santos contacts support (Ticket ID: MS-98214) furious because she was double-charged for her in-game purchase.","c":[]}]},{"t":"Scenario 2: Technical Lag and Layout Bug","c":[{"t":"Situation: A customer named Maria Santos contacts support (Ticket ID: MS-98214) furious because she was double-charged for her in-game purchase.","c":[]}]},{"t":"Scenario 3: Product Feature Request (Dark Mode)","c":[{"t":"Situation: A customer named Jean Dupont writes in praising the app's story arc, but strongly requests the addition of a complete dark mode.","c":[]}]},{"t":"Scenario 4: Live Chat Wait Time & Account Troubleshooting","c":[{"t":"Situation: You are assisting a customer over live chat who is waiting for you to verify their account details in the admin tool. The system is loading slowly and the check is taking longer than a minute.","c":[]}]},{"t":"Scenario 5: Policy Enforcement (Refusing an Out-of-Policy Refund)","c":[{"t":"Situation: A customer demands a full cash refund for a digital game pack they purchased 45 days ago. Company policy strictly prohibits refunds after a 14-day window.","c":[]}]}]}]}]},{"id":"livechat","title":"Live Chat","slides":[{"title":"Live Chat Introduction","blocks":[{"k":"p","t":"Real-time support, real-time expectations"},{"k":"p","t":"What is Live Chat"},{"k":"p","t":"Unlike traditional ticketing, live chat is a fast-paced, real-time channel where customers expect short, conversational replies and heightened visibility into typing or wait times. Agents handle quick how-to questions, account help, payment checks, and pre-sales inquiries—often requiring multitasking across up to 5 - 10 chats while quickly researching solutions."}]},{"title":"Live Chat Handling Procedure","blocks":[{"k":"lead","t":"The standard flow of every chat."},{"k":"table","rows":[["Step","Sample spiel"],["Introduction","\"Hi Ana, I'm Leo from Support. How can I help you today?\""],["Setting expectations","\"Thanks for waiting, Ana. I'm still checking your account and will update you in about 2 minutes.\""],["Offering alternatives","\"I understand why you'd like that. That isn't available right now, but here's what I can do instead…\""]]},{"k":"src","t":"Note: Procedures vary from team to team. The steps listed here are a general guide only."}]},{"title":"Acceptance Time and Missed Chats","blocks":[{"k":"lead","t":"Acceptance time measures how long it takes an agent to accept an offered chat — it MUST BE DONE WITHIN 10 SECONDS to prevent long customer wait times, abandoned chats and dissatisfaction."},{"k":"table","rows":[["Common cause of a missed chat","Preventive measure"],["Not being on the right status or away from the desk","Establish a mandatory pre-shift routine: verify your chat status is \"Available\" before stepping away."],["Distractions or working on another task and not watching the chat tool","Dedicate chat shifts exclusively to live interactions: close unrelated tabs and minimize background tasks."],["Connectivity, browser or tool problems","Do a quick pre-shift system check so your browser, network and chat tools are stable."],["Tool notifications or sound turned off","Keep the chat application unmuted with high-volume alert sounds enabled at all times."],["Too many concurrent chats","Adhere strictly to your maximum concurrent chat limit and promptly request queue assistance when volume peaks."]]}]},{"title":"Best Practices","blocks":[{"k":"lead","t":"Short, warm, accurate. Habits that make chats efficient and pleasant."},{"k":"p","t":"Preventive Measures"},{"k":"table","rows":[["DO","DON’T"],["Greet by name and confirm understanding","Copy-paste long walls of text"],["Update the customer while checking","Go silent or ghost the chat"],["Offer further help before closing","End the chat abruptly"],["Escalate when you can't solve it","Guess or promise what you can't deliver"]]},{"k":"cards","nodes":[{"t":"Conciseness","c":[{"t":"Keep messages short; one idea per message; use approved macros but personalize them","c":[]}]},{"t":"Clarity","c":[{"t":"Use positive, plain language; avoid jargon","c":[]}]},{"t":"Adaptability","c":[{"t":"Mirror the customer's tone without losing professionalism","c":[]}]},{"t":"Reassurance","c":[{"t":"Never leave the customer in silence; send a holding message when investigating","c":[]}]},{"t":"Security","c":[{"t":"Never share sensitive data in the chat unless allowed","c":[]}]},{"t":"Accuracy","c":[{"t":"Double-check before sending: typos, wrong names, wrong solutions","c":[]}]}]}]}]},{"id":"reviews","title":"Market Reviews","slides":[{"title":"Market Review Introduction","blocks":[{"k":"lead","t":"Public feedback, public responses. Introduces app store and platform reviews and why replying to them matters."},{"k":"h","t":"Types of Reviews"},{"k":"cards","nodes":[{"t":"Praise: Positive feedback expressing satisfaction, compliments, or general appreciation for the app.","c":[]},{"t":"Complaint: Expressions of dissatisfaction regarding general user experience, pricing, policy changes, or service quality.","c":[]},{"t":"Bug Report: Specific technical issues, glitches, crashes, or errors affecting the app’s functionality.","c":[]},{"t":"Feature Request: Suggestions or ideas from users asking for new functionality, enhancements, or design changes.","c":[]},{"t":"Spam or Abusive: Irrelevant content, promotional links, offensive language, harassment, or nonsensical text.","c":[]}]},{"k":"cards","nodes":[{"t":"What is RATINGS and REVIEW","c":[{"t":"Ratings are quantitative scores (typically 1 to 5 stars) that allow users to quickly evaluate an app, product, or service.\n\nReviews are qualitative text comments where users share detailed feedback, experiences, bug reports, feature requests, or suggestions.\n\nTogether, Ratings and Reviews provide a complete picture of customer satisfaction: ratings offer an immediate measurable benchmark, while reviews provide actionable insights to help teams improve product quality and user trust.","c":[]}]}]}]},{"title":"Market Review General Handling Procedure","blocks":[{"k":"lead","t":"The standard process for replying to reviews."},{"k":"dd","do":["Thank the customer","Acknowledge the specific concern","Keep it brief and professional; point to the support channel"],"dont":["Argue, blame the user, or reveal personal or account details","Copy the same reply on every review","Ask for a higher rating in exchange for help"]},{"k":"src","t":"Note: Procedures vary from team to team. The steps listed here are a general guide only."}]},{"title":"Market Review Handling Time","blocks":[{"k":"lead","t":"Respond within the standard. Explains the review response-time expectation."},{"k":"p","t":"Timely responses to user reviews help demonstrate that we value player feedback and are committed to addressing their concerns. To ensure consistency and responsiveness, all reviews should be monitored regularly and handled within the established response-time standards, with priority given to urgent or critical concerns."},{"k":"p","t":"Response Time Standards:"},{"k":"p","t":"Follow the established handling-time expectations for acknowledging and responding to market reviews. Ensure all reviews are addressed within the prescribed timeframe."},{"k":"p","t":"Review Prioritization:"},{"k":"p","t":"Prioritize oldest, no reply, low-star reviews, bug reports, and reviews involving safety concerns or critical issues based on the team's escalation guidelines."},{"k":"p","t":"Regular Queue Monitoring:"},{"k":"p","t":"Check the market review queue according to the schedule set by your lead to ensure no reviews are missed or left unattended."},{"k":"p","t":"Avoid unnecessary delays when investigating concerns or coordinating with other teams. Provide updates or escalate when additional investigation is required."},{"k":"p","t":"Timely Follow-ups:"},{"k":"p","t":"Consistency in Handling:"},{"k":"p","t":"Balance response speed with accuracy. Ensure that replies are relevant, personalized, and aligned with approved response templates."},{"k":"p","t":"“Timely responses matter, but accuracy and proper prioritization are equally important. Stay on schedule, address urgent concerns first, and ensure every review receives appropriate attention.”"}]},{"title":"Best Practices","blocks":[{"k":"lead","t":"Short, human, helpful. Reply techniques with correct and incorrect samples.."},{"k":"p","t":"Preventive Measures"},{"k":"table","rows":[["SAMPLE REVIEW","CORRECT RESPONSE","INCORRECT RESPONSE"],["Maria Santos: Rating: ⭐️⭐️ \u000b\"I was double-charged! (ID: MS-98214).\"","\"Hi Maria, we understand your concern. Please email us privately at support@example.com so we can safely investigate your billing. We appreciate your patience!\"","\"We will fix error MS-98214, Maria. Send your credit card details to public@email.\""],["Kenji Sato: Rating: ⭐️ \u000b\"The update ruined the app layout. It's lagging and logging me out.\"","\"Hi Kenji, thank you for sticking with us. We are sorry for the lag and layout issues and have shared this with our engineers for version 4.2. In the meantime, try clearing your cache or use the in-app link to contact us. We are working to make things smoother!\"","\"Thanks. Update your app.\""],["Jean Dupont: Rating: ⭐️⭐️⭐️⭐️\u000b\"J'adore l'application, mais... un mode sombre complet ?\"","\"Bonjour Jean, merci pour votre fidélité ! C'est une excellente suggestion d'ajouter un mode sombre complet. Nous avons partagé votre idée avec l'équipe de développement.\"","\"Thanks for the review. No dark mode right now.\""]]},{"k":"cards","nodes":[{"t":"PERSONALIZATION","c":[{"t":"Open with thanks or empathy using the reviewer's name when shown","c":[]}]},{"t":"SPECIFICITY","c":[{"t":"Reference the actual issue so it doesn't look automated","c":[]}]},{"t":"BREVITY","c":[{"t":"Mirror the customer's tone without losing professionalism","c":[]}]},{"t":"LANGUAGE","c":[{"t":"Match the language of the review when possible","c":[]}]},{"t":"FORMAT","c":[{"t":"Apply the Sandwich Method on negative reviews","c":[]}]}]}]}]},{"id":"esc","title":"Escalation","slides":[{"title":"Introduction to Escalation","blocks":[{"k":"lead","t":"Recognizing when and how to hand off complex issues."},{"k":"h","t":"Key Points"},{"k":"cards","nodes":[{"t":"Definition: Escalation means routing a specific issue or inquiry to a specialist, lead, or dedicated department equipped with greater expertise or system authority.","c":[]},{"t":"Mindset: Escalating is a standard operational process, not a personal failure—avoiding, mishandling, or delaying a necessary escalation is where service breaks down.","c":[]},{"t":"Escalation Pathways: Issues are routed based on scope, including Tier-based (L1 to L2/L3), Technical/Engineering, Billing/Finance, Management, and Urgent or Emergency paths.","c":[]},{"t":"Core Objectives: Designed to accelerate resolution times, guarantee accurate policy enforcement, and protect both customer trust and business integrity.","c":[]}]},{"k":"cards","nodes":[{"t":"Why ESCALATION is important?","c":[{"t":"In customer support operations, not every issue can or should be resolved at the frontline level. Escalation is a structured workflow mechanism designed to ensure complex, sensitive, or high-impact player concerns are handled by the appropriate specialists quickly and securely.","c":[]},{"t":"Proper escalation workflows directly safeguard both the player experience and operational stability. When frontline agents recognize their limits and escalate promptly, it prevents miscommunication, reduces mean time to resolution (MTTR), avoids unnecessary player frustration, and protects the business from critical technical, financial, or reputational risks.","c":[]}]}]}]},{"title":"Proper Escalation Procedure","blocks":[{"k":"lead","t":"The steps for escalating correctly and the information every escalation must contain."},{"k":"h","t":"Esdcalation Note Checklist"},{"k":"ul","items":["Ticket or chat ID and customer identifier (no sensitive"]},{"k":"p","t":"data in public channels)"},{"k":"ul","items":["Summary of the concern in 1–2 lines","Steps already taken and results","Evidence: screenshots, error messages, timestamps,"]},{"k":"p","t":"device and app version"},{"k":"ul","items":["What is needed from the receiving team and urgency","Customer's current expectation and SLA status"]},{"k":"p","t":"NOTE: Procedures vary from team to team. The steps listed here are a general guide only."}]}]},{"id":"emergency","title":"Emergency Report","slides":[{"title":"Introduction to Emergency Report","blocks":[{"k":"p","t":"Identifying, Escalating, and Managing Critical Incidents in Real Time"},{"k":"h","t":"Key Points"},{"k":"cards","nodes":[{"t":"Immediate Priority Channel: Bypasses normal SLA queues to instantly reach defined emergency responders.","c":[]},{"t":"Risk Mitigation: Focuses on severe threats to user security, financial accuracy, system stability, or brand integrity.","c":[]},{"t":"Speed Over Polish: Prioritizes fast, precise factual details over perfect formatting when broadcasting an incident.","c":[]},{"t":"Proactive Reporting Culture: Encourages reporting even when in doubt, as managing a false alarm is far preferable to missing a real crisis.","c":[]}]},{"k":"cards","nodes":[{"t":"Why ESCALATION is important?","c":[{"t":"An Emergency Report (ER) is an immediate, high-priority alert sent directly to a designated emergency contact group to rapidly contain urgent issues that threaten customer data, financial operations, product stability, or company reputation.","c":[]},{"t":"Standard escalation queues are designed for routine SLA resolution, but critical incidents demand zero delay; swift, accurate emergency reporting enables immediate cross-functional intervention to prevent widespread outage damage, protect player trust, and minimize business impact.","c":[]}]}]}]},{"title":"Emergency Types","blocks":[{"k":"p","t":"Recognize what counts as an emergency"},{"k":"table","rows":[["Emergency Type","Game-Related Scenario","Company-Related Scenario"],["1. Severe Outages & Infrastructure Failure","A global server crash disconnects 100% of active players \u000bduring a major live event, preventing logins and progress \u000bsaving.","A total cloud hosting service outage takes down \u000binternal admin portals, agent ticketing platforms, and \u000bemployee authentication systems."],["2. Data Breach & Security Compromise","A database breach exposes thousands of player account \u000bcredentials, email addresses, and encrypted passwords on a public forum.","A malware attack compromises internal staff \u000bworkstations, exposing confidential company IP, \u000bsource code, or internal payroll documents."],["3. Payment & Financial Discrepancies","A billing bug charges players real money multiple times for a single purchase without granting the purchased in-game \u000bitems.","The payment gateway fails to process payout \u000bdistributions, or a portal exploit allows unauthorized \u000bchargebacks at scale."],["4. Exploits, Cheating & Game Economy Collapse","An item-duplication glitch allows players to clone \u000bhigh-value virtual items, causing hyperinflation and \u000bdestabilizing the player market.","Third-party bot networks bypass anti-cheat measures to farm paid currency, triggering automated payment processor blocks or contract violations."],["5. PR, Safety & Legal Crises","A severe harassment or doxxing campaign targets players \u000bor community managers on live public channels without \u000bactive moderation controls.","Confidential unreleased content or NDA-protected \u000bpartner agreements leak publicly via a compromised \u000binternal account, exposing the studio to legal \u000bpenalties."]]}]},{"title":"General Emergency Procedure","blocks":[{"k":"lead","t":"The standard steps for reporting an emergency correctly."},{"k":"dd","do":["Report immediately and factually","Include time, scope and evidence","Use approved holding statements","Keep a count of affected customers"],"dont":["Wait for \"more proof\" while customers are affected","Speculate about causes publicly or in customer replies","Share internal details or blame teams","Report the same incident repeatedly without new details"]},{"k":"src","t":"Note: Procedures vary from team to team. The steps listed here are a general guide only."}]},{"title":"Emergency Report and Reporting Process","blocks":[{"k":"p","t":"What a good report looks like"},{"k":"h","t":"Important Notes"},{"k":"ul","items":["For any issue involving financial transactions where customers report being charged without receiving confirmation, escalate to Severity 1 immediately and prioritize payment gateway logs alongside rapid customer communication."]},{"k":"table","rows":[["Field","Entry"],["Report title","Customers unable to complete payments"],["Date and time reported","[Date, time, time zone]"],["Reported by","[Agent name, team]"],["Emergency type / severity","Payment issue / [Low, Medium, High, Critical]"],["What happened","Multiple customers report payment failing at checkout since approximately [time]"],["Scope","No. of tickets, chats, reviews so far; platforms affected: [iOS / Android / web]"],["Evidence","Ticket IDs, screenshots of the error message, sample timestamps"],["Actions taken","Verified status page; confirmed same error across [number] accounts; used holding statement"],["Customer impact","Customers cannot purchase; some report being charged but receiving no confirmation"],["Request / needed from team","Investigation of payment gateway; guidance for customer messaging"],["Next update","[Time]"]]}]}]},{"id":"tools","title":"Tools & Systems","slides":[{"title":"Essential CS Tools and Systems","blocks":[{"k":"lead","t":"Know your toolbox before your first ticket. Gives an overview of every tool a CS representative uses and what each one is for."},{"k":"h","t":"Reminder:"},{"k":"ul","items":["Access and credentials: Issued directly by the company (via the team lead) or provided by the client.","Data privacy: Access customer accounts strictly on a per-ticket basis and never share credentials or personal data."]},{"k":"table","rows":[["TOOL CATEGORY","PURPOSE","SAMPLE TOOLS"],["Ticketing / Helpdesk","Receive, track and reply to tickets","Zendesk, Freshdesk, Salesforce Service Cloud"],["Live Chat Platform","Real-time customer chats","Intercom, LiveChat, Drift, Zendesk, Salesforce"],["App Store Consoles","Read and reply to market reviews","Google Play Console, Apple App Store Connect, \u000bAppFollow"],["Admin / Back-Office","Look up customer accounts, orders or transactions","Internal Admin Dashboards, Stripe Admin, Shopify Admin"],["Knowledge Base / Macros","Approved answers and templates","Notion, Confluence, Guru"],["Internal Communication","Logs, trackers, dashboards","Looker, Tableau, Google Sheets / Excel"]]}]},{"title":"Proper Tool Usage","blocks":[{"k":"lead","t":"Shows how tools work together during a typical shift and the rules for using them."},{"k":"p","t":"Customer support tools are most effective when applied consistently and correctly. This section outlines how to integrate our core platforms into your daily routine, ensure proper documentation, and maintain standard procedures throughout your shift."},{"k":"p","t":"Follow the Shift Routine:"},{"k":"p","t":"Execute standard daily workflows—from start-of-shift status checks and queue monitoring to logging and team handovers."},{"k":"p","t":"Maintain Accurate Documentation:"},{"k":"p","t":"Consistently record all updates in designated systems, including ticket notes, trackers, and shift logs."},{"k":"p","t":"Standardize Messaging:"},{"k":"p","t":"Rely on approved templates and macros, routing any proposed updates strictly through the designated tool owner."},{"k":"p","t":"Promptly Escalate Outages:"},{"k":"p","t":"Immediately report tool downtime, glitches, or technical bugs through the official escalation channel."},{"k":"h","t":"Key Points"},{"k":"cards","nodes":[{"t":"DO’s • Log out of shared devices and keep credentials private • Verify before changing an account • Report tool issues immediately","c":[]}]},{"k":"cards","nodes":[{"t":"DON’Ts • Share passwords or screenshots with customer data outside approved channels • Make changes to accounts without proper authorization • Work around tool problems silently","c":[]}]}]}]}]},{"id":"d4","name":"Day 4","title":"Community & Game Management","desc":"Community management, moderation etiquette, game master duties and rules of conduct.","exam":{"pass_pct":80,"minutes":25,"src":"20 multiple-choice questions from the supplied Day 4 exam (pass 16/20)."},"sections":[{"id":"found","title":"Community vs Game Management","slides":[{"title":"Overview","blocks":[{"k":"p","t":"What Will We Learn?"},{"k":"p","t":"This training introduces the two major operational functions in gaming BPO: COMMUNITY MANAGEMENT and GAME MANAGEMENT. Trainees will learn their respective roles, responsibilities, platforms, and standard operating practices."},{"k":"cards","nodes":[{"t":"Community Management fundamentals: Building, engaging, and maintaining two-way communication with the player base.","c":[]},{"t":"Game Management fundamentals: Overseeing live-ops, in-game economy, server stability, and player retention.","c":[]},{"t":"Game Master roles and responsibilities: Providing in-game player support, investigating exploits, and facilitating live events.","c":[]},{"t":"Community moderation and platform etiquette: Managing social channels to keep discussions constructive and uphold platform standards.","c":[]},{"t":"Rules of conduct and policy enforcement: Applying Terms of Service and community guidelines through warnings, suspensions, or bans.","c":[]}]}]},{"title":"Understanding BPO Operations","blocks":[{"k":"p","t":"The Role of Teams in Online Gaming"},{"k":"p","t":"ELITE GLOBAL SOURCING provide behind-the-scenes support to maintain game quality, player satisfaction, and community engagement. ELITE agents perform monitoring, moderation, reporting, and player interaction through digital platforms. Our KEY RESPONSIBILITY includes:"},{"k":"cards","nodes":[{"t":"Maintaining a safe gaming environment","c":[{"t":"Protecting players from toxicity, harassment, and disruptive behavior.","c":[]}]},{"t":"Monitoring player activities and discussions","c":[{"t":"Tracking in-game chats, forums, and social channels in real time.","c":[]}]},{"t":"Enforcing game and community policies","c":[{"t":"Applying Terms of Service consistently through warnings, mutes, or bans.","c":[]}]},{"t":"Supporting player engagement","c":[{"t":"Facilitating live events, answering inquiries, and fostering positive interaction.","c":[]}]},{"t":"Reporting suspicious activities and operational concerns","c":[{"t":"Escalating exploits, bugs, cheating, and server issues to technical teams.","c":[]}]}]}]},{"title":"Community vs Game Management","blocks":[{"k":"p","t":"Two Functions, One Gaming Ecosystem"},{"k":"p","t":"Although both functions contribute to the overall player experience, their primary responsibilities differ."},{"k":"p","t":"Community Management builds trust and engagement among players, while Game Management ensures that gameplay remains fair, secure, and consistent with established policies. Both functions work together to protect the gaming experience and support the game's long-term success."},{"k":"table","rows":[["Community Management","Game Management"],["Focuses on player communities and engagement","Focuses on the gaming environment and operations"],["Manages SNS and forums","Monitors in-game activities"],["Handles discussions and community concerns","Handles game-related violations and incidents"],["Promotes positive player interaction","Maintains fair gameplay and rule enforcement"],["Builds relationships with players","Protects game integrity"]]}]}]},{"id":"comm","title":"Community Management","slides":[{"title":"Fundamentals of Community Management","blocks":[{"k":"p","t":"Building and Maintaining Gaming Communities"},{"k":"h","t":"Importance of Community Management"},{"k":"cards","nodes":[{"t":"Builds Player Relationships","c":[{"t":"Creates trust and strengthens the connection between players and the game.","c":[]}]},{"t":"Encourages Player Engagement","c":[{"t":"Keeps players active through discussions, events, announcements, and interactive activities.","c":[]}]},{"t":"Provides Player Feedback Helps developers understand player concerns, suggestions, and overall gaming experiences.","c":[]},{"t":"Maintains a Positive Environment","c":[{"t":"Promotes respectful interactions and addresses toxic behavior, spam, and inappropriate content.","c":[]}]},{"t":"Strengthens Player Retention","c":[{"t":"Encourages players to remain active and continue supporting the game.","c":[]}]}]},{"k":"cards","nodes":[{"t":"What Is Community Management?","c":[{"t":"Community Management is the process of building, managing, and maintaining positive relationships between a gaming company and its players. It involves interacting with players, responding to their questions and concerns, sharing game updates, moderating discussions, and encouraging active participation across different community platforms.\n\nIn the gaming industry, Community Management serves as the bridge between the game developers and the player community, ensuring that players feel heard, valued, and connected to the game.","c":[]}]}]}]},{"title":"Objectives of Community Management","blocks":[{"k":"p","t":"Encouraging Engagement, Trust, and Retention"},{"k":"p","t":"Community Management aims to set up a healthy relationship between the game publisher and its player base by encouraging participation, providing relevant information, and keeping a welcoming environment."},{"k":"p","t":"Increase player engagement and participation"},{"k":"p","t":"Encourage players to actively participate through discussions, events, contests, and community activities."},{"k":"p","t":"Establish trust between players and the game publisher"},{"k":"p","t":"Build player confidence through transparent communication, accurate information, and consistent support."},{"k":"p","t":"Promote respectful conversations where players can exchange ideas, feedback, and suggestions."},{"k":"p","t":"Encourage constructive discussions"},{"k":"p","t":"Promote game updates, activities, and announcements"},{"k":"p","t":"Keep players informed about new features, events, maintenance schedules, and official game announcements."},{"k":"p","t":"Identify and address community concerns"},{"k":"p","t":"Monitor player feedback, recognize recurring issues, and escalate concerns to the appropriate teams for resolution."},{"k":"p","t":"Community Management is more than simply responding to player comments and inquiries. It is about building a healthy, active, and engaged gaming community where players feel valued and supported."},{"k":"p","t":"A successful Community Manager does not just communicate with players; they build relationships, listen to feedback, and help create a positive gaming experience."}]},{"title":"Community Management in Gaming Operations","blocks":[{"k":"p","t":"Connecting Players, Developers, and the Gaming Brand"},{"k":"p","t":"Community Management acts as the essential two-way conduit between the player base and the game studio, ensuring players feel heard while keeping internal teams informed of live community dynamics."},{"k":"p","t":"Successful community management turns player feedback into game improvements and studio updates into player trust."},{"k":"cards","nodes":[{"t":"Player-to-company communication: Acting as the accessible human face of the brand across Discord, Reddit, and social platforms to answer questions, acknowledge player concerns, and maintain open, transparent dialogue.","c":[]},{"t":"Community feedback collection: Systematically tracking player discussions, running surveys, and analyzing sentiment around new patches, balance changes, or monetization to separate constructive trends from isolated noise.","c":[]},{"t":"Announcement and information dissemination: Crafting and distributing clear, timely messaging—such as patch notes, maintenance alerts, event schedules, and crisis communications—tailored to the tone of each platform.","c":[]},{"t":"Coordination with internal departments: Translating raw community sentiment into actionable reports for developers, QA, marketing, and Game Masters to prioritize bug fixes, shape future updates, and align promotional campaigns.","c":[]}]}]},{"title":"Gaming Communities and Platforms","blocks":[{"k":"p","t":"Understanding Player Groups and Where They Connect"},{"k":"p","t":"Gaming communities bring together players with shared interests, gameplay preferences, and experiences. They interact through different digital platforms, each serving a specific purpose for communication, engagement, and community activities."},{"k":"table","rows":[["TYPES OF GAMING COMMUNITIES",""],["Casual Gaming Communities","Players who participate for entertainment and social interaction."],["Competitive Gaming Communities","Players focused on rankings, tournaments, and competitive gameplay."],["Social Gaming Communities","Players who prioritize friendships and group interaction."],["Fan-Based Communities","Players who support specific games, characters, or franchises."],["Official Gaming Communities","Communities managed or recognized by the game publisher."]]},{"k":"table","rows":[["GAMING COMMUNITY PLATFORMS","","","",""],["SOCIAL NETWORKING SITES","COMMUNITY FORUMS","COMMUNICATION\u000bPLATFORMS","IN-GAME CHANNELS","CONTENT PLATFORMS"],["Facebook, X, Instagram,\u000bTikTok","Official forums, \u000bdiscussion boards","Discord, community \u000bchat apps","World chat, guild chat, party chat, and private messaging.","YouTube, Twitch \u000b& livestreaming communities"]]}]},{"title":"Platform Scope and Functions","blocks":[{"k":"p","t":"Understanding the Purpose of Each Platform"},{"k":"p","t":"Each gaming platform has its own communication style, audience, and moderation requirements. Community personnel must understand these differences to ensure consistent and proper engagement."},{"k":"h","t":"Social Networking Sites"},{"k":"p","t":"Used for announcements, promotions, audience engagement, and gathering public feedback."},{"k":"h","t":"Community Forums"},{"k":"p","t":"Used for in-depth discussions, player suggestions, bug reports, and concerns."},{"k":"h","t":"Communication Platforms"},{"k":"p","t":"Used for real-time conversation and coordinating community activities."},{"k":"h","t":"In-game Channels"},{"k":"p","t":"Used for direct player-to-player interaction and conversations about gameplay."},{"k":"h","t":"Content Platforms"},{"k":"p","t":"Used for building community awareness, collecting feedback, and driving engagement with content."},{"k":"p","t":"Monitor every platform regularly, keep announcements and known-issue messaging consistent across channels, route bug reports and suggestions to the right internal teams, respond promptly to public feedback on social media, and follow each platform’s brand and usage guidelines."}]},{"title":"Community Manager Roles and Responsibilities","blocks":[{"k":"p","t":"Managing Player Relationships and Community Activities"},{"k":"p","t":"Community Managers oversee keeping communication between the gaming company and its players while ensuring that community activities follow established guidelines."},{"k":"p","t":"Community Manager Responsibilities"},{"k":"cards","nodes":[{"t":"Managing community discussions","c":[{"t":"Facilitating conversations, maintaining a welcoming environment, and ensuring discussions remain respectful and relevant.","c":[]}]},{"t":"Publishing Approved Announcements","c":[{"t":"Sharing verified and authorized updates, news, and important information with the player community.","c":[]}]},{"t":"Responding to Player Inquiries","c":[{"t":"Addressing player questions, concerns, and requests by providing timely and helpful responses.","c":[]}]},{"t":"Encouraging Positive Engagement","c":[{"t":"Promoting healthy interactions, organizing community activities, and encouraging players to participate.","c":[]}]},{"t":"Coordinating with Internal Teams","c":[{"t":"Collaborating with relevant departments to address player concerns, share updates, and resolve community-related issues.","c":[]}]},{"t":"Monitoring Community Feedback","c":[{"t":"Tracking player comments, suggestions, and sentiments to identify trends and areas for improvement.","c":[]}]}]}]},{"title":"Community Monitoring and Engagement","blocks":[{"k":"p","t":"Keeping Track of Community Activities"},{"k":"p","t":"Monitoring involves regularly checking community platforms to identify player sentiments, trending discussions, inappropriate content, and potential issues that may affect the community."},{"k":"p","t":"Key Tasks & Responsibilities"},{"k":"cards","nodes":[{"t":"Monitor posts, comments, and discussions.","c":[{"t":"Regularly review community activities to ensure conversations remain appropriate and aligned with community guidelines.","c":[]}]},{"t":"Identify recurring player concerns.","c":[{"t":"Recognize frequently raised issues and concerns to help address common player experiences.","c":[]}]},{"t":"Track reactions to announcements and updates.","c":[{"t":"Observe player responses to official announcements, game updates, and other important communications.","c":[]}]},{"t":"Observe Community Sentiment","c":[{"t":"Assess overall player opinions, reactions, and attitudes toward the game and its community.","c":[]}]},{"t":"Identify Suspicious or Harmful Activities","c":[{"t":"Watch for spam, scams, inappropriate content, harassment, and other activities that may affect community safety.","c":[]}]},{"t":"Report Unusual Activity to the Appropriate Team","c":[{"t":"Escalate suspicious behavior, potential violations, and significant community concerns to the relevant internal team for investigation.","c":[]}]}]}]}]},{"id":"mod","title":"Moderation & Etiquette","slides":[{"title":"Community Moderation and Platform Etiquette","blocks":[{"k":"p","t":"Maintaining a Respectful and Safe Environment"},{"k":"p","t":"Community Moderation involves reviewing player-generated content and ensuring that discussions comply with the platform's community standards and the game's rules of conduct."},{"k":"table","rows":[["General Community Moderation Guidelines",""],["Review Content Before Taking Moderation Action","Carefully assess posts, comments, and reported content before deciding whether moderation is necessary."],["Apply Policies Consistently and Objectively","Enforce community guidelines fairly and equally, without favoritism or personal \u000bbias."],["Avoid Personal Arguments with Players","Maintain a calm and professional approach when handling disagreements, \u000bcomplaints, or negative interactions."],["Remove or Restrict Content Only When Authorized by Policy","Take moderation actions only when content violates established community \u000bguidelines and the action is permitted by policy."],["Document Violations When Required","Keep records of reported incidents, policy violations, and moderation actions for proper tracking and reference."],["Escalate Serious or Unclear Cases","Refer complex situations, severe violations, or cases requiring further review to \u000bthe appropriate team."],["Maintain Player Privacy and Confidentiality","Protect personal information and sensitive player data by following established \u000bprivacy and confidentiality guidelines."]]}]},{"title":"SNS Moderation and Proper Etiquette","blocks":[{"k":"p","t":"Professional Communication on Social Media"},{"k":"p","t":"SNS moderation focuses on monitoring public posts, comments, messages, and reactions across social media platforms. Since these platforms are publicly accessible, responses must be professional and carefully worded."},{"k":"p","t":"Additional Etiquette Guidelines: The following two etiquette rules apply across all five moderation concerns:"},{"k":"ul","items":["Maintain confidentiality: Never share internal discussions, private player information, or unauthorized details.","Remain objective: Avoid expressing personal opinions or biases when communicating through official accounts."]},{"k":"table","rows":[["Common Moderation Concern","Proper Etiquette / Recommended Action"],["Offensive Comments and Harassment","Use polite and professional language. Hide, remove, or report offensive content \u000baccording to community guidelines."],["Spam and Promotional Links","Remove or report spam and unauthorized promotional links according to policy. \u000bAvoid engaging with suspicious posts."],["Frauds and Impersonation","Verify information before responding. Report suspicious accounts or fraudulent \u000bactivities and never disclose confidential information."],["Misinformation and Misleading Announcements","Verify information before responding and use approved communication templates to \u000bensure accurate and consistent messaging."],["Personal Attacks and Discriminatory Remarks","Avoid arguments or confrontational exchanges. Address violations objectively and \u000btake appropriate moderation action according to policy."]]}]},{"title":"Forum Moderation and Proper Etiquette","blocks":[{"k":"p","t":"Maintaining Organized and Constructive Discussions"},{"k":"p","t":"Forum moderation ensures that discussions remain relevant, organized, and respectful. Moderators help maintain discussion quality while ensuring that players can share feedback and concerns appropriately."},{"k":"p","t":"Additional Etiquette Guidelines:"},{"k":"ul","items":["Respect GM Responsibilities: Never misuse GM privileges or use moderation authority for personal reasons.","Maintain Confidentiality: Keep sensitive moderation actions, internal discussions, and investigation details confidential when required.","Follow Proper Procedures: Ensure all warnings, restrictions, and enforcement actions comply with established guidelines."]},{"k":"table","rows":[["Common Moderation Concern","Proper Etiquette / Recommended Action"],["Off-Topic Discussions","Read the entire discussion before responding. Keep replies relevant to the original topic \u000band redirect conversations when necessary."],["Duplicate Threads","Check existing discussions before creating or responding to new topics. Merge or \u000bredirect duplicate threads when authorized."],["Inappropriate Language","Address inappropriate language professionally and take appropriate moderation \u000baction according to community guidelines."],["Harassment and Personal Attacks","Avoid favoritism or biased responses. Handle reports objectively and explain \u000bmoderation decisions professionally when required."],["False Information and Misleading Claims","Encourage constructive feedback and verify information before responding. Provide \u000baccurate clarifications when necessary."],["Harassment and Personal Attacks","Use appropriate forum categories and tags. Remove, restrict, or report unauthorized \u000badvertisements according to moderation policies."]]}]},{"title":"In-game Moderation and Proper Etiquette","blocks":[{"k":"p","t":"Promoting Fair and Respectful Player Interaction"},{"k":"p","t":"In-game moderation involves monitoring player communications and activities to identify behavior that violates game policies. Moderators must remain impartial and avoid disrupting legitimate gameplay."},{"k":"p","t":"Additional Etiquette Guidelines:"},{"k":"ul","items":["Promote constructive discussions: Encourage players to share feedback respectfully and keep conversations productive.","Maintain impartiality: Treat all players fairly and avoid giving preferential treatment.","Communicate moderation decisions clearly: Explain actions professionally when clarification is necessary and authorized."]},{"k":"table","rows":[["Common Moderation Concern","Proper Etiquette / Recommended Action"],["Harassment and Abusive Language","Communicate respectfully with players and avoid provoking or challenging them. Address \u000babusive behavior professionally and follow established warning procedures."],["Hate Speech and Discrimination","Remain neutral and objective when handling reports. Apply enforcement policies consistently and avoid showing favoritism or personal bias."],["Spam and Chat Flooding","Follow established warning and enforcement procedures to manage repeated messages, \u000bdisruptive behavior, and excessive chat activity."],["Threats and Inappropriate Behavior","Handle serious or threatening behavior professionally. Record incidents and escalate them to \u000bthe appropriate team when necessary."],["Scamming and Impersonation","Document suspicious activities, protect player information, and report or escalate suspected \u000bfraudulent behavior for further investigation."],["Unauthorized Advertising","Address unauthorized promotions according to established policies. Use moderation privileges responsibly and avoid taking unauthorized actions."]]}]},{"title":"Comparisson of the 3 Moderation Areas","blocks":[{"k":"lead","t":"Comparing the roles and responsibilities of the three moderation areas."},{"k":"p","t":"The three moderation areas share the same goal of maintaining a safe, respectful, and positive gaming community. However, each focuses on different types of player interactions and moderation responsibilities."},{"k":"p","t":"KEY SIMILARITIES : All three moderation areas require the following:"},{"k":"cards","nodes":[{"t":"Professional Communication","c":[{"t":"Always communicate politely and respectfully with players.","c":[]}]},{"t":"Fair and Objective Decisions","c":[{"t":"Apply rules consistently without favoritism or personal bias.","c":[]}]},{"t":"Policy Compliance","c":[{"t":"Follow established community guidelines and moderation procedures.","c":[]}]},{"t":"Player Safety","c":[{"t":"Address harassment, abusive behavior, scams, and other harmful activities.","c":[]}]},{"t":"Confidentiality","c":[{"t":"Protect player information and internal discussions.","c":[]}]},{"t":"Proper Escalation Report serious violations and unclear cases to the appropriate team.","c":[]}]}]},{"title":"Comparisson of the 3 Moderation Areas","blocks":[{"k":"lead","t":"Comparing the roles and responsibilities of the three moderation areas."},{"k":"p","t":"The three moderation areas share the same goal of maintaining a safe, respectful, and positive gaming community. However, each focuses on different types of player interactions and moderation responsibilities."},{"k":"p","t":"Remember: The GOAL of moderation is not simply to remove inappropriate content or punish players. It is to MAINTAIN a healthy, fair, safe, and welcoming gaming environment while ENSURING that every player is treated with respect."},{"k":"table","rows":[["KEY DIFFERENCES","","",""],["Aspect","Community","Forum","In-Game"],["Primary Platform","Social media and community channels","Official forums and discussion boards","In-game chat and gaming environment"],["Main Priority","Positive community engagement","Organized and constructive discussions","Fair gameplay and player safety"],["Content Management","Announcements, comments, and \u000bfeedback","Threads, posts, and topic categories","Player chat and in-game interactions"],["Common Issues","Scams, impersonation, spam, and \u000bharassment","Duplicate topics, off-topic posts, and \u000bmisinformation","Chat flooding, threats, abusive \u000blanguage, and GM abuse"],["Moderation Approach","Monitor, respond, hide, or report","Review, redirect, merge, or moderate","Warn, enforce, document, or escalate \u000baccording to authorization"]]}]}]},{"id":"gm","title":"Game Management & Game Masters","slides":[{"title":"Fundamentals of Game Management","blocks":[{"k":"p","t":"Maintaining the Integrity of the Gaming Environment"},{"k":"h","t":"Importance of Game Management"},{"k":"cards","nodes":[{"t":"Maintains Fair Gameplay","c":[{"t":"Ensures that all players follow established game rules and compete fairly without gaining unauthorized advantages.","c":[]}]},{"t":"Protects Game Integrity","c":[{"t":"Identifies and addresses cheating, exploits, botting, and other unauthorized activities that may disrupt normal gameplay.","c":[]}]},{"t":"Ensures Player Safety","c":[{"t":"Helps protect players by addressing harassment, scams, abusive behavior, and other activities that may create an unsafe gaming environment.","c":[]}]},{"t":"Supports Game Operations","c":[{"t":"Monitors gameplay conditions, identifies unusual activities, and reports technical issues or operational incidents to the appropriate teams.","c":[]}]},{"t":"Promotes Accountability","c":[{"t":"Ensures that violations are handled consistently through proper investigation, documentation, and authorized enforcement procedures.","c":[]}]},{"t":"Improves Player Experience","c":[{"t":"Helps create a balanced and enjoyable gaming environment where players can participate confidently and without unnecessary disruptions.","c":[]}]}]},{"k":"cards","nodes":[{"t":"What Is GAME Management?","c":[{"t":"Game Management refers to the operational process of overseeing and maintaining the gaming environment to ensure that gameplay follows established rules, policies, and operational standards.\nUnlike Community Management, which focuses on player relationships and engagement, Game Management primarily focuses on gameplay integrity, player activities, and game-related operations.\nGame Management plays an essential role in maintaining a fair, secure, and stable gaming environment. It helps protect game integrity, prevent rule violations, address player concerns, and ensure that all players have an enjoyable gaming experience.","c":[]}]}]}]},{"title":"Objectives of Game Management","blocks":[{"k":"p","t":"Defining the Goals of Fair, Secure, and Effective Game Operations"},{"k":"p","t":"Game Management aims to maintain a fair, secure, and properly regulated gaming environment by overseeing player activities, protecting game systems, and ensuring compliance with established policies."},{"k":"p","t":"Maintain Fair Gameplay"},{"k":"p","t":"Ensure that players follow game rules and participate without unauthorized advantages."},{"k":"p","t":"Protect Game Security"},{"k":"p","t":"Detect and address cheating, hacking, exploits, botting, and other unauthorized activities."},{"k":"p","t":"Enforce Game Policies"},{"k":"p","t":"Apply rules and appropriate disciplinary actions consistently to address violations."},{"k":"p","t":"Identify suspicious behavior, unusual gameplay patterns, and potential risks to the gaming environment."},{"k":"p","t":"Monitor Player Activities"},{"k":"p","t":"Resolve Gameplay Issues"},{"k":"p","t":"Preserve Game Integrity"},{"k":"p","t":"Support a Positive Player Experience"},{"k":"p","t":"Investigate player concerns, reported violations, and incidents affecting gameplay."},{"k":"p","t":"Preserve Game Integrity – Prevent activities that could disrupt game balance, damage the gaming experience, or undermine player trust."},{"k":"p","t":"Promote a safe, balanced, and enjoyable environment for the entire gaming community."},{"k":"p","t":"Key Takeaway: Game Management aims to protect the game, uphold its rules, and ensure a fair and enjoyable experience for all players."}]},{"title":"Game Master Roles and Responsibilities","blocks":[{"k":"p","t":"The Role of a Game Master in Gaming Operations"},{"k":"p","t":"A Game Master is an authorized personnel member responsible for monitoring the game environment, assisting with game-related operational concerns, and enforcing game policies within the limits of assigned authority."},{"k":"cards","nodes":[{"t":"Monitor player activities","c":[{"t":"Track real-time gameplay, chat logs, and system metrics to detect unusual behavior.","c":[]}]},{"t":"Identify rule violations","c":[{"t":"Flag breaches of the Terms of Service, including cheating, toxic behavior, and exploits.","c":[]}]},{"t":"Investigate reported incidents","c":[{"t":"Review player reports, telemetry, and server logs to verify suspected infractions.","c":[]}]},{"t":"Enforce game policies","c":[{"t":"Apply appropriate penalties—such as warnings, mutes, or bans—in accordance with standard guidelines.","c":[]}]},{"t":"Assist with authorized in-game concerns","c":[{"t":"Resolve approved player requests, technical blockers, and legitimate account issues.","c":[]}]},{"t":"Coordinate with relevant departments","c":[{"t":"Escalate critical bugs, security threats, and complex cases to QA, dev, or senior support teams.","c":[]}]},{"t":"Maintain accurate operational records","c":[{"t":"Document case findings, enforcement actions, and ticket metrics in internal tracking systems.","c":[]}]}]}]},{"title":"Game Master Authority and Limitations","blocks":[{"k":"p","t":"Understanding GM Privileges and Accountability"},{"k":"p","t":"Game Masters may have access to privileged tools and administrative functions. These privileges must only be used for legitimate operational purposes and in accordance with established authorization procedures."},{"k":"h","t":"Key Guidfelines:"},{"k":"p","t":"All GM actions are logged and monitored; follow these rules strictly to uphold fair play, player trust, and operational security."},{"k":"cards","nodes":[{"t":"Use GM tools only for authorized tasks: Limit tool usage to verified support duties and scheduled events to prevent disruptions.","c":[]},{"t":"Never use administrative privileges for personal benefit:Do not grant items, stats, or favors to yourself, friends, or guilds.","c":[]},{"t":"Do not access player information without a valid operational reason:Only view account logs and player data when investigating active, assigned issues.","c":[]},{"t":"Follow approval requirements for sensitive actions:Obtain lead or manager sign-off before executing high-impact changes, such as bans or restorations.","c":[]},{"t":"Maintain confidentiality of internal tools and procedures: Never share screenshots, command lists, or internal workflows with the public.","c":[]},{"t":"Document administrative activities when required: Record all actions and escalations accurately to ensure accountability and an audit trail.","c":[]}]}]},{"title":"Game Monitoring and Surveillance","blocks":[{"k":"p","t":"Observing Player Activities and Game Conditions"},{"k":"p","t":"Game Monitoring involves observing the gaming environment to identify suspicious activities, possible policy violations, technical concerns, and unusual player behavior."},{"k":"p","t":"Key Tasks & Responsibilities"},{"k":"cards","nodes":[{"t":"Monitor Player Activities and Interactions","c":[{"t":"Observe player behavior and in-game activities to identify possible violations.","c":[]}]},{"t":"Observe Game Communication","c":[{"t":"Review public and authorized private communications for inappropriate behavior or policy violations.","c":[]}]},{"t":"Identify Suspicious Gameplay Patterns","c":[{"t":"Detect unusual player actions or activity that may indicate cheating or exploitation.","c":[]}]},{"t":"Watch for Exploits and Unauthorized Activities","c":[{"t":"Identify reported or observed abuse of game mechanics, cheats, bots, and other prohibited activities.","c":[]}]},{"t":"Monitor Announcements and Operational Alerts","c":[{"t":"Stay updated on official game notices, system alerts, maintenance updates, and operational incidents.","c":[]}]},{"t":"Record Unusual Findings","c":[{"t":"Document suspicious activities, observations, and relevant details for proper investigation and reporting.","c":[]}]}]}]},{"title":"Identifying Suspicious Activities","blocks":[{"k":"p","t":"Recognizing Potential Game Violations"},{"k":"p","t":"Game Masters must recognize behavioral patterns that may indicate cheating, exploitation, account abuse, or other violations. Examples of Suspicious Activities are:"},{"k":"p","t":"Suspicious behavior should be investigated using approved evidence and procedures. A suspicious pattern alone does not automatically establish a violation."},{"k":"cards","nodes":[{"t":"Possible botting or automated gameplay","c":[{"t":"Using scripts, macros, or software to automate gameplay without human input.","c":[]}]},{"t":"Exploitation of game bugs","c":[{"t":"Abusing glitches or unintended mechanics to bypass progression or gain an unfair advantage.","c":[]}]},{"t":"Abnormal farming or resource collection patterns","c":[{"t":"Gathering currency, items, or XP at inhuman rates, durations, or repetitive routes.","c":[]}]},{"t":"Suspected account sharing or account selling","c":[{"t":"Allowing unauthorized access (e.g., boosting) or transferring account ownership for real-world value.","c":[]}]},{"t":"Unauthorized third-party programs","c":[{"t":"Running unapproved external software (cheats, memory editors, overlays) that modifies or reads game data.","c":[]}]},{"t":"Currency manipulation or suspicious trading","c":[{"t":"Engaging in real-money trading (RMT) or one-sided transfers to move illicitly obtained wealth.","c":[]}]}]}]},{"title":"Game Moderation and Policy Enforcement","blocks":[{"k":"p","t":"Enforcing Rules Within the Gaming Environment"},{"k":"p","t":"Game Moderation involves identifying and addressing player behavior that violates established game policies. Its primary objective is to protect gameplay integrity and ensure fair treatment of all players."},{"k":"p","t":"Key Tasks & Responsibilities"},{"k":"cards","nodes":[{"t":"Review player-reported violations: Evaluate incoming user reports, chat logs, and gameplay evidence to assess the validity and severity of claims against community guidelines.","c":[]},{"t":"Monitor inappropriate in-game behavior: Proactively observe live gameplay and public channels to detect toxic or disruptive conduct.","c":[]},{"t":"Investigate possible rule violations: Gather supporting data, analyze account histories, and verify context to confirm whether an infraction or exploit has occurred.","c":[]},{"t":"Apply authorized moderation actions: Execute appropriate penalties, such as warnings, mutes, suspensions, or bans per policy.","c":[]},{"t":"Document enforcement activities: Maintain accurate records of evidence and penalty decisions for accountability and appeals.","c":[]},{"t":"Escalate complex or sensitive cases: Route high-risk, ambiguous, or severe issues to senior staff or trust and safety teams.","c":[]}]}]},{"title":"Policy Enforcement and Violation Matrix","blocks":[{"k":"p","t":"Understanding Prohibited Gameplay Activities & Applying Consistent, Fair Disciplinary Actions"},{"k":"p","t":"Game violations compromise fair gameplay, disrupt the gaming environment, or violate the Terms of Service. Game Masters must apply official enforcement policies consistently, ensuring every disciplinary action is supported by evidence and aligned with offense severity."},{"k":"table","rows":[["Common Game Violation","Standard Enforcement Actions","Core Enforcement Principles"],["Cheating & Unauthorized Third-Party Software","• Temporary suspension\n• Permanent account suspension","• Evidence-based decisions\n• Compliance with approval and escalation procedures"],["Botting & Automation","• Temporary account restriction\n• Permanent account suspension","• Evidence-based decisions\n• Proper documentation"],["Exploiting Bugs & Unintended Mechanics","• Temporary suspension\n• Permanent account suspension\n• Other authorized disciplinary measures (e.g., item/progress rollback)","• Appropriate penalty severity\n• Compliance with approval and escalation procedures"],["Account Selling, Buying, or Sharing","• Temporary account restriction\n• Permanent account suspension","• Consistent policy application\n• Proper documentation"],["Scamming & Fraudulent Transactions","• Temporary suspension\n• Permanent account suspension\n• Other authorized disciplinary measures","• Evidence-based decisions\n• Compliance with approval and escalation procedures"],["Harassment & Abusive Communication","• Verbal or written warning\n• Chat restriction or mute\n• Temporary suspension (for repeat/severe offenses)","• Appropriate penalty severity\n• Consistent policy application"],["Real-Money Trading (RMT)","• Permanent account suspension\n• Other authorized disciplinary measures","• Evidence-based decisions\n• Compliance with approval and escalation procedures"],["Impersonation of Staff or Other Players","• Verbal or written warning\n• Temporary suspension\n• Permanent account suspension (for staff impersonation/fraud)","• Appropriate penalty severity\n• Proper documentation"]]}]},{"title":"Game Master Platform Responsibilities","blocks":[{"k":"p","t":"Managing Game Master Support, Monitoring, and Direct Operations Across SNS, Forums, and In-Game"},{"k":"p","t":"Game Masters operate across multiple platforms to maintain fair gameplay, monitor community discussions, and address player concerns. Each environment requires distinct workflows, authorization boundaries, and team coordination."},{"k":"p","t":"Operational Reminder:"},{"k":"p","t":"Official public-facing posts, announcements, and clarifications must only be published or provided by personnel explicitly authorized to manage the relevant SNS accounts or forum channels."},{"k":"table","rows":[["PLATFORM","CORE PURPOSE","KEY TASKS AND OPERATIONAL DUTIES"],["SNS (Social Media)","Game Master Support Through Social Media Channels\nSupporting SNS operations by monitoring discussions, \u000bspotting violations, and routing concerns.","• Monitor reported game-related concerns.\n• Identify suspicious player activities reported via SNS.\n• Verify concerns using approved internal channels."],["Forums","Reviewing Player Reports and Game-Related Discussions\nReviewing community threads where players report issues, \u000bdiscuss gameplay and share feedback.","• Review game-related reports and complaints.\n• Identify discussions involving exploits and cheating.\n• Monitor recurring gameplay concerns.\n• Provide approved clarifications when authorized."],["In-Game","Direct Monitoring and Management of Gameplay\nCore GM responsibility involving direct observation and \u000bauthorized administrative actions.","• Monitor player behavior and gameplay activities.\n• Respond to player reports and in-game concerns.\n• Investigate suspected violations and conduct checks.\n• Apply approved disciplinary measures.\n• Assist with designated in-game events and activities."]]}]}]},{"id":"rules","title":"Rules of Conduct","slides":[{"title":"Rules and Conduct","blocks":[{"k":"p","t":"Establishing Standards for Player Behavior"},{"k":"h","t":"General Rules:"},{"k":"cards","nodes":[{"t":"Respect other players and community members.","c":[]},{"t":"Do not engage in harassment, bullying, or      discrimination.","c":[]},{"t":"Do not use offensive language or inappropriate      content.","c":[]},{"t":"Do not distribute malicious or unauthorized links.","c":[]},{"t":"Do not exploit game systems or promote cheating.","c":[]},{"t":"Do not share private or confidential information.","c":[]},{"t":"Follow platform-specific   community guidelines.","c":[]}]},{"k":"cards","nodes":[{"t":"RULES AND CONDUCT IMPORTANCE:","c":[{"t":"General rules and conduct serve as the foundational ethical and operational framework for all Game Masters. Adherence to these standards is vital because GMs hold powerful administrative privileges and represent the official face of the game. Maintaining strict discipline, neutrality, and adherence to protocol protects the game economy, ensures absolute fairness for all players, and preserves institutional trust between the community and the management team.\nOperational Reminder: Official public-facing posts, announcements, and clarifications must only be published or provided by personnel explicitly authorized to manage the relevant SNS accounts or forum channels.","c":[]}]}]}]}]}]},{"id":"d5a","name":"Day 5-A","title":"Quality Assurance","desc":"QA fundamentals, bug types, testing types, QA procedure and bug reporting.","exam":{"pass_pct":70,"minutes":15,"src":"10 multiple-choice questions from the supplied Day 5-A answer key (pass 7/10). The slides mention a 20-item exam at 80%, but only this 10-question key was supplied."},"sections":[{"id":"qa_found","title":"QA Fundamentals","slides":[{"title":"Learning Objectives","blocks":[{"k":"p","t":"What Will We Learn?"},{"k":"p","t":"An introduction to the fundamental testing methodologies, bug identification processes, and reporting standards required to ensure game stability, functionality, and an optimal player experience."},{"k":"cards","nodes":[{"t":"Understand QAExplain what QA is and why it matters in game development.","c":[]},{"t":"Choose the right test","c":[{"t":"Describe the types of game testing and when each is used.","c":[]}]},{"t":"Follow the process","c":[{"t":"Apply the QA, bug processing, and reporting procedures.","c":[]}]},{"t":"Recognize bugs","c":[{"t":"Identify and name the common types of game bugs.","c":[]}]},{"t":"Report clearly","c":[{"t":"Write a complete bug report that developers can act on.","c":[]}]}]}]},{"title":"Fundamentals of Quality Assurance","blocks":[{"k":"p","t":"Defining Quality Assurance, Quality Control, and Testing"},{"k":"p","t":"QA vs QC vs Testing:"},{"k":"cards","nodes":[{"t":"What Is QUALITY ASSURANCE?","c":[{"t":"Quality Assurance is a systematic process that makes sure a game meets its design requirements and player expectations. It covers the whole development process, not only the final product.\n\nThe core foundation of ELITE aims to deliver high-quality games and further develop well-managed and first-rate game products. ELITE's Online and Mobile Games QA service is specifically designed to ensure our clients’ products are rolled out as soon as possible with the highest level of compatibility, feature compliance, and stability in mind.","c":[]}]}]},{"k":"cards","nodes":[{"t":"Quality Assurance (PREVENTION): Focuses on the process and aims to stop defects before they happen, for example by reviewing designs and setting standards.","c":[]},{"t":"Quality Control (DETECTION)","c":[{"t":"Focuses on the product and checks whether finished work meets the standard.","c":[]}]},{"t":"Testing (ACTIVITY)","c":[{"t":"The hands-on work of running the game to find defects.","c":[]}]}]}]},{"title":"Importance of QA and the Cost of Late Detection","blocks":[{"k":"p","t":"Protecting Players and the Business"},{"k":"p","t":"Even small defects can ruin a player's experience. The later a bug is found, the more it costs to fix, so QA works best when it starts early."},{"k":"p","t":"QUALITY ASSURANCE MATTERS DUE TO THE FOLLOWING REASONS"},{"k":"p","t":"Bugs break immersion and cause frustration. A crash during a boss fight or a stuck tutorial can make players quit within minutes and never return."},{"k":"p","t":"Player experience"},{"k":"p","t":"Reputation and reviews"},{"k":"p","t":"Launch bugs lead to negative reviews, low ratings, and refund requests. Early reviews shape how new players see the game, and a poor first impression is hard to undo."},{"k":"p","t":"Crashes and broken purchase flows directly cost money. If players cannot complete a purchase, claim a reward, or stay connected, the studio loses sales and in-game spending."},{"k":"p","t":"Revenue"},{"k":"p","t":"Console and app store certification requires meeting quality standards. A build that fails certification can be rejected, which delays the release and adds rework and cost."},{"k":"p","t":"Platform compliance"},{"k":"p","t":"Key message for testers: Test early, report clearly, and report quickly."},{"k":"table","rows":[["COST OF A LATE BUG DETECTION (by stage):","","",""],["STAGE","COST","WHAT IT INVOLVES","SAMPLE"],["DESIGN STAGE","LOW","A simple document change, no code.","Wrong reward amount fixed by editing one word/line."],["DEVELOPMENT STAGES","MODERATE","Code changes, new build, retesting.","Wrong reward found in build, fixed, and retested."],["AFTER RELEASE","HIGHEST","Emergency patch, lost players, reputation damage.","Wrong reward exploit, forcing patch and angry reviews."]]}]},{"title":"Quick Reference: Key Terms","blocks":[{"k":"p","t":"Common QA Vocabulary"},{"k":"p","t":"A shared vocabulary helps the team communicate quickly and avoid misunderstandings. These terms are used throughout the session."},{"k":"table","rows":[["COMMON KEY TERMS AND MEANINGS",""],["TERMS","DEFINITION / KEY CONCEPT"],["BUILD","A specific compiled game version identified by number/hash; ensures testers avoid invalid tests on outdated software."],["TEST CASE","A set of steps with expected results for a feature; guarantees repeatable testing across critical player paths."],["REPRODUCTION STEPS","Exact, sequential actions needed to trigger a bug from scratch; eliminates guesswork to accelerate \u000bdebugging."],["SEVERITY vs. PRIORITY","SEVERITY measures technical impact (e.g., game-crashing blockers vs. cosmetic flaws)\u000bPRIORITY measures business or scheduling urgency (e.g., fixing a title-screen typo before a launch)."],["REGRESSION","A previously stable feature that breaks following a recent change; drives regression testing suites to catch unintended side effects."]]}]},{"title":"QA Tester Qualites, Roles and Responsibilites","blocks":[{"k":"p","t":"Responsibilities, Qualities, and Where QA Fits"},{"k":"p","t":"A game QA tester is the team's advocate for the player. QUALITY ASSURANCE is not a final step: quality work begins early and continues after launch."},{"k":"h","t":"Game Tester Responsibilities"},{"k":"cards","nodes":[{"t":"QA QUALITIES","c":[{"t":"Attention to detail","c":[]},{"t":"Curious","c":[]},{"t":"Patience","c":[]},{"t":"Clear Writing","c":[]},{"t":"Player’s Perspective","c":[]}]}]},{"k":"cards","nodes":[{"t":"TEST BUILDSPlay and check each new version against the design and test cases.","c":[]},{"t":"FIND AND REPORT BUGSDocument problems clearly so they can be reproduced.","c":[]},{"t":"VERIFY FIXESRetest fixed bugs and confirm nothing else broke.","c":[]},{"t":"COMMUNICATEShare findings and risks constructively with developers, designers, and leads.","c":[]}]}]}]},{"id":"bugs","title":"Types of Game Bugs","slides":[{"title":"Types of Game Bugs","blocks":[{"k":"lead","t":"A guide to recognizing and categorizing the most common defects in game development."},{"k":"p","t":"Goal: Teach new hires how to accurately recognize, classify, and isolate different types of anomalies."}]},{"title":"Overview and Functional / Gameplay Bugs","blocks":[{"k":"p","t":"What Counts as a Bug and When Mechanics Fail"},{"k":"p","t":"A bug is any behavior that differs from the intended design or expected player experience. Grouping bugs by the area they affect makes them easier to describe, assign, and fix."},{"k":"table","rows":[["FUNCTIONAL AND GAMEPLAY BUG SAMPLES","",""],["Bug Category / Type","Description","Sample Scenario"],["Broken abilities","A skill or ability does not trigger or has no effect.","Spell casts, but deals zero damage."],["Progression blockers","A quest cannot be completed or does not give its reward.","NPC gives no dialogue to finish quest."],["Calculation errors","Wrong damage values, stats, or scores.","Weapon damage scales exponentially per hit."],["Rule failures","Broken win or lose conditions, such as a match that never ends.","Match timer expires without ending game."]]},{"k":"cards","nodes":[{"t":"DEFINITION","c":[{"t":"Any unexpected behavior that deviates from the original plan or design, covering code errors, content issues, or visual flaws.","c":[]}]},{"t":"WHY CATEGORIZE","c":[{"t":"Selecting the proper category efficiently routes every reported bug directly to the correct developer, artist, or team designer.","c":[]}]},{"t":"REPORTING TIP","c":[{"t":"Clearly describe what you see happening on your screen instead of guessing what the underlying cause might be.","c":[]}]}]}]},{"title":"Crash, Freeze and Performance Bugs","blocks":[{"k":"p","t":"When the Game Stops, Hangs, or Runs Poorly"},{"k":"p","t":"These bugs affect stability and smoothness. They are usually among the most serious because they interrupt play or make the game unplayable."},{"k":"table","rows":[["CRASH, FREEZE AND PERFORMANCE BUG SAMPLES","",""],["Bug Category / Type","Description","Sample Scenario"],["Crash","The game closes unexpectedly to the desktop or \u000bhome screen.","Game abruptly shuts down upon opening the inventory menu."],["Freeze or hang","The game stops responding, including infinite \u000bloading screens.","Loading screen stays at 99% indefinitely after fast \u000btraveling."],["Performance drops","Frame rate drops and stuttering during play.","Framerate plummets to 15 FPS during heavy particle \u000beffects."],["Resource issues","Memory leaks that worsen over time, and \u000boverheating on mobile devices.","RAM usage climbs steadily until the game runs out of \u000bmemory."]]}]},{"title":"Visual, Audio and Localization Bugs","blocks":[{"k":"p","t":"When What Players See, Hear, and Read Is Wrong"},{"k":"p","t":"These bugs affect the presentation of the game and how players interact with it. They may not stop play, but they reduce polish and are very visible to players."},{"k":"table","rows":[["AUDIO AND VISUAL BUG SAMPLES","",""],["Bug Category / Type","Description","Sample Scenario"],["Texture and model issues","Glitches, flickering, stretched textures, or missing models.","Character hair turns bright pink or disappears completely."],["Clipping and collision","Characters or objects passing through walls or each other.","Player walks straight through a closed wooden door."],["Animation issues","Missing, broken, or stuck animations.","Character glides across the ground stuck in a T-pose."],["Audio issues","Missing, looping, or distorted sound, or audio out of sync.","Gunshot sound effects loop endlessly after firing once."]]},{"k":"table","rows":[["UI/UX, TEXT AND LOCALIZATION BUG SAMPLES","",""],["Bug Category / Type","Description","Sample Scenario"],["Text layout","Overlapping or cut-off text, especially in longer translations.","German menu labels overflow outside their button borders."],["Interaction problems","Unresponsive buttons or incorrect navigation.","Clicking \"Confirm\" closes the menu without saving settings."],["Language errors","Wrong translation or missing localization strings.","Item description displays raw code like STR_ITEM_SWORD_01."],["Inconsistency","Mismatched fonts, icons, or layout across screens.","Shop screen uses a different font than the main HUD."]]}]},{"title":"Other Common Bugs","blocks":[{"k":"p","t":"Compatibility, Network, Save, and Economy Issues"},{"k":"p","t":"Some bugs depend on the device, the connection, or the player's data. They can be harder to reproduce and need careful notes."},{"k":"table","rows":[["OTHER BUG SAMPLES","",""],["Bug Category / Type","Description","Sample Scenario"],["Compatibility","Issues on specific devices, OS versions, or \u000bhardware.","Game launches on newer smartphones but immediately crashes on specific older Android device models."],["Network and multiplayer","Lag, desync, disconnects, and matchmaking \u000bfailures.","Players experience severe rubberbanding and frequent \u000bdisconnections during ranked multiplayer matches."],["Save and progression","Lost or corrupted save data.","Loading a saved game file results in an error prompt and reverts the player back to level one."],["Economy and exploits","Duplication glitches, in-app purchase errors, and unintended advantages.","Players can repeatedly sell the same inventory item to \u000bduplicate in-game currency infinitely."]]}]}]},{"id":"types","title":"Types of Game Testing","slides":[{"title":"Types of Game Testing","blocks":[{"k":"lead","t":"An overview of the different testing methods used to evaluate a game's functionality, pe
